<style>

  .tcard { display: grid; grid-template-columns: 1.9em 1fr; gap: 4px 8px; border: 1px solid var(--line); border-left: 5px solid var(--link); border-radius: 8px; padding: 9px 11px; margin-top: 7px; cursor: pointer; background: var(--bg); line-height: 1.4; }
  .tcard:hover { border-color: var(--link); }
  .tcard i { font-style: normal; font-weight: 700; font-size: 1.3em; color: var(--link); grid-row: span 2; }
  .tcard b { font-size: .98em; }
  .tcard span { font-size: .84em; color: var(--muted); }
  details.it { margin: 0; border-bottom: 1px solid var(--line); }

  details.it > div { padding: 0 0 9px 1.05em; }
  .lead { font-size: .85em; color: var(--muted); margin: 2px 0 0 !important; }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .presets span { font-size: .78em; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; color: var(--muted); }
  .presets span:hover { border-color: var(--link); color: var(--link); }
  .hit { margin: 9px 0; line-height: 1.45; }
  .hit small { display: block; color: var(--muted); }
  mark { background: color-mix(in srgb, var(--link) 22%, transparent); color: inherit; border-radius: 2px; }
  /* ---- 오른쪽 보기 ---- */
  main { display: flex; flex-direction: column; }
  #tabs { flex: none; padding: 8px 10px 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #tabs .tg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
  #tabs .tg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); font-weight: 600; padding: 4px 14px; }
  #tabs .tg button:last-child { border-right: 0; } #tabs .tg button.on { background: var(--link); color: #fff; }
  #tabs .tr { display: none; gap: 4px; flex-wrap: wrap; } #tabs .tr.on { display: flex; }
  #tabs .tr button { white-space: nowrap; border-color: transparent; color: var(--muted); }
  #tabs .tr button.on { border-color: var(--link); color: var(--link); font-weight: 600; }
  #view { flex: 1; overflow: auto; padding: 16px 20px 40px; min-height: 0; }
  #view h2 { font-size: 1.1em; margin: 0 0 4px; }
  #view h3 { font-size: .95em; margin: 22px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--line); }
  #view p.note { color: var(--muted); font-size: .86em; margin: 2px 0 10px; max-width: 62em; }
  #graph { flex: 1; position: relative; min-height: 0; display: none; }
  #graph #cy { position: absolute; inset: 0; }
  #gbar { position: absolute; left: 10px; right: 10px; top: 8px; z-index: 5; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
  #gbar > * { pointer-events: auto; }
  #gbar .chips { flex: 1; }
  #gbar .chip { background: var(--panel); }
  #gmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  #gstats { position: absolute; left: 12px; bottom: 8px; font-size: .78em; color: var(--muted); z-index: 5; }
  main.g #view { display: none; } main.g #graph { display: block; }
  .tw { overflow: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
  table.mx { border-collapse: separate; border-spacing: 0; font-size: .82em; }
  table.mx th, table.mx td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; }
  table.mx thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; padding: 4px 3px; font-weight: 600; cursor: pointer; }
  table.mx thead th.v { vertical-align: bottom; padding: 8px 2px 6px; font-weight: 500; }
  table.mx thead th.v > span { display: inline-block; writing-mode: vertical-rl; white-space: nowrap; text-align: left; line-height: 1.25; }
  table.mx tbody th { position: sticky; left: 0; background: var(--panel); z-index: 1; text-align: left; padding: 3px 8px; font-weight: 500; min-width: 11em; max-width: 21em; line-height: 1.3; cursor: pointer; }
  table.mx thead th:first-child { left: 0; z-index: 3; cursor: default; }
  table.mx td { min-width: 2.2em; height: 2em; text-align: center; cursor: pointer; }
  table.mx td.z { cursor: default; }
  table.mx td:not(.z):hover { outline: 2px solid var(--link); outline-offset: -2px; }
  table.mx th:hover { color: var(--link); }
  table.mx .tot { color: var(--muted); padding: 0 6px; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0 0 10px; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--link); color: #fff; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(19em, 1fr)); gap: 0 26px; }
  .rank { list-style: none; padding: 0; margin: 0; }
  .rank li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); line-height: 1.4; cursor: pointer; }
  .rank li:hover b { color: var(--link); }
  .rank b { font-weight: 600; }
  .rank small { color: var(--muted); display: block; }
  .rank em { font-style: normal; color: var(--muted); font-size: .86em; white-space: nowrap; text-align: right; }
  @media (max-width: 760px) {
    main { flex: none; height: 0; overflow: hidden; display: flex; }
    body.graph-open main { height: 60vh; }
    body.graph-open aside { flex: 1; }
    #view { padding: 12px 12px 30px; }
  }
</style>

<body>

<script src="vendor/js-yaml.min.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  // ---------- 0. 보기 설정: 테마와 글씨 크기 (브라우저에 저장) ----------
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const root = document.documentElement;
  root.dataset.theme = store.get("sc26-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  let scale = Math.min(1.6, Math.max(0.8, parseFloat(store.get("sc26-scale")) || 1));
  const applyScale = () => { root.style.setProperty("--scale", scale); store.set("sc26-scale", scale); };
  applyScale();
  const themeLabel = () => { $("theme").textContent = root.dataset.theme === "dark" ? "밝게" : "어둡게"; };
  themeLabel();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const loadYaml = async (path) => {
    const r = await fetch(path, { cache: "no-cache" });
    if (!r.ok) throw new Error(path + " 을(를) 읽을 수 없습니다 (" + r.status + ")");
    return jsyaml.safeLoad(await r.text()) || {};
  };
  const loadJson = async (path) => { try { const r = await fetch(path, { cache: "no-cache" }); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  let core = null;
  const fail = (e) => {
    $("stats").textContent = "데이터를 불러오지 못함.";
    $("detail").innerHTML = "<p>" + esc(e.message) + "</p><p class='muted'>파일을 직접 열었다면 <code>python -m http.server</code>로 실행해야 함.</p>";
  };
  const sNum = (id) => id.replace(/^sess/, "");
  const sTitle = (s) => "(" + sNum(s.id) + ") " + s.label;      // 세션 표기: (번호) 제목 전체
  const CREL = ["addresses", "proposes", "targets"];

  // ---------- 1단계: 고찰에 필요한 파일만 먼저 읽고 첫 화면을 그림 ----------
  let debates = [], numbersX = {};
  let schema = {}, manifest, orgs = {}, people = {}, concepts = {}, sessions = [], presentations = [], overview = {}, themes = [], glossary = {}, changelog = [];
  const nodes = new Map(), edges = [], errors = [];
  let valid = [], full = false, cy = null, A = null;            // full: 발표까지 읽음, A: 지식그래프 분석 결과
  const addNode = (id, type, attrs) => {
    if (nodes.has(id)) errors.push("중복 id: " + id);
    nodes.set(id, Object.assign({ id, type }, attrs));
  };
  const addEdge = (source, rel, target) => edges.push({ source, rel, target });
  try {
    manifest = await loadYaml("data/manifest.yaml");
    if (manifest.bundle) core = await loadJson("data/" + manifest.bundle.core);   // 묶음 파일이 있으면 그것 하나만 읽음. 없거나 깨졌으면 YAML을 읽음.
    const [ov, th, ss, gl, ch] = core ? [core.overview, core.themes, core.sessions, core.glossary, core.changelog] : await Promise.all([
      manifest.overview ? loadYaml("data/" + manifest.overview) : {},
      manifest.themes ? loadYaml("data/" + manifest.themes) : {},
      Promise.all((manifest.sessions || []).map((f) => loadYaml("data/" + f))),
      manifest.glossary ? loadYaml("data/" + manifest.glossary) : {},
      manifest.changelog ? loadYaml("data/" + manifest.changelog) : []]);
    overview = ov; themes = th.themes || []; sessions = ss; glossary = gl || {}; changelog = Array.isArray(ch) ? ch : [];
    const tOrd = (s) => { const i = (overview.topics || []).indexOf(s.topic); return i < 0 ? 99 : i; };   // 주제 순, 그 안에서 번호 순
    sessions.sort((a, b) => tOrd(a) - tOrd(b) || parseInt(sNum(a.id), 10) - parseInt(sNum(b.id), 10));
  } catch (e) { return fail(e); }
  for (const s of sessions) addNode(s.id, "Session", s);

  const sessOptions = [["", `전체 세션 (${sessions.length}개) 종합`],
    ...themes.map((th, i) => ["theme:" + th.id, `심층 요약 ${i + 1}. ${th.label}`]), ...sessions.map((s) => [s.id, sTitle(s)])];
  $("session").innerHTML = sessOptions.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
  const syncSessBtn = () => {
    const v = $("session").value;
    $("sess-btn").firstElementChild.textContent = sessOptions.find((o) => o[0] === v)[1];
    const opt = ([id, l]) => `<div role="option" data-v="${esc(id)}" class="${id === v ? "on" : ""}">${esc(l)}</div>`;
    const tps = [...new Set(sessions.map((s) => s.topic || "그 밖"))];
    $("sess-menu").innerHTML = sessOptions.slice(0, 1 + themes.length).map(opt).join("") +
      tps.map((t) => { const ss = sessions.filter((s) => (s.topic || "그 밖") === t); return `<details ${ss.some((s) => s.id === v) ? "open" : ""}><summary>${esc(t)} <small>${ss.length}개</small></summary>${ss.map((s) => opt([s.id, sTitle(s)])).join("")}</details>`; }).join("");
  };
  syncSessBtn();
  const setSession = (v) => { $("session").value = v; $("session").dispatchEvent(new Event("change")); };
  $("sess-btn").addEventListener("click", () => { $("sess-menu").hidden = !$("sess-menu").hidden; });
  $("sess-menu").addEventListener("click", (e) => {
    const o = e.target.closest("[data-v]");
    if (!o) return;
    $("sess-menu").hidden = true;
    setSession(o.dataset.v);
  });
  const PRESETS = ["원자력", "검증", "에너지", "에이전트", "저장", "보안", "양자", "벤치마크"];
  // 주제어는 관련 낱말까지 함께 찾음. 직접 입력한 검색어는 띄어 쓴 낱말 중 하나라도 있으면 찾음.
  const ALIAS = { "원자력": "원자력 원자로 중성자 핵융합 토카막 플라즈마 방사 핵연료", "검증": "검증 정확성 증명 동등성", "에너지": "에너지 전력 냉각", "저장": "저장 스토리지 파일시스템 입출력",
    "보안": "보안 공격 프라이버시 격리", "양자": "양자", "벤치마크": "벤치마크 측정", "에이전트": "에이전트" };
  const terms = () => { const v = $("q").value.trim(); return (ALIAS[v] || v).toLowerCase().split(/[\s,]+/).filter(Boolean); };
  $("presets").innerHTML = PRESETS.map((p) => `<span>${esc(p)}</span>`).join("");

  // ---------- 2. 왼쪽 패널: 고찰, 상세, 검색 ----------
  const classes = () => schema.classes || {};
  const REL_KO = { partOf: "세션", chairedBy: "좌장", authoredBy: "저자·발표자", affiliatedWith: "소속", addresses: "다루는 문제", proposes: "제안 기법", targets: "대상 시스템", relatedTo: "관련 개념" };
  const INV_KO = { partOf: "발표", chairedBy: "좌장을 맡은 세션", authoredBy: "발표", affiliatedWith: "소속 인물", addresses: "이 문제를 다루는 발표", proposes: "이 기법을 쓰는 발표", targets: "이 시스템을 다루는 발표", relatedTo: "관련 개념" };
  const SRC_KO = { abstract: "초록", talk: "발표", slide: "슬라이드", qa: "질의응답" };
  const nm = (n) => (n.type === "Session" ? sTitle(n) : n.label_ko || n.label || n.id);
  const nodeLink = (id) => { const n = nodes.get(id); return n ? `<span class="link" data-id="${esc(id)}">${esc(n.type === "Session" ? sTitle(n) : n.label_ko ? n.label_ko + " (" + n.label + ")" : n.label)}</span>` : ""; };
  const refChip = (id) => { const n = nodes.get(id), e = full ? evOf(id) : ""; return n ? `<span class="ref e-${e}" data-id="${esc(id)}">${e ? `<i>${EV_MARK[e]}</i>` : ""}${esc(n.label)}</span>` : ""; };
  const VIEWS = [["decision", "1. 결정 주체와 기준", "누가, 무엇을 근거로 판단하는가"], ["trial", "2. 시행착오와 조건", "무엇이 안 됐고, 어떤 조건에서 됐는가"],
    ["korea", "3. 한국 연구기관으로의 적용", "초록을 바탕으로 한 제안임"], ["extra", "4. 그 밖의 포인트", ""]];
  let panel = null;                                             // 지금 왼쪽에 보이는 목록 화면 (상세에서 돌아갈 곳)
  let curNode = null;                                           // 지금 상세로 보고 있는 노드
  const put = (h, keep) => { const t = $("detail").scrollTop; $("detail").innerHTML = h; $("detail").scrollTop = keep ? t : 0; syncHash(); };
  // 주소에 지금 상태를 담음: #s=세션, v=탭, n=노드, q=검색어. 이 주소를 보내면 같은 화면이 열림.
  function syncHash() {
    const o = { s: $("session").value, v: curView === "heat" ? "" : curView, n: curNode || "", q: curNode ? "" : $("q").value.trim() };
    const h = Object.entries(o).filter(([, v]) => v).map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
    try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {}
  }
  const hash0 = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map((x) => { const i = x.indexOf("="); return [x.slice(0, i), decodeURIComponent(x.slice(i + 1))]; }));
  // 용어 풀이: 글 안의 용어에 점선 밑줄을 긋고, 누르면 설명을 보여 줌
  const gKeys = Object.keys(glossary).sort((a, b) => b.length - a.length);
  const gRe = gKeys.length ? new RegExp(gKeys.map((k) => (/^[A-Za-z]/.test(k) ? "\\b" : "") + k.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&") + (/[A-Za-z]$/.test(k) ? "\\b" : "")).join("|"), "g") : null;
  const gloss = (html) => { if (!gRe) return html; const seen = new Set(); return html.replace(gRe, (m) => (seen.has(m) ? m : (seen.add(m), `<span class="g" data-g="g${gKeys.indexOf(m)}">${m}</span>`))); };
  document.addEventListener("click", (e) => {
    const g = e.target.closest(".g");
    if (!g) { $("gloss").hidden = true; return; }
    const k = gKeys[+g.dataset.g.slice(1)];
    $("gloss").innerHTML = `<b>${esc(k)}</b> ${esc(glossary[k])}`; $("gloss").hidden = false;
    e.stopPropagation();
  }, true);
  // 근거 수준: 발표가 수치를 제시하는지, 정성적인지, 공개 설명 없이 제목뿐인지

      c.ps.forEach((p, i) => {
        const a = -Math.PI / 2 + (2 * Math.PI * i) / c.ps.length;
        angle.set(p.id, a); home.set(p.id, c); ringOf.set(p.id, c.ps.length);
        pos.set(p.id, { x: c.x + c.R * Math.cos(a), y: c.y + c.R * Math.sin(a) });
      });
    }
    const fan = (items, pid, r0, step, spread) => items.forEach((id, i) => {
      const a = angle.get(pid) + (items.length > 1 ? (i / (items.length - 1) - 0.5) * spread : 0), c = home.get(pid);
      const r = c.R + r0 + (i % 2) * step;
      pos.set(id, { x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) });
    });
    const mean = (ids, k) => ids.reduce((s, v) => s + pos.get(v)[k], 0) / ids.length;
    const inner = [], bridge = [];
    [["Problem", "Method", "System"], ["Person"]].forEach((types, tier) => {
      const own = new Map();
      for (const nd of nodes.values()) {
        if (!types.includes(nd.type) || !vis(nd.id)) continue;
        const ps = adj.get(nd.id).filter((v) => angle.has(v));
        if (ps.length === 1) (own.get(ps[0]) || own.set(ps[0], []).get(ps[0])).push(nd.id);
        else if (ps.length > 1) (new Set(ps.map((v) => home.get(v))).size > 1 ? bridge : inner).push([nd.id, ps, tier]);
      }
      for (const [pid, items] of own) {
        items.sort((u, v) => nodes.get(u).type.localeCompare(nodes.get(v).type));
        fan(items, pid, tier ? 560 : 230, tier ? 90 : 130, (2 * Math.PI / ringOf.get(pid)) * 0.82);
      }
    });
    const seen = new Map();
    inner.forEach(([id, ps, tier], i) => {
      const c = home.get(ps[0]);
      const mx = mean(ps, "x") - c.x, my = mean(ps, "y") - c.y, d = Math.hypot(mx, my);
      const a = d > 20 ? Math.atan2(my, mx) : angle.get(ps[0]) + 1.0 + i * 0.7;   // 마주 보는 발표끼리 공유하면 방향을 임의로 정한다
      const r = tier ? c.R + 760 + (i % 4) * 45 : Math.max(130 + (i % 3) * 60, Math.min(d * 0.6, c.R - 110));
      const key = [...ps].sort().join("|"), j = seen.get(key) || 0;                // 같은 발표 조합을 공유하는 개념은 옆으로 벌린다
      seen.set(key, j + 1);
      const a2 = a + Math.ceil(j / 2) * (j % 2 ? 1 : -1) * (95 / r);
      pos.set(id, { x: c.x + r * Math.cos(a2), y: c.y + r * Math.sin(a2) });
    });
    const groups = new Map();                // 공유하는 세션 조합마다 한 묶음
    for (const [id, ps] of bridge) {
      const cs = [...new Set(ps.map((v) => home.get(v)))];
      const key = cs.map((c) => c.id).sort().join("|");
      (groups.get(key) || groups.set(key, { cs, items: [] }).get(key)).items.push(id);
    }
    const used = new Map();
    for (const { cs, items } of groups.values()) {
      const gx = cs.reduce((s, c) => s + c.x, 0) / cs.length, gy = cs.reduce((s, c) => s + c.y, 0) / cs.length;
      if (cs.length === 2) {                 // 두 세션 사이: 두 중심을 잇는 선에 수직으로 늘어놓는다
        const dx = cs[1].x - cs[0].x, dy = cs[1].y - cs[0].y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
        const t0 = (cs[0].outer + (L - cs[1].outer)) / 2 - L / 2;       // 두 바깥 고리 사이의 가운데로 보정
        items.forEach((id, i) => {
          const k = (i - (items.length - 1) / 2) * 105, o = t0 + ((i % 3) - 1) * 150;
          pos.set(id, { x: gx + ux * o - uy * k, y: gy + uy * o + ux * k });
        });
      } else {                               // 셋 이상이 공유: 전체 중심에 격자로
        const cols = Math.ceil(Math.sqrt(items.length)), rows = Math.ceil(items.length / cols);
        const key = Math.round(gx / 300) + "," + Math.round(gy / 300), off = used.get(key) || 0;   // 중심이 겹치는 묶음은 아래로 이어 붙인다
        used.set(key, off + rows * 120 + 60);
        items.forEach((id, i) => pos.set(id, { x: gx + ((i % cols) - (cols - 1) / 2) * 230, y: gy + off + (Math.floor(i / cols) - (rows - 1) / 2) * 120 }));
      }
    }
    // 나머지(기관, 좌장, 발표와 직접 연결되지 않은 개념): 이웃의 중심에서 바깥으로
    const rest = [...nodes.keys()].filter((id) => vis(id) && !pos.has(id))
      .sort((u, v) => (nodes.get(u).type === "Organization") - (nodes.get(v).type === "Organization"));
    rest.forEach((id, i) => {
      const nb = adj.get(id).filter((v) => pos.has(v));
      if (nb.length && centers.length) {
        const px = mean(nb, "x"), py = mean(nb, "y");
        const c = centers.reduce((best, k) => (Math.hypot(k.x - px, k.y - py) < Math.hypot(best.x - px, best.y - py) ? k : best));
        const d = Math.hypot(px - c.x, py - c.y), isOrg = nodes.get(id).type === "Organization";
        const a = d > 20 ? Math.atan2(py - c.y, px - c.x) + ((i % 3) - 1) * 0.05 : (2 * Math.PI * i) / rest.length;
        const r = isOrg ? Math.max(d + 170, c.R + 980) + (i % 3) * 70 : d > 20 ? d + 120 + (i % 3) * 50 : c.R + 860;
        pos.set(id, { x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) });
      } else {
        const a = (2 * Math.PI * i) / rest.length;
        pos.set(id, { x: 1400 * Math.cos(a), y: 1400 * Math.sin(a) });
      }
    });
    cy.nodes().forEach((nd) => { const q = pos.get(nd.id()); if (q) nd.position(q); });
    cy.fit(cy.elements().not(".hidden"), 40);
  }
  // 단순 보기: 세션과 주요 개념만 그림. 세션은 원 위에, 개념은 자신을 다룬 세션들의 무게중심에 놓음.
  let expandAll = false;
  const isCompact = () => !/^sess/.test($("session").value) && !expandAll;
  function layoutCompact() {
    const vis = (id) => !cy.getElementById(id).hasClass("hidden"), pos = new Map();
    const S = sessions.filter((s) => vis(s.id)), R = Math.max(2400, S.length * 210);
    S.forEach((s, i) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / S.length; pos.set(s.id, { x: R * Math.cos(a), y: R * Math.sin(a) }); });
    const taken = new Set(), CW = 980, CH = 420, offs = [];
    for (let dx = -7; dx <= 7; dx++) for (let dy = -9; dy <= 9; dy++) offs.push([dx, dy]);
    offs.sort((a, b) => Math.hypot(a[0] * CW, a[1] * CH) - Math.hypot(b[0] * CW, b[1] * CH));
    S.forEach((s) => { const q = pos.get(s.id); for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) taken.add(Math.round(q.x / CW + dx) + "," + Math.round(q.y / CH + dy)); });
    const cs = [...nodes.values()].filter((n) => A.cs.has(n.id) && vis(n.id)).map((n) => {
      let x = 0, y = 0, w = 0, k = 0;
      A.cs.get(n.id).forEach((ps, sid) => { const q = pos.get(sid); if (q) { x += q.x * ps.length; y += q.y * ps.length; w += ps.length; k++; } });
      return [n.id, w ? x / w : 0, w ? y / w : 0, k];
    }).sort((a, b) => b[3] - a[3]);
    cs.forEach(([id, x, y, k]) => {
      const f = k > 1 ? 0.86 : 1.22;                              // 한 세션만의 개념은 원 바깥으로
      const gx = Math.round((x * f) / CW), gy = Math.round((y * f) / CH);
      const o = offs.find(([dx, dy]) => !taken.has(gx + dx + "," + (gy + dy))) || [0, 0];
      taken.add(gx + o[0] + "," + (gy + o[1]));
      pos.set(id, { x: (gx + o[0]) * CW, y: (gy + o[1]) * CH });
    });
    cy.nodes().forEach((nd) => { const q = pos.get(nd.id()); if (q) nd.position(q); });
    cy.fit(cy.elements().not(".hidden"), 40);
  }
  function applyFilter(relayout) {
    const q = terms();
    cy.batch(() => {
      const sv = $("session").value, compact = isCompact(), thSet = sv.startsWith("theme:") ? new Set(themes.find((x) => "theme:" + x.id === sv).concepts) : null;
      cy.nodes().forEach((n) => {
        const d = nodes.get(n.id());
        const show = compact
          ? (d.type === "Session" ? visible.Session && inScope(d.id) : A.cs.has(d.id) && visible[d.type] && (thSet ? thSet.has(d.id) : A.cs.get(d.id).size >= Math.max(4, Math.round(sessions.length / 5))))
          : visible[d.type] && inScope(d.id);
        n.toggleClass("hidden", !show); n.toggleClass("big", compact);
      });
      const oneSess = /^sess/.test($("session").value);
      cy.edges().forEach((e) => { const agg = e.hasClass("agg"); e.toggleClass("hidden", e.source().hasClass("hidden") || e.target().hasClass("hidden") || (agg ? oneSess || (!compact && e.data("count") < 2) : compact)); });
      cy.nodes().forEach((n) => n.data("deg", compact ? n.connectedEdges().not(".hidden").length : n.connectedEdges().not(".hidden").not(".agg").length));
      cy.elements().removeClass("faded");
      if (q.length) {
        const hit = cy.nodes().not(".hidden").filter((n) => {
          const d = nodes.get(n.id()), txt = [d.id, d.label, d.label_ko, d.summary_ko, ...(d.claims || []).map((c) => (typeof c === "string" ? c : c.text))].join(" ").toLowerCase();
          return q.some((w) => txt.includes(w));
        });
        cy.elements().not(hit.union(hit.neighborhood())).addClass("faded");
      }
    });
    const vn = cy.nodes().not(".hidden").length, ve = cy.edges().not(".hidden").not(".agg").length;
    $("gstats").textContent = isCompact()
      ? `세션과 여러 세션에 걸친 개념 ${vn}개 · 노드 크기는 연결 수, 선의 굵기는 그 세션에서 개념을 다룬 발표 수 · 세션을 누르면 발표가 펼쳐짐`
      : `노드 ${vn} / ${nodes.size} · 관계 ${ve} / ${valid.length} · 굵은 파란 선은 세션에서 그 개념을 다룬 발표 수`;
    $("expand").checked = expandAll; $("expand").closest("label").classList.toggle("off", !expandAll);
    $("expand").closest("label").style.display = /^sess/.test($("session").value) ? "none" : "";
    if (relayout) (isCompact() ? layoutCompact : layout)();
  }
  function focusGraph(id) {
    const n = cy.getElementById(id);
    if (n.hasClass("hidden")) {           // 숨겨진 종류의 노드를 고르면 그 종류를 켠다
      const t = nodes.get(id).type;
      if (isCompact()) { if (t === "Presentation") { $("session").value = nodes.get(id).session; syncSessBtn(); } else expandAll = true; }
      visible[t] = true;
      const chip = document.querySelector(`.chip[data-t="${t}"]`);
      chip.classList.remove("off"); chip.querySelector("input").checked = true;
      if (!inScope(id)) { $("session").value = ""; syncSessBtn(); }
      applyFilter(true);
    }
    cy.elements().removeClass("faded focus hl");
    const hood = n.closedNeighborhood();
    cy.elements().not(hood).addClass("faded");
    n.addClass("focus"); hood.edges().addClass("hl");
  }
  let graphReady = null;
  function ensureGraph() {
    if (graphReady) { if (cy) cy.resize(); return graphReady; }
    graphReady = (async () => {
      await dataReady;
      if (!window.cytoscape) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "vendor/cytoscape.min.js"; s.onload = ok; s.onerror = () => no(new Error("그래프 라이브러리를 읽지 못함")); document.head.appendChild(s); });
      await new Promise((r) => setTimeout(r, 30));              // "그리는 중" 문구가 먼저 보이게 함
      const aggCount = new Map();
      A.cs.forEach((m, c) => m.forEach((ps, s) => aggCount.set(s + "|" + c, ps.length)));
      const aggEdges = [...aggCount].map(([k, c], i) => {
        const [s, c2] = k.split("|");
        return { data: { id: "a" + i, source: s, target: c2, rel: `발표 ${c}건`, count: c }, classes: "agg" };
      });
      cy = cytoscape({
        container: $("cy"),
        elements: [
          ...[...nodes.values()].map((n) => ({ data: { id: n.id, type: n.type, text: nm(n) } })),
          ...valid.map((e, i) => ({ data: { id: "e" + i, source: e.source, target: e.target, rel: e.rel } })),
          ...aggEdges,
        ],
        style: graphStyle(),
      });
      cy.on("tap", "node", (e) => {
        const id = e.target.id();
        if (isCompact() && nodes.get(id).type === "Session") return setSession(id);   // 단순 보기에서 세션을 누르면 발표가 펼쳐짐
        showDetail(id); focusGraph(id);
      });
      cy.on("tap", (e) => { if (e.target === cy) { cy.elements().removeClass("focus hl"); applyFilter(false); (panel || showOverview)(); } });
      applyFilter(true);
      $("gmsg").style.display = "none";
      window.__cy = cy;
    })().catch((e) => { $("gmsg").textContent = e.message; });
    return graphReady;
  }
  async function openGraph(id) {
    curView = "graph";
    document.body.classList.add("graph-open"); syncToggle();
    renderView();
    await ensureGraph();
    if (cy) { cy.resize(); if (id) { focusGraph(id); cy.animate({ fit: { eles: cy.getElementById(id).closedNeighborhood(), padding: 60 } }, { duration: 300 }); } }
  }
  $("chips").addEventListener("change", (e) => {
    const chip = e.target.closest(".chip");
    visible[chip.dataset.t] = e.target.checked;
    chip.classList.toggle("off", !e.target.checked);
    if (cy) applyFilter(true);
  });
  $("gbar").addEventListener("change", (e) => { if (e.target.id === "expand") { expandAll = e.target.checked; if (cy) applyFilter(true); } });
  $("fit").addEventListener("click", () => cy && cy.fit(cy.elements().not(".hidden"), 40));

  // ---------- 5. 공통 조작 ----------
  $("theme").addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    store.set("sc26-theme", root.dataset.theme);
    themeLabel();
    if (cy) cy.style(graphStyle());
  });
  const resized = () => { if (cy) cy.resize(); };
  let closedForPrint = [];
  $("print").addEventListener("click", () => window.print());
  addEventListener("beforeprint", () => { closedForPrint = [...document.querySelectorAll("#detail details:not([open]), #view details:not([open])")]; closedForPrint.forEach((d) => (d.open = true)); });
  addEventListener("afterprint", () => { closedForPrint.forEach((d) => (d.open = false)); document.body.classList.remove("pv", "ps"); pageStyle.textContent = ""; });
  const split = $("split");
  const savedW = parseFloat(store.get("sc26-aside-w"));
  if (savedW) root.style.setProperty("--aside-w", Math.min(savedW, innerWidth * 0.85) + "px");
  split.addEventListener("pointerdown", (e) => { split.setPointerCapture(e.pointerId); split.classList.add("drag"); e.preventDefault(); });
  split.addEventListener("pointermove", (e) => {
    if (!split.classList.contains("drag")) return;
    root.style.setProperty("--aside-w", Math.max(260, Math.min(e.clientX, innerWidth - 160)) + "px");
    resized();
  });
  const endDrag = () => {
    if (!split.classList.contains("drag")) return;
    split.classList.remove("drag");
    store.set("sc26-aside-w", parseFloat(getComputedStyle(root).getPropertyValue("--aside-w")));
    resized();
  };
  split.addEventListener("pointerup", endDrag);
  split.addEventListener("pointercancel", endDrag);
  split.addEventListener("dblclick", () => { root.style.removeProperty("--aside-w"); store.set("sc26-aside-w", ""); resized(); });
  const syncToggle = () => { $("toggle-graph").textContent = document.body.classList.contains("graph-open") ? "분석·지식그래프 접기 ▼" : "분석·지식그래프 펼치기 ▲"; };
  $("toggle-graph").addEventListener("click", () => {       // 모바일: 오른쪽 보기 펼치기/접기
    document.body.classList.toggle("graph-open"); syncToggle();
    if (cy && curView === "graph") { cy.resize(); cy.fit(cy.elements().not(".hidden"), 30); }
  });
  $("fs-up").addEventListener("click", () => { scale = Math.min(1.6, +(scale + 0.1).toFixed(2)); applyScale(); resized(); });
  $("fs-down").addEventListener("click", () => { scale = Math.max(0.8, +(scale - 0.1).toFixed(2)); applyScale(); resized(); });

  // ---------- 첫 화면 ----------
  if (hash0.s && sessOptions.some((o) => o[0] === hash0.s)) { $("session").value = hash0.s; syncSessBtn(); }
  if (hash0.v) { curView = hash0.v === "apply" ? (planMode = "stage", "plan") : hash0.v; syncTabs(); if (curView !== "heat") { document.body.classList.add("graph-open"); syncToggle(); } }
  const keepHash = location.hash;
  showOverview();
  if (keepHash) try { history.replaceState(null, "", keepHash); } catch (e) {}   // 2단계가 끝날 때까지 받은 주소를 유지
  $("stats").textContent = `세션 ${sessions.length}개 · 발표를 불러오는 중…`;
  window.__first = true;

  // ---------- 2단계: 발표·개념·인물을 읽어 지식그래프를 완성하고 분석 보기를 채움 ----------
  const dataReady = (async () => {
    const rest = core ? await loadJson("data/" + manifest.bundle.rest) : null;
    if (rest) { schema = core.schema; ({ orgs, people, concepts, presentations } = rest); debates = rest.debates || []; numbersX = rest.numbers || {}; }
    else {
      [schema, orgs, people, concepts] = await Promise.all(["schema.yaml", "data/orgs.yaml", "data/people.yaml", "data/concepts.yaml"].map(loadYaml));
      presentations = await Promise.all((manifest.presentations || []).map((f) => loadYaml("data/" + f)));
      if (manifest.debates) debates = (await loadYaml("data/" + manifest.debates)).debates || [];
      if (manifest.numbers) numbersX = await loadYaml("data/" + manifest.numbers);
    }
    for (const [id, name] of Object.entries(orgs)) addNode(id, "Organization", { label: name });
    for (const [id, p] of Object.entries(people)) { addNode(id, "Person", { label: p.name }); (p.orgs || []).forEach((o) => addEdge(id, "affiliatedWith", o)); }
    for (const [type, items] of Object.entries(concepts))
      for (const [id, c] of Object.entries(items || {})) { addNode(id, type, { label: c.label, label_ko: c.label_ko, group: c.group || "그 밖" }); (c.related || []).forEach((r) => addEdge(id, "relatedTo", r)); }
    for (const s of sessions) (s.chairs || []).forEach((c) => addEdge(s.id, "chairedBy", c));
    const FIELD_REL = { authors: "authoredBy", addresses: "addresses", proposes: "proposes", targets: "targets" };
    for (const p of presentations) {
      addNode(p.id, "Presentation", p);
      addEdge(p.id, "partOf", p.session);
      for (const [field, rel] of Object.entries(FIELD_REL)) (p[field] || []).forEach((t) => addEdge(p.id, rel, t));
    }
    valid = edges.filter((e) => {                               // 스키마 검증
      const s = nodes.get(e.source), t = nodes.get(e.target), rule = (schema.relations || {})[e.rel];
      if (!s || !t) { errors.push(`${e.rel}: 없는 노드 (${e.source} → ${e.target})`); return false; }
      if (!rule) { errors.push("정의되지 않은 관계: " + e.rel); return false; }
      if (!rule.from.includes(s.type) || !rule.to.includes(t.type)) { errors.push(`${e.rel}: ${s.type}(${s.id}) → ${t.type}(${t.id}) 허용되지 않음`); return false; }
      return true;
    });
    if (errors.length) { $("warn").style.display = "block"; $("warn").textContent = "스키마 경고 " + errors.length + "건\n" + errors.join("\n"); }
    Object.keys(classes()).forEach((t) => (visible[t] = !["Person", "Organization"].includes(t)));
    $("chips").innerHTML = Object.entries(classes()).map(([t, c]) =>
      `<label class="chip ${visible[t] ? "" : "off"}" data-t="${esc(t)}"><input type="checkbox" ${visible[t] ? "checked" : ""}><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.label_ko || t)}</label>`).join("");
    A = analyse(); full = true;
    const nC = [...nodes.values()].filter((n) => ["Problem", "Method", "System"].includes(n.type)).length;
    $("stats").textContent = `세션 ${sessions.length} · 발표 ${presentations.length} · 개념 ${nC} · 인물 ${Object.keys(people).length} · 기관 ${Object.keys(orgs).length}`;
  })();
  try { await dataReady; } catch (e) { return fail(e); }
  if (hash0.q) { $("q").value = hash0.q; showSearch(); }
  else if (hash0.n && nodes.has(hash0.n)) showDetail(hash0.n);
  else if (panel && !$("back")) panel(true);                                       // 근거 발표 이름을 채워 다시 그림 (스크롤 유지)
  renderView();
  window.__ready = true;
})();

</script>
