<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC26 고찰과 온톨로지</title>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --line:#e7e5e4; --text:#1c1917; --muted:#78716c; --link:#2563eb; --chip:#f5f5f4; --scale:1; }
  :root[data-theme="dark"] { --bg:#1c1917; --panel:#292524; --line:#44403c; --text:#f5f5f4; --muted:#a8a29e; --link:#93c5fd; --chip:#3a3532; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: calc(15px * var(--scale))/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--text); background: var(--bg); display: flex; }
  aside { width: min(calc(460px * var(--scale)), 60vw); flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100%; }
  header { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 10px; }
  header > div:first-child { flex: 1; min-width: 0; }
  h1 { font-size: 1.2em; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: .82em; }
  .tools { display: flex; gap: 4px; flex: none; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; padding: 4px 9px; line-height: 1.3; }
  button:hover { background: var(--chip); }
  .controls { padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .controls input[type=search], .controls select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; margin-bottom: 8px; background: var(--panel); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: .82em; user-select: none; }
  .chip input { display: none; }
  .chip .dot { width: .7em; height: .7em; border-radius: 50%; }
  .chip.off { opacity: .4; }
  #detail { padding: 14px 18px 30px; overflow-y: auto; flex: 1; }
  #detail h2 { font-size: 1.1em; margin: 4px 0 2px; line-height: 1.35; }
  #detail h3 { font-size: .78em; letter-spacing: .04em; color: var(--muted); margin: 16px 0 4px; }
  #detail p { margin: 4px 0; }
  #detail ul { margin: 4px 0; padding-left: 1.2em; }
  #detail li { margin: 5px 0; }
  .insight h3 { font-size: .95em !important; color: var(--text) !important; letter-spacing: 0 !important; margin-top: 18px !important; padding-bottom: 3px; border-bottom: 2px solid var(--line); }
  .insight h3 small { font-weight: 400; color: var(--muted); }
  .ref { display: inline-block; font-size: .76em; color: var(--link); background: var(--chip); border-radius: 4px; padding: 0 6px; margin: 2px 3px 0 0; cursor: pointer; }
  .ref:hover { text-decoration: underline; }
  .tag { display: inline-block; font-size: .76em; color: #fff; border-radius: 4px; padding: 1px 7px; }
  .muted { color: var(--muted); }
  .src { font-size: .72em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  .photos img { width: 100%; border-radius: 6px; border: 1px solid var(--line); margin-top: 6px; display: block; }
  a, .link { color: var(--link); }
  .link { cursor: pointer; }
  .link:hover { text-decoration: underline; }
  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--muted); font-size: .88em; }
  #warn { display: none; background: #fef3c7; color: #92400e; font-size: .82em; padding: 8px 18px; border-bottom: 1px solid #fde68a; white-space: pre-wrap; }
  main { flex: 1; position: relative; min-width: 0; }
  #cy { position: absolute; inset: 0; }
  #fit { position: absolute; right: 14px; top: 14px; z-index: 5; }
  @media (max-width: 760px) { body { flex-direction: column; } aside { width: 100%; height: 55%; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <header>
    <div>
      <h1>SC26 고찰과 온톨로지</h1>
      <p id="stats">불러오는 중…</p>
    </div>
    <div class="tools">
      <button id="fs-down" title="글씨 작게" aria-label="글씨 작게">가−</button>
      <button id="fs-up" title="글씨 크게" aria-label="글씨 크게">가+</button>
      <button id="theme" title="밝은/어두운 테마 전환"></button>
    </div>
  </header>
  <div id="warn"></div>
  <div class="controls">
    <select id="session"></select>
    <input id="q" type="search" placeholder="그래프에서 검색 (제목, 개념, 인물)">
    <div class="chips" id="chips"></div>
  </div>
  <div id="detail"></div>
</aside>
<main>
  <button id="fit">화면 맞춤</button>
  <div id="cy"></div>
</main>

<script src="vendor/js-yaml.min.js"></script>
<script src="vendor/cytoscape.min.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  // ---------- 0. 보기 설정: 테마와 글씨 크기 (브라우저에 저장) ----------
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const root = document.documentElement;
  root.dataset.theme = store.get("sc26-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  let scale = Math.min(1.6, Math.max(0.8, parseFloat(store.get("sc26-scale")) || 1));
  const applyScale = () => { root.style.setProperty("--scale", scale); store.set("sc26-scale", scale); };
  applyScale();
  const themeLabel = () => { document.getElementById("theme").textContent = root.dataset.theme === "dark" ? "밝게" : "어둡게"; };
  themeLabel();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const loadYaml = async (path) => {
    const r = await fetch(path, { cache: "no-cache" });
    if (!r.ok) throw new Error(path + " 을(를) 읽을 수 없습니다 (" + r.status + ")");
    return jsyaml.safeLoad(await r.text()) || {};
  };

  // ---------- 1. YAML 읽기 ----------
  let schema, manifest, orgs, people, concepts, sessions, presentations, overview = {};
  try {
    [schema, manifest, orgs, people, concepts] = await Promise.all(
      ["schema.yaml", "data/manifest.yaml", "data/orgs.yaml", "data/people.yaml", "data/concepts.yaml"].map(loadYaml));
    sessions = await Promise.all((manifest.sessions || []).map((f) => loadYaml("data/" + f)));
    presentations = await Promise.all((manifest.presentations || []).map((f) => loadYaml("data/" + f)));
    overview = manifest.overview ? await loadYaml("data/" + manifest.overview) : {};
  } catch (e) {
    $("stats").textContent = "데이터를 불러오지 못했습니다.";
    $("detail").innerHTML = "<p>" + esc(e.message) + "</p><p class='muted'>파일을 직접 열었다면 <code>python -m http.server</code>로 실행해 주세요.</p>";
    return;
  }

  // ---------- 2. 그래프 구성 + 스키마 검증 ----------
  const nodes = new Map(), edges = [], errors = [];
  const addNode = (id, type, attrs) => {
    if (nodes.has(id)) errors.push("중복 id: " + id);
    nodes.set(id, Object.assign({ id, type }, attrs));
  };
  const addEdge = (source, rel, target) => edges.push({ source, rel, target });

  for (const [id, name] of Object.entries(orgs)) addNode(id, "Organization", { label: name });
  for (const [id, p] of Object.entries(people)) {
    addNode(id, "Person", { label: p.name });
    (p.orgs || []).forEach((o) => addEdge(id, "affiliatedWith", o));
  }
  for (const [type, items] of Object.entries(concepts))
    for (const [id, c] of Object.entries(items || {})) {
      addNode(id, type, { label: c.label, label_ko: c.label_ko });
      (c.related || []).forEach((r) => addEdge(id, "relatedTo", r));
    }
  for (const s of sessions) {
    addNode(s.id, "Session", s);
    (s.chairs || []).forEach((c) => addEdge(s.id, "chairedBy", c));
  }
  const FIELD_REL = { authors: "authoredBy", addresses: "addresses", proposes: "proposes", targets: "targets" };
  for (const p of presentations) {
    addNode(p.id, "Presentation", p);
    addEdge(p.id, "partOf", p.session);
    for (const [field, rel] of Object.entries(FIELD_REL)) (p[field] || []).forEach((t) => addEdge(p.id, rel, t));
  }
  const valid = edges.filter((e) => {
    const s = nodes.get(e.source), t = nodes.get(e.target), rule = (schema.relations || {})[e.rel];
    if (!s || !t) { errors.push(`${e.rel}: 없는 노드 (${e.source} → ${e.target})`); return false; }
    if (!rule) { errors.push("정의되지 않은 관계: " + e.rel); return false; }
    if (!rule.from.includes(s.type) || !rule.to.includes(t.type)) { errors.push(`${e.rel}: ${s.type}(${s.id}) → ${t.type}(${t.id}) 허용되지 않음`); return false; }
    return true;
  });
  if (errors.length) { $("warn").style.display = "block"; $("warn").textContent = "스키마 경고 " + errors.length + "건\n" + errors.join("\n"); }

  // 각 노드가 속한 세션 (세션 필터용): 발표의 세션을 1~2단계 이웃에 전파
  const sessOf = new Map([...nodes.keys()].map((k) => [k, new Set()]));
  for (const s of sessions) sessOf.get(s.id).add(s.id);
  for (const p of presentations) if (sessOf.has(p.id)) sessOf.get(p.id).add(p.session);
  for (let pass = 0; pass < 2; pass++)
    for (const e of valid) if (e.rel !== "relatedTo" && e.rel !== "partOf")
      sessOf.get(e.source).forEach((s) => sessOf.get(e.target).add(s));

  // ---------- 3. 그리기 ----------
  const classes = schema.classes || {};
  const color = (t) => (classes[t] || {}).color || "#888";
  const SIZE = { Session: 56, Presentation: 40, Problem: 28, Method: 28, System: 28, Person: 16, Organization: 22 };
  const SHAPE = { Session: "star", Presentation: "round-rectangle", Problem: "ellipse", Method: "diamond", System: "hexagon", Person: "ellipse", Organization: "rectangle" };
  const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
  function graphStyle() {
    const C = root.dataset.theme === "dark"
      ? { text: "#f5f5f4", bg: "#1c1917", edge: "#57534e", hl: "#d6d3d1" }
      : { text: "#1c1917", bg: "#fafaf9", edge: "#d6d3d1", hl: "#57534e" };
    return [
      { selector: "node", style: {
          "background-color": (n) => color(n.data("type")), shape: (n) => SHAPE[n.data("type")] || "ellipse",
          width: (n) => SIZE[n.data("type")] || 20, height: (n) => SIZE[n.data("type")] || 20,
          label: "data(text)", "font-size": 13, color: C.text, "text-wrap": "wrap", "text-max-width": 150,
          "text-valign": "bottom", "text-margin-y": 4, "text-background-color": C.bg, "text-background-opacity": 0.8, "text-background-padding": 1 } },
      { selector: 'node[type="Presentation"], node[type="Session"]', style: { "font-size": 14, "font-weight": 600 } },
      { selector: "edge", style: { width: 1.2, "line-color": C.edge, "curve-style": "bezier", "target-arrow-shape": "triangle", "target-arrow-color": C.edge, "arrow-scale": 0.7 } },
      { selector: 'edge[rel="relatedTo"]', style: { "line-style": "dashed", "target-arrow-shape": "none" } },
      { selector: ".hidden", style: { display: "none" } },
      { selector: ".faded", style: { opacity: 0.12 } },
      { selector: "node.focus", style: { "border-width": 3, "border-color": C.text } },
      { selector: "edge.hl", style: { "line-color": C.hl, "target-arrow-color": C.hl, width: 2, label: "data(rel)", "font-size": 9, color: C.hl, "text-background-color": C.bg, "text-background-opacity": 1, "text-rotation": "autorotate" } },
    ];
  }
  const cy = cytoscape({
    container: $("cy"),
    elements: [
      ...[...nodes.values()].map((n) => ({ data: { id: n.id, type: n.type, text: short(n.label_ko || n.label || n.id, n.type === "Presentation" ? 44 : 30) } })),
      ...valid.map((e, i) => ({ data: { id: "e" + i, source: e.source, target: e.target, rel: e.rel } })),
    ],
    style: graphStyle(),
  });

  // ---------- 4. 필터 ----------
  const visible = Object.fromEntries(Object.keys(classes).map((t) => [t, !["Person", "Organization"].includes(t)]));
  $("chips").innerHTML = Object.entries(classes).map(([t, c]) =>
    `<label class="chip ${visible[t] ? "" : "off"}" data-t="${esc(t)}"><input type="checkbox" ${visible[t] ? "checked" : ""}><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.label_ko || t)}</label>`).join("");
  $("session").innerHTML = `<option value="">전체 세션 (${sessions.length})</option>` + sessions.map((s) => `<option value="${esc(s.id)}">${esc(s.id)} — ${esc(short(s.label, 40))}</option>`).join("");

  // 결정적 방사형 배치: 세션(중심) → 발표(고리) → 고유 개념(바깥 부채꼴).
  // 한 세션 안에서 공유되는 개념은 고리 안쪽, 여러 세션이 공유하는 개념은 그 세션들 사이에 놓는다.
  function layout() {
    const vis = (id) => !cy.getElementById(id).hasClass("hidden");
    const pos = new Map(), angle = new Map(), home = new Map(), ringOf = new Map();
    const adj = new Map([...nodes.keys()].map((k) => [k, []]));
    valid.forEach((e) => { adj.get(e.source).push(e.target); adj.get(e.target).push(e.source); });
    const bySess = {};
    presentations.filter((p) => vis(p.id)).forEach((p) => (bySess[p.session] ||= []).push(p));
    const showPeople = visible.Person || visible.Organization, GAP = 520;
    const centers = [];
    for (const s of sessions) {
      const ps = bySess[s.id] || [];
      if (!vis(s.id) && !ps.length) continue;
      const R = Math.max(270, ps.length * 50);
      centers.push({ id: s.id, ps, R, outer: R + (showPeople ? 1150 : 420), x: 0, y: 0 });
    }
    const n = centers.length;
    if (n === 2) centers[1].x = centers[0].outer + centers[1].outer + GAP;
    else if (n > 2) {                       // 세션 중심을 큰 원 위에 놓는다
      let Rc = 0;
      centers.forEach((c, i) => { const d = centers[(i + 1) % n]; Rc = Math.max(Rc, (c.outer + d.outer + GAP) / (2 * Math.sin(Math.PI / n))); });
      centers.forEach((c, i) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / n; c.x = Rc * Math.cos(a); c.y = Rc * Math.sin(a); });
    }
    for (const c of centers) {
      if (vis(c.id)) pos.set(c.id, { x: c.x, y: c.y });
      c.ps.forEach((p, i) => {
        const a = -Math.PI / 2 + (2 * Math.PI * i) / c.ps.length;
        angle.set(p.id, a); home.set(p.id, c); ringOf.set(p.id, c.ps.length);
        pos.set(p.id, { x: c.x + c.R * Math.cos(a), y: c.y + c.R * Math.sin(a) });
      });
    }
    const fan = (items, pid, r0, step, spread) => items.forEach((id, i) => {
      const a = angle.get(pid) + (items.length > 1 ? (i / (items.length - 1) - 0.5) * spread : 0), c = home.get(pid);
      const r = c.R + r0 + (i % 2) * step;
      pos.set(id, { x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) });
    });
    const mean = (ids, k) => ids.reduce((s, v) => s + pos.get(v)[k], 0) / ids.length;
    const inner = [], bridge = [];
    [["Problem", "Method", "System"], ["Person"]].forEach((types, tier) => {
      const own = new Map();
      for (const nd of nodes.values()) {
        if (!types.includes(nd.type) || !vis(nd.id)) continue;
        const ps = adj.get(nd.id).filter((v) => angle.has(v));
        if (ps.length === 1) (own.get(ps[0]) || own.set(ps[0], []).get(ps[0])).push(nd.id);
        else if (ps.length > 1) (new Set(ps.map((v) => home.get(v))).size > 1 ? bridge : inner).push([nd.id, ps, tier]);
      }
      for (const [pid, items] of own) {
        items.sort((u, v) => nodes.get(u).type.localeCompare(nodes.get(v).type));
        fan(items, pid, tier ? 560 : 230, tier ? 90 : 130, (2 * Math.PI / ringOf.get(pid)) * 0.82);
      }
    });
    const seen = new Map();
    inner.forEach(([id, ps, tier], i) => {
      const c = home.get(ps[0]);
      const mx = mean(ps, "x") - c.x, my = mean(ps, "y") - c.y, d = Math.hypot(mx, my);
      const a = d > 20 ? Math.atan2(my, mx) : angle.get(ps[0]) + 1.0 + i * 0.7;   // 마주 보는 발표끼리 공유하면 방향을 임의로 정한다
      const r = tier ? c.R + 760 : Math.max(130 + (i % 3) * 60, Math.min(d * 0.6, c.R - 110));
      const key = [...ps].sort().join("|"), j = seen.get(key) || 0;                // 같은 발표 조합을 공유하는 개념은 옆으로 벌린다
      seen.set(key, j + 1);
      const a2 = a + Math.ceil(j / 2) * (j % 2 ? 1 : -1) * (95 / r);
      pos.set(id, { x: c.x + r * Math.cos(a2), y: c.y + r * Math.sin(a2) });
    });
    const groups = new Map();                // 공유하는 세션 조합마다 한 묶음
    for (const [id, ps] of bridge) {
      const cs = [...new Set(ps.map((v) => home.get(v)))];
      const key = cs.map((c) => c.id).sort().join("|");
      (groups.get(key) || groups.set(key, { cs, items: [] }).get(key)).items.push(id);
    }
    for (const { cs, items } of groups.values()) {
      const gx = cs.reduce((s, c) => s + c.x, 0) / cs.length, gy = cs.reduce((s, c) => s + c.y, 0) / cs.length;
      if (cs.length === 2) {                 // 두 세션 사이: 두 중심을 잇는 선에 수직으로 늘어놓는다
        const dx = cs[1].x - cs[0].x, dy = cs[1].y - cs[0].y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
        const t0 = (cs[0].outer + (L - cs[1].outer)) / 2 - L / 2;       // 두 바깥 고리 사이의 가운데로 보정
        items.forEach((id, i) => {
          const k = (i - (items.length - 1) / 2) * 105, o = t0 + ((i % 3) - 1) * 150;
          pos.set(id, { x: gx + ux * o - uy * k, y: gy + uy * o + ux * k });
        });
      } else {                               // 셋 이상이 공유: 전체 중심에 격자로
        const cols = Math.ceil(Math.sqrt(items.length));
        items.forEach((id, i) => pos.set(id, { x: gx + ((i % cols) - (cols - 1) / 2) * 230, y: gy + (Math.floor(i / cols) - (Math.ceil(items.length / cols) - 1) / 2) * 120 }));
      }
    }
    // 나머지(기관, 좌장, 발표와 직접 연결되지 않은 개념): 이웃의 중심에서 바깥으로
    const rest = [...nodes.keys()].filter((id) => vis(id) && !pos.has(id))
      .sort((u, v) => (nodes.get(u).type === "Organization") - (nodes.get(v).type === "Organization"));
    rest.forEach((id, i) => {
      const nb = adj.get(id).filter((v) => pos.has(v));
      if (nb.length && centers.length) {
        const px = mean(nb, "x"), py = mean(nb, "y");
        const c = centers.reduce((best, k) => (Math.hypot(k.x - px, k.y - py) < Math.hypot(best.x - px, best.y - py) ? k : best));
        const d = Math.hypot(px - c.x, py - c.y), isOrg = nodes.get(id).type === "Organization";
        const a = d > 20 ? Math.atan2(py - c.y, px - c.x) + ((i % 3) - 1) * 0.05 : (2 * Math.PI * i) / rest.length;
        const r = isOrg ? Math.max(d + 170, c.R + 980) + (i % 3) * 70 : d > 20 ? d + 120 + (i % 3) * 50 : c.R + 860;
        pos.set(id, { x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) });
      } else {
        const a = (2 * Math.PI * i) / rest.length;
        pos.set(id, { x: 1400 * Math.cos(a), y: 1400 * Math.sin(a) });
      }
    });
    cy.nodes().forEach((nd) => { const q = pos.get(nd.id()); if (q) nd.position(q); });
    cy.fit(cy.elements(":visible"), 40);
  }
  function applyFilter(relayout) {
    const sess = $("session").value, q = $("q").value.trim().toLowerCase();
    cy.batch(() => {
      cy.nodes().forEach((n) => {
        const d = nodes.get(n.id());
        n.toggleClass("hidden", !visible[d.type] || (sess && !sessOf.get(d.id).has(sess)));
      });
      cy.edges().forEach((e) => e.toggleClass("hidden", e.source().hasClass("hidden") || e.target().hasClass("hidden")));
      cy.elements().removeClass("faded");
      if (q) {
        const hit = cy.nodes(":visible").filter((n) => {
          const d = nodes.get(n.id());
          return [d.id, d.label, d.label_ko, d.summary_ko, ...(d.claims || []).map((c) => (typeof c === "string" ? c : c.text))].join(" ").toLowerCase().includes(q);
        });
        cy.elements().not(hit.union(hit.neighborhood())).addClass("faded");
      }
    });
    const vn = cy.nodes(":visible").length, ve = cy.edges(":visible").length;
    $("stats").textContent = `노드 ${vn} / ${nodes.size} · 관계 ${ve} / ${valid.length}`;
    if (relayout) layout();
  }
  $("chips").addEventListener("change", (e) => {
    const chip = e.target.closest(".chip");
    visible[chip.dataset.t] = e.target.checked;
    chip.classList.toggle("off", !e.target.checked);
    applyFilter(true);
  });
  $("session").addEventListener("change", () => { cy.elements().removeClass("focus hl"); applyFilter(true); showOverview(); });
  $("q").addEventListener("input", () => applyFilter(false));
  $("fit").addEventListener("click", () => cy.fit(cy.elements(":visible"), 40));

  // ---------- 5. 상세 패널 ----------
  const REL_KO = { partOf: "세션", chairedBy: "좌장", authoredBy: "저자·발표자", affiliatedWith: "소속", addresses: "다루는 문제", proposes: "제안 기법", targets: "대상 시스템", relatedTo: "관련 개념" };
  const INV_KO = { partOf: "발표", chairedBy: "좌장을 맡은 세션", authoredBy: "발표", affiliatedWith: "소속 인물", addresses: "이 문제를 다루는 발표", proposes: "이 기법을 쓰는 발표", targets: "이 시스템을 다루는 발표", relatedTo: "관련 개념" };
  const SRC_KO = { abstract: "초록", talk: "발표", slide: "슬라이드", qa: "질의응답" };
  const nodeLink = (id) => { const n = nodes.get(id); return `<span class="link" data-id="${esc(id)}">${esc(n.label_ko ? n.label_ko + " (" + n.label + ")" : n.label)}</span>`; };

  const VIEWS = [["decision", "1. 결정 주체와 기준", "누가, 무엇을 근거로 판단하는가"], ["trial", "2. 시행착오와 조건", "무엇이 안 됐고, 어떤 조건에서 됐는가"],
    ["korea", "3. 한국 연구기관으로의 적용", "초록을 바탕으로 한 제안"], ["extra", "4. 그 밖의 포인트", ""]];
  const refChip = (id) => { const n = nodes.get(id); return n ? `<span class="ref" data-id="${esc(id)}" title="${esc(n.label)}">${esc(short(n.label, 30))}</span>` : ""; };
  function showOverview() {
    const sid = $("session").value, s = sessions.find((x) => x.id === sid), ins = (s ? s.insights : overview.insights) || {};
    let h = `<div class="insight"><h2>${esc(s ? s.label : overview.label || "전체 세션 종합")}</h2>` +
      (s ? `<p class="muted">${esc([s.kind, s.date, s.time, s.room].filter(Boolean).join(" · "))} · <span class="link" data-id="${esc(s.id)}">세션 개요</span></p>` : `<p class="muted">세션을 고르면 세션별 고찰이 나옵니다. 근거 발표를 누르면 그래프에서 해당 발표로 이동합니다.</p>`);
    for (const [key, title, sub] of VIEWS) {
      const items = ins[key] || [];
      if (!items.length) continue;
      h += `<h3>${esc(title)}${sub ? ` <small>· ${esc(sub)}</small>` : ""}</h3><ul>` + items.map((it) => {
        const o = typeof it === "string" ? { text: it } : it;
        return `<li>${o.head ? `<b>${esc(o.head)}</b> ` : ""}${esc(o.text)}${(o.refs || []).length ? "<br>" + o.refs.map(refChip).join("") : ""}</li>`;
      }).join("") + `</ul>`;
    }
    if (!Object.keys(ins).length) h += `<p class="muted">이 세션의 고찰이 아직 없습니다.</p>`;
    h += `</div>`;
    const counts = {};
    valid.forEach((e) => { if (["addresses", "proposes", "targets"].includes(e.rel) && (!sid || nodes.get(e.source).session === sid)) counts[e.target] = (counts[e.target] || 0) + 1; });
    const shared = Object.entries(counts).filter(([, c]) => c > 1).sort((a, b) => b[1] - a[1]);
    if (shared.length) h += `<details><summary>여러 발표가 공유하는 개념 ${shared.length}개</summary><ul>${shared.map(([id, c]) => `<li>${nodeLink(id)} <span class="muted">· 발표 ${c}건</span></li>`).join("")}</ul></details>`;
    $("detail").innerHTML = h;
    $("detail").scrollTop = 0;
  }
  function showDetail(id) {
    const n = nodes.get(id), cls = classes[n.type] || {};
    let h = `<p><button id="back">← 고찰로 돌아가기</button></p><span class="tag" style="background:${esc(cls.color)}">${esc(cls.label_ko || n.type)}</span>
             <h2>${esc(n.label)}</h2>` + (n.label_ko ? `<p class="muted">${esc(n.label_ko)}</p>` : "");
    const meta = [n.kind, n.date, n.time, n.room].filter(Boolean).join(" · ");
    if (meta) h += `<p class="muted">${esc(meta)}</p>`;
    if (n.summary_ko) h += `<h3>요약</h3><p>${esc(n.summary_ko)}</p>`;
    if ((n.claims || []).length) h += `<h3>핵심 주장</h3><ul>${n.claims.map((c) => {
      const o = typeof c === "string" ? { text: c } : c;   // 문자열 또는 {text, source, at}
      const src = o.source ? ` <span class="src">${esc(SRC_KO[o.source] || o.source)}${o.at ? " " + esc(o.at) : ""}</span>` : "";
      return `<li>${esc(o.text)}${src}</li>`;
    }).join("")}</ul>`;
    if ((n.photos || []).length) h += `<h3>현장 사진</h3><div class="photos">${n.photos.map((ph) =>
      `<a href="${esc(ph.file)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(ph.file)}" alt="${esc(ph.caption || "")}"></a>${ph.caption ? `<p class="muted">${esc(ph.caption)}</p>` : ""}`).join("")}</div>`;
    if (n.transcript) h += `<h3>녹취록</h3><p><a href="${esc(n.transcript)}" target="_blank" rel="noopener">${esc(n.transcript)}</a></p>`;
    const groups = {};
    valid.forEach((e) => {
      if (e.source === id) (groups[REL_KO[e.rel] || e.rel] ||= []).push(e.target);
      else if (e.target === id) (groups[INV_KO[e.rel] || e.rel] ||= []).push(e.source);
    });
    for (const [title, ids] of Object.entries(groups)) h += `<h3>${esc(title)}</h3><ul>${[...new Set(ids)].map((x) => `<li>${nodeLink(x)}</li>`).join("")}</ul>`;
    const links = [n.url && `<a href="${esc(n.url)}" target="_blank" rel="noopener">프로그램 페이지</a>`, n.website && `<a href="${esc(n.website)}" target="_blank" rel="noopener">워크숍 사이트</a>`].filter(Boolean);
    if (links.length) h += `<h3>링크</h3><p>${links.join(" · ")}</p>`;
    $("detail").innerHTML = h;
    $("detail").scrollTop = 0;
  }
  function focus(id) {
    const n = cy.getElementById(id);
    if (n.hasClass("hidden")) {           // 숨겨진 종류의 노드를 고르면 그 종류를 켠다
      const t = nodes.get(id).type;
      visible[t] = true;
      const chip = document.querySelector(`.chip[data-t="${t}"]`);
      chip.classList.remove("off"); chip.querySelector("input").checked = true;
      if ($("session").value && !sessOf.get(id).has($("session").value)) $("session").value = "";
      applyFilter(true);
    }
    cy.elements().removeClass("faded focus hl");
    const hood = n.closedNeighborhood();
    cy.elements().not(hood).addClass("faded");
    n.addClass("focus"); hood.edges().addClass("hl");
    showDetail(id);
  }
  function clearFocus() { cy.elements().removeClass("focus hl"); applyFilter(false); showOverview(); }
  cy.on("tap", "node", (e) => focus(e.target.id()));
  cy.on("tap", (e) => { if (e.target === cy) clearFocus(); });
  $("detail").addEventListener("click", (e) => {
    if (e.target.id === "back") return clearFocus();
    const l = e.target.closest(".link, .ref");
    if (l) focus(l.dataset.id);
  });
  $("theme").addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    store.set("sc26-theme", root.dataset.theme);
    themeLabel();
    cy.style(graphStyle());
  });
  $("fs-up").addEventListener("click", () => { scale = Math.min(1.6, +(scale + 0.1).toFixed(2)); applyScale(); cy.resize(); });
  $("fs-down").addEventListener("click", () => { scale = Math.max(0.8, +(scale - 0.1).toFixed(2)); applyScale(); cy.resize(); });

  applyFilter(true);
  showOverview();
  window.__cy = cy; window.__ready = true;
})();
</script>
</body>
</html>
