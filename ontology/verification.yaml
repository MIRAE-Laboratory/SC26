# 검증 온톨로지 (SC26 지식그래프의 "검증" 심층 요약에서 추려 구성)
# 원천: data/ 의 큐레이션된 지식그래프(공개 초록 요약). 여기의 분류와 사례 판정은 초록 요약을 읽고 정리한 것임.
# tools/build_ontology.py 가 이 파일에서 OWL(Turtle)과 도출 결과를 만듦.
id: verification
label: 과학 계산과 AI의 검증 온톨로지
scope: 심층 요약 2 "기준이 '돌아간다'에서 '검증된다'로 옮겨 감"의 범위. 검증 수단이 어떤 대상의 어떤 실패를 잡거나 놓쳤는지를 다룸.

questions:   # 역량 질문: 온톨로지가 답해야 하는 것
  - {id: Q1, text: 컴파일과 실행 성공만 확인하면 어떤 실패 유형을 놓치는가, rule: missed_by_baseline}
  - {id: Q2, text: 어떤 대상의 어떤 실패가 보고됐는데 그것을 잡은 수단은 보고되지 않았는가, rule: gaps}
  - {id: Q3, text: 한 가지 수단에만 기대고 있는 실패 유형은 무엇인가, rule: single_line}
  - {id: Q4, text: 어떤 수단이 놓친 실패를 다른 어떤 수단이 잡았는가, rule: complements}
  - {id: Q5, text: 어떤 자산 하나를 갖추면 가장 많은 검증 수단을 쓸 수 있게 되는가, rule: asset_leverage}
  - {id: Q6, text: 시험한 입력에서만 성립하는 보증에 머물러 있는 곳은 어디인가, rule: sampled_only}
  - {id: Q7, text: 결정론적이지 않은 판정에만 기대는 곳은 어디인가, rule: nondeterministic_only}
  - {id: Q8, text: 한 대상에서 통한 수단을 아직 쓰지 않은 다른 대상에 옮겨 볼 만한 곳은 어디인가, rule: transfer}

targets:    # 검증 대상
  code: {label: 코드}
  gen-code: {label: AI가 생성·변환한 코드, parent: code}
  sci-app: {label: 과학 응용 코드, parent: code}
  num-lib: {label: 수치 라이브러리·커널, parent: code}
  compiler: {label: 컴파일러·도구 사슬, parent: code}
  parallel-comm: {label: 병렬 통신 프로그램, parent: code}
  ai-model: {label: AI 모델}
  surrogate: {label: 신경망 대리모델, parent: ai-model}
  fm-rollout: {label: 파운데이션 모델의 연속 예측, parent: ai-model}
  training-run: {label: 대규모 학습 작업, parent: ai-model}
  agent: {label: 에이전트}
  agent-action: {label: 에이전트의 도구 호출과 제어 행동, parent: agent}
  agent-answer: {label: 에이전트의 답과 인용, parent: agent}
  llm-proposal: {label: LLM의 과학적 제안(설계안), parent: agent}
  workflow: {label: 워크플로(생성물과 유지보수 수리)}
  data: {label: 재사용되는 데이터셋}
  measurement: {label: 측정값}
  power-measure: {label: 전력 계측, parent: measurement}
  hw-counter: {label: 하드웨어 계수기, parent: measurement}
  benchmark-score: {label: 벤치마크 종합 점수, parent: measurement}
  platform: {label: 시스템 플랫폼}
  node-perf: {label: 노드와 소프트웨어 스택의 성능, parent: platform}
  hardware-fault: {label: 하드웨어 결함 거동, parent: platform}

failures:   # 실패 유형
  visible: {label: 스스로 드러나는 실패}
  crash: {label: 크래시와 실행 실패, parent: visible}
  silent: {label: 드러나지 않는 실패}
  wrong-result: {label: 조용히 틀린 결과, parent: silent}
  convention: {label: 실행은 되지만 전문가 관례를 어김, parent: silent}
  semantic-drift: {label: 결과의 과학적 의미가 바뀜, parent: silent}
  fake-work: {label: 하지 않은 일을 한 것처럼 보고함, parent: silent}
  out-of-domain: {label: 적용 범위를 벗어난 사용, parent: silent}
  physical-violation: {label: 물리·도메인 제약 위반, parent: silent}
  error-accumulation: {label: 예측 오차의 누적, parent: silent}
  numeric: {label: 수치 오차와 부동소수점 예외, parent: silent}
  silent-training: {label: 정상으로 보이는 학습 실패, parent: silent}
  sdc: {label: 조용한 데이터 손상, parent: silent}
  concurrency: {label: 교착과 경합, parent: silent}
  measure-error: {label: 측정이 틀린 값을 냄, parent: silent}
  regression: {label: 성능 회귀와 노드 간 편차, parent: silent}
  boundary: {label: 경계를 넘는 행동}
  unsafe-action: {label: 허용되지 않은 행동의 실행, parent: boundary}
  invalid-invocation: {label: 불완전하거나 잘못된 입력으로 실행, parent: boundary}
  ungrounded: {label: 근거 없는 답과 위조 인용, parent: boundary}
  exploitable: {label: 악용 가능한 취약점, parent: boundary}

assets:     # 수단이 전제하는 자산
  ref-output: {label: 기준 출력(원본 코드나 기준 실행의 결과)}
  test-inputs: {label: 시험 입력과 시나리오 모음}
  independent-impl: {label: 독립 구현이나 독립 시뮬레이터}
  high-prec-ref: {label: 고정밀 기준값}
  spec: {label: 사람이 검토한 명세와 수용 기준}
  contract: {label: 함수 단위 계약}
  abstract-model: {label: 검증용으로 뽑아낸 작은 모델}
  physics-eq: {label: 물리 제약식}
  domain-tools: {label: 도메인 계산 도구}
  live-sensor: {label: 실측 신호}
  domain-meta: {label: 데이터의 적용 범위 정보}
  exec-log: {label: 실행 기록(출처 기록)}
  policy: {label: 허용 행동 정책과 값의 출처 레이블}
  fault-set: {label: 주입할 결함 모음}
  benchmark-suite: {label: 고정된 벤치마크 모음}
  hi-res-meter: {label: 고해상도 계측기}
  expert-time: {label: 전문가의 검토 시간}

# 검증 수단. det: 결정론적인가. assurance: sample(시험한 입력에서만) | scope(정한 범위의 모든 입력) | runtime(실행 중 매번) | judgment(판단에 의존)
# applies: 쓸 수 있는 대상(상위 대상을 적으면 하위 대상 전체). kg: 지식그래프의 대응 개념 id
methods:
  exec-test: {label: 실행 기반 시험}
  compile-run: {label: 컴파일과 실행 성공 확인, parent: exec-test, det: true, assurance: sample, requires: [test-inputs], applies: [code, workflow, ai-model], baseline: true}
  output-compare: {label: 기준 출력과의 동등성 시험, parent: exec-test, det: true, assurance: sample, requires: [ref-output, test-inputs], applies: [code, workflow], kg: [differential-testing]}
  bit-identical: {label: 비트 단위 재현 관문, parent: output-compare, det: true, assurance: sample, requires: [ref-output, test-inputs], applies: [code], kg: [bit-identical-gates]}
  independent-sim: {label: 독립 시뮬레이터에서의 출력 분포 비교, parent: output-compare, det: true, assurance: sample, requires: [independent-impl, test-inputs], applies: [code], kg: [differential-testing]}
  exhaustive-input: {label: 입력 전수 비교, parent: exec-test, det: true, assurance: scope, requires: [high-prec-ref], applies: [num-lib]}
  metamorphic: {label: 불변식·관측 동등성·변형 관계 검사, parent: exec-test, det: true, assurance: sample, requires: [ref-output, test-inputs], applies: [code, workflow]}
  fuzzing: {label: 퍼징, parent: exec-test, det: false, assurance: sample, requires: [test-inputs], applies: [code], kg: [fault-injection]}
  fault-injection: {label: 결함 주입(검증 수단과 내성의 시험), parent: exec-test, det: true, assurance: sample, requires: [fault-set], applies: [code, ai-model, platform], kg: [fault-injection]}
  continuous-bench: {label: 상시 벤치마크와 회귀 시험, parent: exec-test, det: true, assurance: runtime, requires: [benchmark-suite], applies: [platform], kg: [continuous-benchmarking]}
  spec-based: {label: 명세 기반 검증}
  spec-check: {label: 사람이 검토한 명세와의 대조, parent: spec-based, det: true, assurance: scope, requires: [spec, expert-time], applies: [workflow, code], kg: [spec-first-validation]}
  schema-guard: {label: 스키마로 입력을 확인하고 실행을 막음, parent: spec-based, det: true, assurance: runtime, requires: [spec], applies: [agent], kg: [spec-first-validation]}
  contract-check: {label: 계약 검사(LLM이 쓴 작은 계약을 결정론적 도구로 대조), parent: spec-based, det: true, assurance: scope, requires: [contract, expert-time], applies: [code], kg: [formal-verification, deterministic-llm-split]}
  formal: {label: 정형 검증}
  model-checking: {label: 모델 검사(입력을 기호로 둠), parent: formal, det: true, assurance: scope, requires: [abstract-model, spec], applies: [code], kg: [formal-verification]}
  deductive: {label: 연역 검증, parent: formal, det: true, assurance: scope, requires: [contract], applies: [code], kg: [formal-verification]}
  domain-constraint: {label: 도메인 제약에 의한 검증}
  physics-constraint: {label: 물리 제약의 학습과 검사, parent: domain-constraint, det: true, assurance: sample, requires: [physics-eq], applies: [ai-model], kg: [physics-aware-training]}
  domain-bounds: {label: 적용 범위 정보의 대조, parent: domain-constraint, det: true, assurance: runtime, requires: [domain-meta], applies: [data, ai-model], kg: [standardized-run-metadata]}
  tool-in-loop: {label: 도메인 도구를 넣은 추론 루프, parent: domain-constraint, det: false, assurance: judgment, requires: [domain-tools], applies: [agent], kg: [tool-augmented-reasoning]}
  runtime-monitor: {label: 실행 중 감시}
  exec-guard: {label: 모델 밖의 결정론적 실행 검사와 중재, parent: runtime-monitor, det: true, assurance: runtime, requires: [policy], applies: [agent], kg: [execution-integrity-guard, runtime-sandbox]}
  residual-monitor: {label: 실측과의 잔차 감시, parent: runtime-monitor, det: true, assurance: runtime, requires: [live-sensor], applies: [ai-model], kg: [residual-monitoring]}
  fp-exception: {label: 부동소수점 예외 검출, parent: runtime-monitor, det: true, assurance: runtime, requires: [], applies: [code], kg: [fp-exception-detection]}
  checksum: {label: 물리 기반 체크섬, parent: runtime-monitor, det: true, assurance: runtime, requires: [physics-eq], applies: [code]}
  run-evidence: {label: 실행 증거 남기기(재생 가능한 기록), parent: runtime-monitor, det: true, assurance: runtime, requires: [exec-log], applies: [code, ai-model, agent, workflow], kg: [provenance-logging]}
  record-audit: {label: 계보와 설명 기록의 확인, parent: runtime-monitor, det: true, assurance: judgment, requires: [exec-log], applies: [data, workflow], kg: [provenance-logging]}
  judgment: {label: 판단에 의한 검증}
  human-gate: {label: 사람의 승인 관문, parent: judgment, det: false, assurance: judgment, requires: [expert-time], applies: [code, workflow, agent], kg: [human-approval-gates]}
  llm-judge: {label: LLM 판정(코드와 출력만 읽음), parent: judgment, det: false, assurance: judgment, requires: [], applies: [code, agent]}
  llm-eval-hybrid: {label: 결정론적 검사와 LLM 평가의 결합, parent: judgment, det: false, assurance: judgment, requires: [test-inputs], applies: [code, workflow, agent], kg: [hybrid-evaluators]}
  prompt-only: {label: 프롬프트 지시만으로 통제, parent: judgment, det: false, assurance: judgment, requires: [], applies: [agent]}
  measure-check: {label: 측정의 검증}
  multi-resolution: {label: 여러 해상도의 동시 계측, parent: measure-check, det: true, assurance: sample, requires: [hi-res-meter], applies: [power-measure], kg: [infrastructure-telemetry]}
  cross-vendor: {label: 벤더 간 계수기 대조, parent: measure-check, det: true, assurance: sample, requires: [benchmark-suite], applies: [hw-counter], kg: [hardware-counter-analysis]}

# 검증 사례: 발표가 보고한 "수단이 대상의 실패를 잡았는가". outcome: caught(잡음) | partial(일부만) | missed(놓침) | used(관문으로 채택했으나 탐지 결과는 보고 없음)
