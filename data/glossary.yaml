# 용어 풀이: 낯선 용어의 한 줄 설명. 뷰어가 고찰과 발표 요약에서 이 용어를 찾아 점선 밑줄을 긋고, 누르면 설명을 보여 줌.
MCP: 모델 컨텍스트 프로토콜. AI 에이전트가 외부 도구와 데이터를 정해진 형식으로 호출하게 하는 공개 규약임.
스킬 파일: 전문가의 작업 절차를 에이전트가 읽고 따를 수 있게 적어 둔 문서로, 코드처럼 버전을 관리함.
프롬프트 주입: 에이전트가 읽는 문서나 도구 출력에 명령을 숨겨 에이전트의 행동을 가로채는 공격임.
전문가 혼합: Mixture-of-Experts(MoE). 입력마다 일부 하위 신경망(전문가)만 골라 계산해 큰 모델의 비용을 줄이는 구조임.
MoE: Mixture-of-Experts(전문가 혼합). 입력마다 일부 하위 신경망만 골라 계산해 큰 모델의 비용을 줄이는 구조임.
파운데이션 모델: 대량의 데이터로 미리 학습해 여러 과제에 맞춰 쓰는 범용 대형 모델임.
대리모델: 비싼 시뮬레이션의 결과를 빠르게 근사하도록 학습한 모델임.
디지털 트윈: 실제 시스템의 상태를 데이터로 따라가며 가상으로 재현한 모형임.
연합학습: 데이터를 한곳에 모으지 않고 각 기관이 자기 데이터로 학습한 결과(모델 갱신)만 모으는 학습 방식임.
양자화: 모델의 숫자를 8비트 정수처럼 낮은 정밀도로 바꿔 메모리와 계산량을 줄이는 기법임.
프리필: LLM 추론에서 입력 전체를 한 번에 처리해 내부 상태를 만드는 앞 단계임. 뒤의 디코드 단계가 토큰을 하나씩 생성함.
토큰화: 글자를 모델이 다루는 단위(토큰)로 쪼개는 전처리임.
Slurm: HPC 시스템에서 가장 널리 쓰이는 공개 작업 스케줄러임.
Kubernetes: 컨테이너로 포장한 서비스를 여러 서버에 배치하고 관리하는 공개 플랫폼임.
OpenCHAMI: 여러 연구소가 재단 아래에서 함께 만드는 공개 HPC 시스템 관리 소프트웨어임. 노드 발견, 부팅, 설정을 맡음.
리더십급: 미국 에너지부가 운영하는 최상위 규모 슈퍼컴퓨터 시설을 가리키는 말임.
엑사스케일: 초당 100경(10의 18제곱) 번의 연산을 하는 규모임.
Frontier: 미국 오크리지 국립연구소의 엑사스케일 슈퍼컴퓨터임.
Genesis Mission: AI, 슈퍼컴퓨터, 실험 시설을 하나의 플랫폼으로 묶으려는 미국 에너지부의 사업임.
NAIRR: 미국의 국가 AI 연구 자원 사업. 연구자에게 AI용 계산 자원과 데이터를 제공함.
EuroHPC: 유럽연합과 회원국이 슈퍼컴퓨터를 공동 구축·운영하는 사업체임.
배정밀도: 숫자 하나를 64비트로 표현하는 부동소수점 형식(FP64). 유효 숫자 약 16자리로 과학 계산의 기본임.
단정밀도: 숫자 하나를 32비트로 표현하는 부동소수점 형식(FP32). 유효 숫자 약 7자리임.
혼합 정밀도: 계산의 대부분은 낮은 정밀도로 빠르게 하고, 정확도가 필요한 부분만 높은 정밀도로 하는 기법임.
오자키 기법: 큰 정밀도의 행렬을 낮은 정밀도 조각 여러 개로 나눠 곱한 뒤 오차 없이 합쳐 배정밀도 결과를 얻는 방법임.
TFLOP/s: 초당 1조 번의 부동소수점 연산. 연산 장치의 처리 성능 단위임.
부동소수점 예외: 0으로 나누기나 숫자 아님(NaN)처럼 계산 결과가 정상 범위를 벗어난 상태임.
조용한 데이터 손상: 오류 신호 없이 메모리나 계산 값이 바뀌는 하드웨어 결함(SDC)임.
비트 반전: 메모리나 연산 중의 값에서 비트 하나가 0과 1 사이에서 뒤집히는 현상임.
체크포인트: 실행 중인 계산의 상태를 저장해 두는 것. 장애가 나면 그 지점부터 다시 시작함.
모델 검사: 프로그램이 가질 수 있는 상태를 빠짐없이 탐색해 속성이 항상 성립하는지 확인하는 정형 검증 기법임.
정형 검증: 시험 실행이 아니라 수학적 증명으로 프로그램이 명세를 만족함을 보이는 방법임.
비트 단위 재현: 새 코드의 출력이 기준 출력과 마지막 비트까지 같은지 확인하는 검증 방식임.
변형 관계: 입력을 정해진 방식으로 바꾸면 출력이 어떻게 달라져야 하는지에 대한 규칙. 정답을 모를 때 시험 기준으로 씀.
루프라인: 연산 성능이 계산 능력과 메모리 속도 중 어느 쪽에 막히는지 보여 주는 분석 도표임.
텔레메트리: 시스템이 스스로 내보내는 전력, 온도, 사용량 같은 운영 측정값임.
테넌트: 하나의 시스템을 나눠 쓰는 사용자 집단 또는 기관임.
PUE: 전력 사용 효율. 전산실 전체 전력을 IT 장비 전력으로 나눈 값으로, 1에 가까울수록 좋음.
전력 사용 효율: PUE. 전산실 전체 전력을 IT 장비 전력으로 나눈 값으로, 1에 가까울수록 좋음.
패브릭: 슈퍼컴퓨터의 노드들을 잇는 고속 내부 통신망임.
집합 통신: 여러 프로세스나 GPU가 한꺼번에 데이터를 주고받아 합치는 통신 방식임.
선반입: 원격 저장소의 데이터를 계산 노드의 로컬 저장 장치로 미리 옮겨 두는 것임.
레이크하우스: 파일 형태의 대용량 데이터에 표 형식의 목록과 질의 기능을 얹은 데이터 관리 구조임.
계보: 데이터가 어디서 와서 어떤 처리를 거쳤는지에 대한 기록임.
출처 기록: 누가, 언제, 무엇으로 결과를 만들었는지 남기는 기록(프로비넌스)임.
적용 범위 정보: 데이터가 어떤 조건에서 만들어졌고 어디까지 써도 되는지를 데이터에 함께 적어 둔 것임.
인터커넥트: 계산 노드와 가속기 사이를 잇는 고속 연결망임.
MPI: 여러 노드에 흩어진 프로세스가 메시지를 주고받는 병렬 프로그래밍 표준임.
HDF5: 과학 데이터를 계층 구조로 저장하는 널리 쓰이는 파일 형식이자 라이브러리임.
Lustre: 대형 HPC 시설에서 널리 쓰는 공개 병렬 파일시스템임.
RISC-V: 누구나 쓸 수 있게 공개된 프로세서 명령어 구조임.
웨이퍼 규모: 반도체 원판 한 장 전체를 칩 하나로 쓰는 초대형 가속기 방식임.
메모리 내 연산: 메모리 칩 안에 작은 연산 장치를 넣어 데이터를 옮기지 않고 계산하는 방식(PIM)임.
