- {date: "2026-11-16", text: "자료 탭 추가(고찰 보고서, 슬라이드, 동향 요약, 열람 목록, 내보내기). 기관 보기에 주제 선택과 한국 기관 표시를 넣음. 적용 제안 106개에 실행 단계, 영역, 선행 조건을 붙임. 세션을 일곱 주제로 묶어 메뉴와 지도에 반영함. 겹치는 개념을 합쳐 290개로 줄임. 공개 설명문이 거의 없는 세션 (119), (130), (146)을 뺌. 묶음 파일로 첫 화면 로딩을 줄임."}
