# 갱신 이력: 최근 것이 위. 뷰어 첫 화면 아래에 표시됨.
- {date: "2026-11-17", text: "검증 온톨로지를 따로 구성함(ontology 폴더). 지식그래프에서 검증에 해당하는 부분을 추려 대상, 실패 유형, 수단, 전제 자산을 정의하고 사례 51건에 규칙 여덟 개를 적용해 빈칸과 단일 방어선, 옮겨 볼 조합을 도출함. 자료 묶음의 검증 온톨로지 화면에서 봄."}
- {date: "2026-11-17", text: "이름을 지식그래프로 바로잡음(형식 온톨로지가 아니라 가벼운 스키마를 가진 지식그래프임). 개념 287개에 상위 범주 28개를 붙이고, 세션–개념 지도의 범주 보기와 문제–기법 범주 대응표를 더함. 내보내기 파일 이름을 graph.jsonld로 바꿈."}
- {date: "2026-11-17", text: "화면 정리: 적용 모아 보기를 실행 계획표 안의 전체 목록으로 옮기고, 기관 화면의 저자 목록을 인물·협력 후보 화면으로 옮김. 화면은 모두 16개."}
- {date: "2026-11-17", text: "쟁점 대조표(9가지)와 기관 프로필을 더함. 탭을 분석, 자료, 점검의 세 묶음으로 나눔. 첫 화면에 목적별 길잡이를 둠. 수치 모음의 287개 문장을 무엇이, 얼마나, 어떤 조건에서로 나눠 적음."}
- {date: "2026-11-17", text: "실행 계획표, 수치 모음, 개념 관계 지도, 인물 연결망 보기를 더함. 슬라이드에 대표 수치와 근거 발표를 앞세움. 인용 말풍선이 화면 밖으로 나가지 않게 고침. 에이전트용 설명서와 예시 질의, 발표별 JSONL, 수치 CSV를 내보내기에 더함. 한 번만 쓰인 개념을 다시 살펴 3개를 합침(개념 287개)."}
- {date: "2026-11-16", text: "고찰 보고서: 인용 번호에 마우스를 올리면 발표 제목이 보이고, 누르면 그 발표의 프로그램 페이지가 열림."}
- {date: "2026-11-16", text: "세션–개념 지도: 종류(문제, 기법, 대상) 표시는 전체 보기에서만 색 꼬리표로 보이고, 종류를 하나 고르면 생략함."}
- {date: "2026-11-16", text: "자료 탭 추가(고찰 보고서, 슬라이드, 동향 요약, 열람 목록, 내보내기). 기관 보기에 주제 선택과 한국 기관 표시를 넣음. 적용 제안 106개에 실행 단계, 영역, 선행 조건을 붙임. 세션을 일곱 주제로 묶어 메뉴와 지도에 반영함. 겹치는 개념을 합쳐 290개로 줄임. 공개 설명문이 거의 없는 세션 (119), (130), (146)을 뺌. 묶음 파일로 첫 화면 로딩을 줄임."}
- {date: "2026-11-16", text: "워크숍 10개 추가(일요일 2, 월요일 2, 금요일 6)와 네 번째 심층 요약(양자). 모두 32개 세션, 발표 378건."}
- {date: "2026-11-16", text: "월요일 워크숍 2개 추가: (128) CANOPIE-HPC, (131) ProTools. 모두 22개 세션, 발표 287건."}
- {date: "2026-11-16", text: "근거 수준 표시, 적용 모아 보기, 개념 상세, 단순화한 그래프, 용어 풀이, 주소 공유, 인쇄, 데이터 점검 화면을 더함."}
- {date: "2026-11-16", text: "관점별 색과 수치 강조를 넣음. 첫 화면을 요지 카드로 바꾸고 분석 탭 네 개를 더함. 첫 화면 로딩을 줄임."}
- {date: "2026-11-16", text: "월요일 워크숍 7개 추가: (129) PDSW'26, (132) HPCSYSPROS26, (134) Correctness '26, (138) Sovereign AI, (141) AI on HPC, (142) FTXS, (147) Low-Precision."}
- {date: "2026-11-15", text: "일요일 워크숍 13개와 심층 요약 세 가지를 실음."}
