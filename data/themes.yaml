# 심층 요약: 여러 세션을 온톨로지의 개념 묶음으로 가로질러 본 관점별 요약.
# concepts 에 적은 개념과 연결된 발표가 자동으로 모여 그래프와 세션별 분포에 표시됨.
themes:
  - id: agents
    label: 에이전트가 연구 인프라의 새 사용자이자 운영자가 됨
    summary_ko: 에이전트는 코드 작성 보조를 넘어 워크플로 작성, 실험 조율, 시스템 운영과 사용자 지원까지 맡기 시작했음. 그 결과 인프라가 받는 부하의 성격이 바뀌었고, 권한과 비용을 어떻게 통제할지가 공통 과제로 떠올랐음.
    concepts: [ai-agents, multi-agent-workflow, agentic-workflow-composition, mcp-tools, skill-files, agent-middleware, agent-execution-layer, human-centric-hpc, agent-facility-codesign,
               agent-state-fragmentation, unified-state-graph, data-stalls, agent-aware-memory, agent-inference-cost, llm-gating, llm-ops-assistant, performance-agent, agents-on-cyberinfrastructure,
               agent-job-execution, agent-boundaries, prompt-injection, origin-labeling, runtime-sandbox, event-driven-continuation, agentic-config-optimization, tool-augmented-reasoning,
               descriptive-execution, typed-agent-messaging, failure-attribution, human-in-outer-loop, serverless-execution,
               ops-knowledge-loss, llm-gateway, opportunistic-inference, llm-serving-efficiency, execution-integrity-guard]
    diagram:
      type: layers
      title: 에이전트가 놓이는 자리와 그 아래에서 바뀌는 것
      items:
        - {label: 맡는 일, note: "코드 변환과 현대화, 워크플로 작성, 실험 조율, 운영 분석과 사용자 지원"}
        - {label: 공통 부품, note: "도구 노출 규약(MCP), 스킬 파일, 미들웨어, 이벤트 기반 재개"}
        - {label: 통제, note: "런타임 정책, 출처 레이블, 본인 권한과 확인 절차, 출력 기록"}
        - {label: 비용, note: "LLM 호출을 줄이는 정책, 실패 유형별 수리, 작은 모델과 결정론적 절차의 결합"}
        - {label: 인프라, note: "스케줄러, 파일시스템, 메모리 계층이 에이전트 부하를 기준으로 재설계 대상이 됨"}
    sections:
      - head: 에이전트가 맡는 일이 네 갈래로 넓어졌음.
        text: 첫째는 개발로, 레거시 포트란 5만 6천 줄을 에이전트 역할 셋이 변환했음. 둘째는 워크플로 작성으로, 하위 워크플로 101개짜리 연합학습 워크플로를 명세부터 생성했음. 셋째는 실험 조율로, 자율 실험실의 바깥 루프에서 다음 단계를 정했음. 넷째는 운영과 지원으로, 과거 티켓과 실시간 클러스터 정보를 묶어 사용자 질문에 답하고 조치까지 했음.
        refs: [ws_aaihpc114, ws_worksp117, ws_xloop112, ws_hust106, ws_hust121]
      - head: 인프라는 사람을 기준으로 설계되어 있어 에이전트 부하를 받지 못함.
        text: 한 시설에서 사용자의 19.5%가 코딩 에이전트를 썼는데 작업 제출의 55.8%를 냈고, 명령 속도는 사람의 20.8배였음. 다음 작업을 에이전트가 정하면 접근 패턴을 예측할 수 없어 계층형 스토리지에서 실행 시간이 3.18배 늘었음. 에이전트의 상태 네 종류는 서로 조율되지 않는 저장소에 흩어져 하나의 메모리 예산을 두고 경쟁함. 금지도, 일반 사용자 취급도 답이 아니라는 진단이 나옴.
        refs: [ws_aaihpc124, ws_ai4s128, ws_aaihpc130]
      - head: 서로 다른 팀이 같은 부품으로 수렴함.
        text: 과학 기능을 타입이 있는 도구로 노출하는 규약, 전문가 절차를 버전 관리하는 스킬 파일, 긴 작업 동안 에이전트를 세워 두지 않는 이벤트 기반 재개가 빔라인 분석, 연합 자원 제어, 재료 워크플로, 사용자 지원에서 반복해 쓰임.
        refs: [ws_ai4s131, ws_aaihpc126, ws_aaihpc122, ws_hust121, misc133]
      - head: 권한은 모델 바깥에서 정하지만, 고정된 방어는 뚫림.
        text: 에이전트가 해도 되는 일은 런타임 정책, 값의 출처 레이블, 사용자 본인 권한과 확인 절차, 출력 기록으로 통제함. 그러나 실제 시설 플랫폼에서 규칙 기반 계층은 고정된 공격 32개 중 19개를 막았을 뿐이고, 공격이 적응하자 평균 28~31개가 통과했음. 통제 구조는 필요조건이며, 비신뢰 값을 계획 단계에 넣지 않는 설계까지 가야 한다는 결론임.
        refs: [misc163, ws_aaihpc132, ws_hust121, ws_indis113]
      - head: 성능과 비용은 에이전트 수가 아니라 구조가 정함.
        text: 결정마다 LLM을 부르지 않게 하자 호출이 작업당 4.00회에서 2.06회로 줄고 결과는 비슷했음. 실패 유형별로 수리 경로를 나누자 토큰을 최대 52.4% 덜 쓰고 정확률이 올랐음. 원인 추출을 결정론적 절차에 맡기자 작은 모델이 큰 모델과 같은 진단 정확도를 냈음. 에이전트 수는 재현율도 거절률도 설명하지 못했음.
        refs: [ws_worksp128, ws_aaihpc107, ws_hust122, ws_aaihpc146]
      - head: 에이전트와 LLM 서비스가 운영 실무의 일부가 됨.
        text: 운영 현장에서는 에이전트가 절차 문서를 읽고 같은 작업 안에서 검증하고 보강하게 해 교대 사이에 사라지던 지식을 남겼음. 시뮬레이션 감시에서는 결정론적 조건이 걸러낸 상태만 멀티모달 에이전트가 판정해 틀린 계산의 39~68%를 아꼈음. 기관 자체의 LLM 서비스는 공정 배분 게이트웨이와 배치 시스템의 유휴 자원(노드 시간의 9.81%)을 쓰는 서빙으로 구성됨.
        refs: [ws_hpcsysp105, ws_pdswwip113, ws_hpcsysp112, ws_aihpc107, misc144, ws_canopie102, misc171]
      - head: 실제 과학 현장에서의 평가가 나오기 시작함.
        text: 핵연료 분야에서는 지식 저장소와 재사용 절차가 비용 증가보다 약 1.2~1.5배 더 답의 품질을 올렸음. 방사광 시설에서는 도구 61개를 조율하는 에이전트에 결정론적 검사 계층을 두자 위반이 200건 중 0건이었음. 우주론 분석에서는 에이전트와 과학자 팀이 서로 다른 것을 찾아 보완 관계임이 드러났음. 장애 조사 에이전트는 기관 안의 공개 모델로 요청의 89.2%를 처리했으나 진단 정확도는 아직 평가 전임.
        refs: [ws_tpw111, ws_tpw139, ws_tpw130, ws_odalt102, ws_tpw120]
      - head: 한국 연구기관에의 적용(제안) - 사용자 지원과 운영 분석부터 시작하고, 계측과 기록을 먼저 갖춤.
        text: 위험이 낮고 효과를 재기 쉬운 영역은 사용자 지원과 운영 분석임. 과거 티켓, 문서, 기존 텔레메트리로 시작할 수 있고 외부로 데이터를 보내지 않는 로컬 모델로도 결과가 나왔음. 연구 코드와 실험 장비로 넓히기 전에 에이전트 사용량의 계측, 실행 경계, 행동 기록을 갖추는 순서를 권함.
        refs: [ws_hust106, ws_indis105, ws_pmbsf148, ws_aaihpc144]
  - id: verification
    label: 기준이 "돌아간다"에서 "검증된다"로 옮겨 감
    summary_ko: AI가 코드와 워크플로를 싸게 만들어 내면서 병목이 생성에서 검증으로 옮겨 갔음. 같은 변화가 측정에도 나타나, 사양이나 종합 점수가 아니라 조건을 밝힌 측정이 판단의 근거가 됨.
    concepts: [translation-verification, ai-code-evaluation, bit-identical-gates, hybrid-evaluators, spec-first-validation, deterministic-llm-split, differential-testing, domain-benchmark,
               benchmark-validity, agentic-science-benchmarking, portability-metrics, unanswerable-refusal, residual-monitoring, human-approval-gates, provenance-reproducibility, provenance-logging,
               prov-loop-model, standardized-run-metadata, llm-domain-validity, untrusted-input, fuzzing, site-profiles, power-measurement-fidelity, multi-tier-power-metering,
               trust-in-automated-decisions, repair-loop, physical-feasibility, physics-aware-training, memory-safety,
               formal-verification, behavioral-equivalence-checks, exhaustive-oracle-testing, fp-exception-detection, probabilistic-error-analysis, fp-exceptions, numerical-error,
               parallel-program-correctness, compiler-defects, software-stack-drift, continuous-benchmarking, measurement-comparability, observability-overhead, performance-diagnosis-gap, hardware-counter-analysis, silent-training-failures, silent-data-corruption, dataset-reuse-context-loss, domain-bounds, deterministic-replay, failure-taxonomy, fault-injection]
    diagram:
      type: flow
      title: 검증의 사다리 - 아래로 갈수록 더 많은 오류를 잡음
      items:
        - {label: 컴파일되고 실행됨, note: 어느 세션에서도 합격 기준으로 인정받지 못함}
        - {label: 출력 비교, note: 원본과 변환본의 결과를 독립적으로 실행해 대조}
        - {label: 기준 출력의 비트 단위 재현, note: "강력하지만 주입 결함 14개 중 3개가 통과함"}
        - {label: 명세와 스키마 대조, note: "실행은 되는 오류 3건 적발. 입력이 불완전하면 실행 차단"}
        - {label: 물리 제약과 실측 대조, note: "제약 위반 약 19배 감소, 학습 범위 이탈을 잔차로 감지"}
        - {label: 모델 검사와 증명, note: "입력을 기호로 두어 허용 범위 전체를 확인. 무작위 시험이 놓친 결함 적발"}
        - {label: 사람의 승인, note: 소수의 관문에서 명세와 결과를 검토}
    sections:
      - head: 실행 성공은 다섯 가지 방식으로 틀릴 수 있음.
        text: 퍼징은 과학 응용 넷에서 크래시 약 1,000건을 찾았고 코딩 에이전트가 익스플로잇 59개를 만들었음. 최신 모델의 코드는 실행되면서도 라이브러리 관례를 어겼음. 작업 1,700개가 무작위 데이터로 학습되는 오류가 실패 없이 지나갔음. 비트 단위 재현 관문을 주입 결함 3개가 통과했음. 유지보수 수리는 기능 검사를 통과하고 과학적 검사에 실패했음.
        refs: [ws_shpc104, ws_ai4s109, ws_worksp117, ws_aaihpc139, ws_worksa106]
      - head: 검증 수단은 대상에 맞춰 층을 이룸.
        text: 번역 결과는 독립 시뮬레이터에서의 출력 분포 비교로, 수치 코드는 기준 출력의 비트 단위 재현으로, 워크플로는 사람이 검토한 명세와의 대조로, 대리모델은 물리 제약과 실측 잔차로 검증함. 한 가지 수단만으로는 빈틈이 남는다는 것이 여러 발표의 공통 결과임. 비트 단위 재현은 실행된 입력에서의 일치일 뿐 동등성의 증명이 아님.
        refs: [ws_aaihpc131, ws_aaihpc114, ws_worksp117, ws_xloop106, ws_ai4s139]
      - head: 결정론적으로 할 수 있는 일은 LLM에 맡기지 않음.
        text: 알려진 문법은 컴파일러가, 연결 코드는 도구가, 장애 원인은 로그 추출이, 사이트 정보는 측정과 문서 검증이, 보안 판정은 모델 밖의 레이블 전파가 처리함. LLM은 처음 보는 경우와 서술을 맡음. 이 분업이 코드 변환, 사용자 지원, 워크플로 이식, 보안 중재에서 각각 독립적으로 나왔음.
        refs: [ws_aaihpc131, ws_aaihpc139, ws_hust122, ws_worksp111, ws_aaihpc132]
      - head: 측정 자체가 검증 대상임.
        text: 같은 AI 워크로드를 세 해상도로 재면 값이 다르고, 성긴 계측은 오류 표시 없이 틀린 숫자를 냄. 스토리지 종합 점수는 단계별 관계를 가리고, 같은 하드웨어가 소프트웨어 빌드 하나로 2.1배 달라지며, 같은 사양의 장치가 에너지에서 36.9% 차이 남. 이식성은 응용에 따라 62%에서 89%까지 갈려 단일 수치로 말할 수 없음. 이름이 같은 GPU 계수기도 벤더마다 세는 것이 달라 최대 3.19배 차이가 났음.
        refs: [ws_eesp144, ws_pmbss101, ws_pmbss103, ws_pmbsf137, ws_p3hpc112, ws_prot109]
      - head: 정형 검증이 AI와 결합해 실용 범위로 들어옴.
        text: 수치 라이브러리는 명세를 손으로 쓰기 어려워 정형 검증이 드물었음. LLM이 문서에서 작은 계약을 뽑고 결정론적 도구가 검사하는 방식으로 PETSc 함수의 버그를 찾았음. 대형 코드에서는 알고리즘이 필요로 하는 인터페이스만 작은 모델로 뽑아, 입력을 기호로 두고 질량 보존을 증명했음. 반대로 LLM 판정은 결함 변형 13개 중 3개를 받아들여 검증 수단이 되지 못했음.
        refs: [ws_corr112, ws_corr113, ws_corr111, ws_corr107]
      - head: 가장 찾기 어려운 것은 정상으로 보이는 실패임.
        text: 학습 작업이 끝나고 손실 곡선이 정상이어도 모델이 틀릴 수 있고, 이때 재시작은 결함을 이어 감. 값이 모두 정상 범위인 데이터도 만든 맥락을 벗어나면 결함이며, 계보 기록이 통과시킨 오용 18건 중 17건을 적용 범위 정보가 잡았음. 부동소수점 예외는 GPU 코드에서 조용히 퍼지고, 수학 라이브러리 일부는 스스로 밝힌 오차 한계를 넘었음.
        refs: [misc105, ws_ftxs103, ws_corr109, ws_corr108]
      - head: 컴파일러와 시스템도 검증 대상임.
        text: 포트란 GPU 컴파일러 셋에서 석 달에 결함 45개가 나왔고 15개는 조용히 틀린 답을 내어, 컴파일하고 실행하는 시험의 42%를 통과했음. 사양이 같은 노드도 최대 5% 달랐고 스택의 갱신이 성능 회귀를 만들어, 벤치마크를 운영 내내 돌리고 변경 이력과 연결하는 방식이 나옴. 결함 주입 결과는 레이블이 같아도 플랫폼마다 동작이 달랐음.
        refs: [ws_hpct108, ws_hpct110, ws_hpct105, ws_hpct102]
      - head: 평가 기준은 아직 합의되지 않았음.
        text: 코드 변환, 보안, 운영 분석, 네트워크 텔레메트리 발표가 저마다 벤치마크를 새로 만들었음. 결과끼리 비교하기 어렵고, 무엇을 벤치마크할지 자체가 패널의 질문으로 올라옴. 재현율이 높은 구성이 답할 수 없는 질문은 가장 적게 거절했다는 결과는 지표 하나로 신뢰를 잴 수 없음을 보여 줌.
        refs: [ws_aaihpc109, ws_aaihpc132, ws_aaihpc146, ws_indis106, miscp120]
      - head: 기록이 검증의 전제임.
        text: 에이전트의 목표, 계획, 행동, 평가를 질의 가능한 출처 기록으로 남기는 모델, 실행 데이터를 표준 형식으로 묶어 재사용하는 저장소, 프라이버시 주장을 감사 가능한 양식으로 적는 틀이 제안됨. 무엇을 했는지 남지 않으면 나중에 검증할 수 없기 때문임.
        refs: [ws_aaihpc144, ws_worksp112, ws_shpc102, ws_ai4s131]
      - head: 한국 연구기관에의 적용(제안) - 기관 고유의 검증 자산을 먼저 정비함.
        text: 기준 출력, 시험 사례, 검증된 설정, 자체 벤치마크는 모델이 바뀌어도 남는 자산이며, AI가 만든 코드와 모델을 받아들일지 판단하는 유일한 근거임. 원자력 안전해석처럼 검증 요건이 엄격한 코드는 시험 사례가 실행하지 않는 경로를 따로 확인하는 절차가 필요함. 과제와 시스템 평가에는 측정 조건과 에너지를 함께 적게 함.
        refs: [ws_aaihpc114, ws_aaihpc139, ws_worksa103, ws_eesp141]
  - id: flows
    label: 데이터, 에너지, 자원의 흐름을 시설 규모에서 다시 설계함
    summary_ko: 데이터는 저장하고 옮기기에 너무 많아졌고, 전력은 예산이 되었으며, 하드웨어는 벤더와 종류가 늘었음. 발표들은 데이터가 생기는 곳에서 줄이고, 네트워크와 메모리에서 위치를 따지고, 전력을 계층마다 조정하고, 시설들을 하나의 플랫폼으로 잇는 방향으로 모임.
    concepts: [data-deluge, in-situ-reduction, experiment-steering, delayed-feedback, wan-data-distribution, federated-caching, science-aware-networking, science-unaware-networks, network-congestion,
               cross-facility-integration, genesis-platform, user-facility-beamline, xfel-facility, self-driving-labs, event-driven-runtime, accelerated-transport, unified-data-access,
               energy-performance-tradeoff, power-cap-slowdown, node-variation, energy-cost-carbon, malleable-node-shutdown, nonuniform-power-capping, domain-power-rebalancing, rl-power-control,
               co-scheduling, underused-resources, data-locality, memory-bound-performance, numa-aware-scheduling, communication-aware-placement, hardware-selection, performance-portability,
               portable-abstraction-layers, workload-portability, identity-access, service-composition, decoupled-service-ecosystem, federated-learning,
               gpu-io-path, gpu-native-io, shared-fabric-interference, node-local-staging, contention-aware-io-placement, large-data-migration, burst-buffer, cross-layer-tracing,
               fp64-scarcity, fp64-emulation, vendor-dependence, open-control-plane, community-governance, federated-allocation-platform, hardware-enforced-isolation, gpu-sharing, llm-training-scaling,
               container-hpc-mismatch, unprivileged-containers, no-restart-elasticity, snapshot-restore,
               request-usage-mismatch, job-trace-analysis, embodied-carbon, carbon-aware-upgrade, heat-reuse, edge-resource-limits, edge-cloud-routing, imaging-data-scale, generative-reconstruction, rl-resource-scaling]
    diagram:
      type: flow
      loop: 결과와 결정이 다음 실험과 계산으로 되돌아감
      title: 데이터가 생겨서 결과가 되기까지, 단계마다 줄이고 아낌
      items:
        - {label: 발생, note: "검출기와 시뮬레이션. 실험 시설의 원시 데이터율이 280 GB/s에서 1,120 GB/s로 증가"}
        - {label: 발생 지점에서 축소, note: "필드를 입자로 바꿔 98.1% 축소, 실행 중 통계로 전송량 60배 감소"}
        - {label: 네트워크 이동, note: "캐시 연합으로 배포, 모델만 옮기면 광역 트래픽 3.2~11.4배 감소"}
        - {label: 계산 노드 안의 배치, note: "로컬에서 읽는 실행이 27.64%에서 68.33%로, 복사량 39~81% 감소"}
        - {label: 전력 예산 안의 실행, note: "노드별 상한으로 성능 7.5% 향상, 내부 배분 교정으로 에너지 34.2% 절감"}
        - {label: 하드웨어 선택, note: "워크로드에 따라 신형이 최대 16배 느림. 이식성 점수로 벤더 종속을 가늠"}
    sections:
      - head: 데이터는 생기는 곳에서 줄임.
        text: 실험 시설의 원시 데이터율이 280 GB/s에서 1,120 GB/s로 가면서 전부 저장하는 방식은 불가능해졌음. 검출기 옆 스트리밍 런타임은 31 kHz를 유지했고, 시뮬레이션은 필드를 입자로 바꿔 98.1% 줄이거나 통계를 실행 중에 누적해 전송량을 60배 줄였음. 무엇을 남길지를 사람이 보기 전에 기계가 정하므로, 그 결정의 신뢰를 얻는 것이 남은 과제임.
        refs: [misc155, ws_xloop111, ws_isav111, ws_isav110, ws_isav106]
      - head: 옮길 때는 네트워크가 능동적으로 관여함.
        text: 대용량 데이터는 사본을 늘리는 대신 원본과 캐시의 연합으로 배포하고, 데이터 대신 모델을 옮겨 광역 트래픽을 3.2~11.4배 줄임. 네트워크가 워크플로 수요를 예측해 스스로 조치하는 구상도 나왔음. 다만 예측 캐싱의 실측 이득은 전송량 1.6% 감소로 작았고, 혼잡 회피는 여유가 있는 전송에만 통했음.
        refs: [ws_indis102, ws_indis111, ws_indis112, ws_indis117, ws_worksp115]
      - head: 계산 노드 안에서는 데이터의 위치가 성능을 정함.
        text: 메모리 구조를 인지한 스케줄링으로 로컬 읽기 비율이 27.64%에서 68.33%로 올랐고, 이후 데이터 위치까지 고려한 배치로 복사량이 39~81% 줄었음. 중성자 확산 솔버는 모든 단계가 메모리에 묶여 있어 코어 수가 아니라 메모리 구조가 확장성을 정했음. 엑사스케일 벤치마크의 성능도 커널이 아니라 장치와 통신의 배치에서 나왔음.
        refs: [ws_worksp101, ws_ross101, ws_pmbsf107, ws_pmbsf139]
      - head: 전력은 계측, 상한, 스케줄의 세 층에서 조정함.
        text: 먼저 계측 해상도가 맞아야 함. 성긴 계측은 AI 부하의 빠른 맥동을 틀리게 보고함. 상한은 일괄로 걸면 가장 느린 노드에 묶이고, 조이면 내부 배분 탓에 에너지가 늘 수도 있음. 노드별 상한은 성능을 7.5% 올렸고 배분 교정은 에너지를 34.2% 줄였음. 스케줄 수준에서는 야간 셧다운이 전기료를 12.5%, 궁합이 맞는 작업의 동시 실행이 에너지를 약 40% 줄였음.
        refs: [ws_eesp144, ws_eesp121, ws_eesp120, ws_eesp107, ws_pmbsf137]
      - head: 하드웨어는 다양해지고, 선택은 워크로드별로 해야 함.
        text: 신형 가속기가 구형보다 최대 16배 느린 워크로드가 있었고, 저정밀 연산으로 배정밀도를 대신할 수 있는 워크로드는 10% 미만으로 평가됨. 불규칙 메모리 접근에는 웨이퍼 규모 시스템이 GPU의 6~12배 처리량을 냈음. 벤더에 묶인 소프트웨어는 다른 시스템에서 배치 단계에 막혔고, 이식형 계층은 코드를 45~64% 줄이면서 응용에 따라 62~89%의 이식성 점수를 냈음.
        refs: [ws_pmbss103, ws_pmbsf142, ws_pmbsf133, ws_hppss104, ws_p3hpc112]
      - head: 저장 경로는 GPU와 네트워크를 함께 봐야 함.
        text: GPU 커널이 호스트를 거치지 않고 직접 쓰게 하자 입출력의 96%가 가려지고 1.9배 빨라졌음. 학습에서는 저장과 통신이 한 망을 쓰며 서로를 늦췄고, 노드 로컬 선반입이 병렬 파일시스템의 7.4배 처리량을 냈음. 공유 저장 대상의 혼잡은 순간적이어서 작업마다 재서 배치해야 했음. 실험 스트리밍은 완충 계층으로 취득과 처리를 분리함.
        refs: [ws_pdsw111, ws_pdsw101, ws_pdsw103, ws_pdswwip107, ws_pdsw125]
      - head: 배정밀도와 통제권이 하드웨어 선택의 새 기준이 됨.
        text: 신형 GPU의 배정밀도 성능이 세대 사이에 37에서 1.25 TFLOP/s로 줄어, 배정밀도 코드는 에뮬레이션이나 혼합 정밀도 보정이 필요해졌음. 한편 스케줄러 개발사의 인수를 계기로, 시스템 관리와 소프트웨어 배포, 배분·정산 층을 공동 거버넌스 아래 두어 교체 가능성을 지키려는 움직임이 나옴.
        refs: [ws_haclph112, ws_haclph101, ws_scc104, ws_scc103, ws_scc106]
      - head: 효율의 범위가 운영 기록과 장비의 생애주기로 넓어짐.
        text: 작업 기록 420만 건의 분석에서 소수의 사용자가 수요와 낭비의 대부분을 만들었고, 요청을 실제에 맞추면 평균 대기가 67% 줄어든다는 모의 결과가 나옴. GPU 분할 구성을 수요 기록으로 정하자 충족률이 66.8%에서 98.1%로 올랐음. 장비 교체는 제조 탄소까지 따져야 총배출이 줄고, 작업별 GPU 클록 조정은 에너지를 14.25% 아꼈음.
        refs: [ws_hpcoda112, ws_hpcoda136, ws_ss103, ws_ss109, ws_echo105]
      - head: 시설을 하나의 플랫폼으로 잇는 일은 서비스와 신원에서 시작함.
        text: 미국은 AI, 엑사스케일, 실험 시설, 자율 실험실을 한 플랫폼으로 묶는 사업에서 모델 배포, 언어 모델 접근, 데이터 기반, 출처 기록을 공용 서비스로 제공하고 이미 실제 워크플로에 쓰고 있음. 영국의 국가 AI 자원은 신원 관리가 숨은 최대 지원 부담임을 확인했고, 프랑스는 보안 규정과 공유 계정의 충돌을 서비스 계정으로 풀었음.
        refs: [misc199, ws_xloop110, ws_hppss105, ws_hust103, ws_worksp105]
      - head: 한국 연구기관에의 적용(제안) - 대형 실험시설과 계산 자원을 하나의 데이터 흐름으로 설계함.
        text: 가속기, 연구용 원자로, 핵융합 장치는 취득 단계의 축소와 실시간 처리를 전제로 한 데이터 체계가 필요함. GPU 클러스터를 들일 때는 전력 계측 해상도와 자기 워크로드의 측정을 평가 항목에 넣고, 노드 편차와 유휴 자원을 확인한 뒤 상한과 공동 실행을 적용함. 기관 간 연계는 계산 자원보다 신원 체계와 공용 서비스의 구분을 먼저 정함.
        refs: [misc155, ws_eesp144, ws_pmbsf126, ws_hust103]
  - id: quantum
    label: 양자 자원이 HPC 운영 안으로 들어옴
    summary_ko: 양자 장치는 잡음이 크고 규모가 작아 단독으로는 쓰기 어렵고, 슈퍼컴퓨터와 묶인 혼합 워크플로에서 쓰임새를 찾고 있음. 논의의 중심은 양자 알고리즘보다, 양자 장치를 기존 스케줄러와 운영 체계에 어떻게 넣느냐로 옮겨 와 있음.
    concepts: [quantum-hpc-integration, quantum-resource-scheduling, quantum-noise-fidelity, quantum-resource-interface, quantum-hpc-workflows, fidelity-aware-scheduling, quantum-hpc-systems, quantum-compilers]
    diagram:
      type: layers
      title: 양자 자원을 HPC에 넣을 때 정해야 하는 층
      items:
        - {label: 응용, note: "화학, 재료, 최적화. 전처리부터 오류 완화와 검증까지 고전 계산이 맡음"}
        - {label: 워크플로, note: "슈퍼컴퓨터가 양자 장치 둘을 조율한 시연. 컨테이너로 개발·시험 환경을 맞춤"}
        - {label: 스케줄링, note: "양자 장치를 CPU, GPU처럼 스케줄. 장치별 충실도를 미리 예측해 배정"}
        - {label: 인터페이스, note: 벤더 중립 인터페이스 두 종이 검증 단계}
        - {label: 운영, note: "새로 생기는 역할 여섯과 각자가 필요로 하는 운영 데이터"}
    sections:
      - head: 양자 장치를 스케줄러가 다루는 자원으로 만드는 것이 첫 과제임.
        text: 벤더 중립 인터페이스로 양자 자원을 CPU, GPU와 나란히 스케줄하게 했고, 배치 스케줄러와 클라우드 조율 플랫폼, 그래프 기반 스케줄러에서 검증했음. 소프트웨어 스택 전체를 장치 하나로 다루는 추상화도 제안됨. 공개 생태계가 세 워크숍에 걸쳐 소개됐음.
        refs: [ws_sfwm112, ws_sfwm121, misc194, misc213]
      - head: 잡음 때문에 어디서 어떻게 돌리느냐가 결과를 좌우함.
        text: 같은 회로도 장치마다 충실도가 달라, 컴파일 전에 장치별 충실도를 예측해 배정하는 방식이 나옴. 20큐비트 장치에서는 전부 증폭하는 방식이 장치 시간을 6.7~104배 쓰고도 뚜렷한 이점이 없었고, 부분 결과를 묶어 쓰자 실행 횟수가 2.20~4.00배 줄었음.
        refs: [ws_sfwm104, ws_sfwm118, ws_sfwm120]
      - head: 실제 통합 사례는 일본과 미국, 유럽에서 나옴.
        text: 후가쿠가 서로 다른 벤더의 양자 장치 둘을 조율해 화학 계산을 수행했고, 미국에서는 컨테이너 환경에서 양자와 고전 단계를 잇는 워크플로를 시험한 뒤 큰 시스템으로 옮겼음. 다섯 나라 기관이 통합 전략을 발표했으나 공개 초록에는 수치가 없음.
        refs: [ws_sfwm111, misc141, misc214, misc211]
      - head: 고전 계산 쪽의 부담도 함께 커짐.
        text: 양자 회로를 고전적으로 모의하는 작업은 할당받은 노드의 배치 모양에 따라 1.73~2.31배 달라졌고, 실행 시간 예측에는 별도의 모델이 필요했음. 양자와 고전 자원이 섞인 클라우드에서는 반복 횟수가 임계점을 넘으면 대기가 급격히 늘었음.
        refs: [ws_hpct103, ws_sfwm110, ws_sfwm102]
      - head: 한국 연구기관에의 적용(제안) - 장치 도입과 운영 통합을 따로 계획함.
        text: 양자 장치를 들이는 일과 기존 HPC 운영에 넣는 일은 별개임. 도입 사양에 스케줄러 연동 인터페이스를 넣고, 운영에 새로 생기는 역할과 필요한 데이터를 미리 정하며, 개발·시험 환경은 컨테이너로 먼저 맞추는 순서를 권함.
        refs: [ws_sfwm112, ws_hpcoda123, misc141, misc221]
