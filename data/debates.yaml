# 쟁점 대조표: 같은 질문에 발표들이 서로 다른 결과를 낸 곳. 초록을 읽고 정리한 것이며, 발표자들이 서로를 반박한 것은 아님.
# 각 쟁점: question(질문), sides(입장별 label, text, refs), read(차이를 어떻게 읽을지)
debates:
  - id: agent-control
    question: 에이전트를 모델 바깥의 결정론적 계층으로 통제하면 충분한가
    sides:
      - label: 충분했다는 결과
        text: 방사광 시설의 다중 에이전트에 결정론적 실행 검사 계층을 두자 적대적 시나리오 50개, 모델 넷에서 제어기 위반이 200건 중 0건이었음. 프롬프트만 쓴 기준은 15건이었음.
        refs: [ws_tpw139]
      - label: 뚫렸다는 결과
        text: 시설 플랫폼의 결정론적 중재 계층은 고정된 공격 32개 중 19개를 막았으나, 공격이 방어에 맞춰 적응하자 평균 28~31개가 통과했음. 샘플링으로 텔레메트리 누출을 줄이는 방어도 부분적으로만 막았음.
        refs: [ws_aaihpc132, ws_shpc106]
    read: 두 결과는 평가한 위협이 다름. 앞쪽은 정해진 시나리오에서의 위반 건수이고, 뒤쪽은 방어를 알고 바꾸는 공격임. 모델 밖 통제는 필요조건으로 보고, 도입 평가에는 적응형 공격을 포함해야 함.
  - id: bit-identical
    question: 출력이 비트 단위로 같으면 변환한 코드를 믿을 수 있는가
    sides:
      - label: 병합 기준으로 삼음
        text: GAMESS 적분 루틴 12개 파일의 변환에서 출력 에너지의 비트 단위 재현을 병합 기준으로 썼고 표준 시험 51개를 통과했음. 풍력 터빈 제어기 변환은 27개 시나리오에서 출력 256만 개가 정확히 일치했음.
        refs: [ws_aaihpc114, ws_aaihpc139]
      - label: 그것만으로는 빈틈이 남음
        text: 같은 제어기 연구에서 일부러 넣은 결함 14개 중 3개가 관문을 모두 통과했음. 정확성 워크숍에서는 LLM이 뽑은 작은 계약을 결정론적 도구로 검사하거나, 입력을 기호로 두고 성질을 증명하는 방식이 제시됨.
        refs: [ws_aaihpc139, ws_corr112, ws_corr113]
    read: 비트 단위 재현은 실행해 본 입력에서의 일치를 뜻함. 시험 입력이 닿지 않는 경로의 결함은 남으므로, 기준 출력 비교에 결함 주입 시험이나 계약 검사를 더하는 구성이 반복해서 나옴.
  - id: llm-judge
    question: LLM에게 결과의 옳고 그름을 판정하게 해도 되는가
    sides:
      - label: 근거를 묶어 주면 쓸 만함
        text: 사용자 로그 진단에서 결정론적으로 뽑은 발견을 프롬프트에 묶자 진단 정확도가 크게 올라 작은 모델이 큰 모델과 같은 수준이 되었음. 과학 코드 평가에서는 결정론적 검사와 LLM 평가를 결합한 틀이 쓰임.
        refs: [ws_hust122, ws_ai4s109]
      - label: 판정 수단이 되지 못함
        text: 코드와 출력만 읽고 추론하는 LLM 판정은 기준 시험이 잡은 결함 변형 13개 중 3개를 받아들였음.
        refs: [ws_corr111]
    read: 갈리는 지점은 LLM이 무엇을 보고 판정하느냐임. 실행 결과나 결정론적 검사의 출력을 받아 설명하는 역할에서는 성과가 났고, 실행 없이 코드만 읽고 합격 여부를 정하는 역할에서는 결함을 통과시켰음.
  - id: more-agents
    question: 에이전트를 여럿으로 나누면 결과가 좋아지는가
    sides:
      - label: 역할 분담이 성과를 냄
        text: 레거시 포트란 5만 6천 줄의 변환은 역할이 다른 에이전트 셋이 수행했고, CUDA에서 웨이퍼 규모 시스템 언어로의 변환은 반복 구조로 성공이 28개 중 6개에서 26개로 늘었음.
        refs: [ws_aaihpc114, ws_aaihpc109]
      - label: 수가 아니라 구조가 정함
        text: 운영 분석 벤치마크에서 사실을 가장 많이 찾은 것은 단일 에이전트였고, 답할 수 없는 질문을 거절하는 능력은 메시지에 타입을 둔 설계에서 나왔으며 토큰은 2.5배 들었음. 스케줄링에서는 결정마다 LLM을 부르지 않게 하자 호출이 절반으로 줄고 결과는 비슷했음.
        refs: [ws_aaihpc146, ws_worksp128]
    read: 성과를 낸 사례들도 에이전트 수를 늘린 것이 아니라 실행 피드백과 검증 단계를 구조에 넣은 것임. 도입을 검토할 때는 에이전트 수보다 호출 비용과 거절 능력을 따로 재야 함.
  - id: smart-network
    question: 네트워크와 캐시를 똑똑하게 만들면 얼마나 이득인가
    sides:
      - label: 큰 이득
        text: 분산 센서망에서 데이터 대신 모델을 옮기는 연합 방식은 같은 정확도에서 광역 트래픽을 3.2~11.4배 줄였음.
        refs: [ws_indis111]
      - label: 작은 이득
        text: 고에너지 물리 데이터 연합의 예측 캐싱은 시뮬레이션에서 광역 전송량을 1.6% 줄였음. 혼잡을 고려한 워크플로 스케줄링의 실행 시간 단축은 최대 9.2~11.2%였음.
        refs: [ws_indis117, ws_worksp115]
    read: 큰 이득은 옮기는 대상을 바꾼 경우(데이터에서 모델로)에서 나왔고, 같은 데이터를 더 영리하게 옮기는 경우의 이득은 작았음. 투자 순서를 정할 때 참고할 대비임.
  - id: fp64-substitute
    question: 저정밀 연산으로 배정밀도 계산을 대신할 수 있는가
    sides:
      - label: 대신할 수 있음
        text: 신형 GPU에서 저정밀 분해와 보정을 쓰는 방식이 에뮬레이션 배정밀도보다 25배 빨랐고, 혼합 정밀도 촐레스키 분해는 CPU 라이브러리보다 3.04배 빠르면서 배정밀도 정확도를 지켰음. 반도체 소자 시뮬레이션은 처리량이 최대 51% 올랐음.
        refs: [ws_haclph112, ws_haclph111, ws_haclph101]
      - label: 일부 워크로드에만 통함
        text: 배정밀도 에뮬레이션은 크고 조밀하며 행렬곱에 가까운 워크로드에만 적용되고, 이는 HPC 생태계의 10% 미만이라는 평가가 나옴. 같은 신형 GPU가 배정밀도 전자구조 계산에서는 구형보다 16배 뒤졌음.
        refs: [ws_pmbsf142, ws_pmbss103]
    read: 성공 사례는 선형대수 커널처럼 구조가 맞는 계산이고, 수렴 조건을 응용마다 분석했음. 기관의 주요 코드가 어느 쪽에 속하는지는 배정밀도 구간을 직접 재 봐야 알 수 있음.
  - id: power-cap
    question: 전력 상한을 낮추면 에너지가 줄어드는가
    sides:
      - label: 줄어듦
        text: GPU 학습에서 전력 상한을 750 W에서 450 W로 낮추자 연산당 에너지가 20~41% 줄었음. 노드별로 상한을 달리 주면 균일 상한보다 응용 성능이 최대 7.5% 높았음.
        refs: [ws_ss105, ws_eesp121]
      - label: 기본 제어로는 오히려 손해일 수 있음
        text: Aurora에서 노드 상한 아래의 기본 전력 배분은 비효율적이어서, 배분을 교정하자 같은 상한에서 보드 에너지가 최대 34.2% 줄었음. GPU를 늘려 실행 시간을 줄인 경우에는 에너지가 24~42% 늘었음.
        refs: [ws_eesp120, ws_eesp141]
    read: 상한의 효과는 상한 값보다 그 안에서 전력이 어떻게 나뉘는지에 달려 있음. 상한 정책을 도입할 때는 작업별 민감도와 내부 배분을 함께 재야 함.
  - id: new-hardware
    question: 새 하드웨어로 바꾸면 더 빠르고 더 효율적인가
    sides:
      - label: 그렇다는 결과
        text: 불규칙한 메모리 접근이 많은 단면적 조회에서 웨이퍼 규모 시스템이 GPU의 6.34~11.90배 처리량을 냈음. 다른 벤더의 통합 칩은 실행 시간이 거의 19% 짧고 에너지는 비슷했음.
        refs: [ws_pmbsf133, ws_ss104]
      - label: 워크로드와 교체 방식에 따라 다름
        text: 신형 GPU가 합성곱 추론에서 최대 5.6배, 배정밀도 전자구조 계산에서 16배 뒤졌음. 탄소 분석에서는 빠른 교체가 제조 배출을 125.5%, 운영 배출을 47.2% 늘렸고, 절충형 교체만 운영 배출을 86.2% 줄였음.
        refs: [ws_pmbss103, ws_ss103]
    read: 새 장비의 이점은 워크로드의 성격(정밀도, 메모리 접근)과 교체 주기에 따라 방향까지 바뀜. 사양표나 순위가 아니라 자기 워크로드의 측정과 생애주기 계산이 판단 근거가 됨.
  - id: portability-layer
    question: 이식형 추상화 계층을 쓰면 성능을 잃는가
    sides:
      - label: 거의 잃지 않음
        text: Julia는 대부분의 경우 모든 아키텍처에서 상대 성능 90%를 넘었고, 반라그랑지안 코드는 이식형 구현이 전문가의 수동 최적화보다 GPU에서 최대 1.47배 빨랐음.
        refs: [ws_p3hpc129, ws_p3hpc102]
      - label: 응용과 플랫폼에 따라 크게 잃음
        text: 다중 GPU 유체역학 코드의 성능 이식성 점수는 전체 플랫폼에서 34.9~37.9%였고, 새 언어로 쓴 격자 볼츠만 코드는 CPU 성능이 낮아 0.59였음. 같은 언어도 응용에 따라 62%에서 89%까지 갈렸음.
        refs: [ws_p3hpc127, ws_p3hpc117, ws_p3hpc112]
    read: 이식성은 단일 수치로 말하기 어렵고, CPU를 포함하느냐에 따라 점수가 크게 달라짐. 코드 줄 수가 45~64% 줄어드는 이점과 함께 자기 코드로 점수를 내 보는 것이 필요함.
