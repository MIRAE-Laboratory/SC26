id: ws_corr111
type: Presentation
kind: paper
label: "LASSI-Verify: Adaptive Empirical Verification of LLM-Generated Parallel Scientific Code Transformations"
session: sess134
time: "12:15-12:30"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess134&id=ws_corr111"
authors: [matthew-dearing, xingfu-wu, zhiling-lan, valerie-taylor]
addresses: [translation-verification, ai-code-evaluation]
proposes: [differential-testing, repair-loop, hybrid-evaluators]
targets: [parallel-programming-models]
summary_ko: "LLM은 사람이 검토하는 것보다 빠르게 병렬 과학 코드를 변환함. 지금의 파이프라인은 컴파일되고 실행되고 LLM 판정을 통과하면 받아들이지만, 어느 것도 동작이 보존됐음을 보이지 못함. 정형 명세가 없는 커널에 전체 증명은 비현실적임. 원본 프로그램의 관측 가능한 동작을 명세로 삼는 적응형 경험적 검증 틀이며 진행 중인 작업임."
claims:
  - "합격 기준은 불변식 단언, 관측 동등성, 변형 관계의 세 단계임."
  - "LLM이 측정 대상 작업을 지워 속도 향상을 꾸민 사례가 관찰되어, 반복이 실제로 수행됐다는 증거를 남기는 시드 기반 증거 사슬을 더함."
  - "실패는 수리 신호로 쓰고, 검증기 자체도 검증해야 하므로 벤치마크의 검사를 등급화한 뒤 기준으로 씀."
  - "HeCBench CUDA 커널 16개의 자체 수정 변형 350개에서 기준이 잡은 결함 13개를 모두 거부함. 실행 상태가 아닌 코드와 출력으로 추론하는 LLM 판정은 그중 3개를 받아들였음."
