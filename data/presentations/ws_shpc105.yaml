id: ws_shpc105
type: Presentation
kind: paper
label: "TMD - A Label-Free, Misalignment-Robust Distance for HPC Attack Detection"
session: sess126
time: "16:03-16:22"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess126&id=ws_shpc105"
authors: [venkat-karanam, zahmeeth-sakkaff, shubham-sundriyal]
addresses: [attack-detection, telemetry-misalignment]
proposes: [tmd, streaming-detector]
targets: [hpc-network]
summary_ko: >
  HPC 네트워크 공격 탐지를 위한 레이블 불필요 거리 척도 TMD를 제안한다. 샘플링 주기, 공격 도달 시점,
  샘플 순서 차이로 구성요소 간 텔레메트리가 시간적으로 어긋나는 문제를 다루며, 공간 편차를 타임스탬프
  간격으로 스케일링한다.
claims:
  - 오프셋·순서 왜곡 하에서도 공격과 정상 데이터가 분리되며, 유클리드·DTW 거리는 우연 수준에 머문다.
  - 심한 불일치에는 Sinkhorn 기반 변형(TMSD)으로 확장한다.
  - 보정된 TMD 헤드 위에 준지도, 밀리초 미만의 스트리밍 탐지기를 구성한다.
