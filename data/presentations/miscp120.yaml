summary_ko: >
  파운데이션 모델, 자율 에이전트, AI 유도 발견이 슈퍼컴퓨팅을 바꾸는 상황에서 HPC 커뮤니티가 다음에 무엇을 벤치마크해야 하는지 묻는 패널(사회 Sunita Chandrasekaran).
claims:
  - "벤치마크가 개별 커널과 응용 성능을 계속 잴지, 종단 간 과학적 성과로 옮겨 갈지가 쟁점임."
  - "시뮬레이션, 기계학습, 검색, 추론, 자율 결정을 결합한 시스템을 어떻게 평가할지 논의함."
  - "벤치마크 설계가 미래 AI 슈퍼컴퓨터의 아키텍처를 이끌 수 있다고 봄."
