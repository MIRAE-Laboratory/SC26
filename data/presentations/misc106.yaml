summary_ko: "계산과학자는 AI 도구를 점점 더 쓰지만 환경 구성, 의존성 관리, 모델 확보, 공용 HPC에서 각 프레임워크를 돌리는 방법을 알아내는 데 시간을 많이 씀. AI 도구의 배치와 실행을 표준화하는 재현 가능한 워크플로를 제안함."
claims:
