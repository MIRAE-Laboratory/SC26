summary_ko: >
  에이전트 시스템은 HPC 텔레메트리에 대한 운영 질문에 답하지만, 도메인 과학자는 그 답을 검증하기 어려움. 신뢰할 수 있는 시스템은 텔레메트리가 뒷받침하는 사실을 찾아내고 답할 수 없는 질문은 거절해야 함. 도구를 쓰는 단일 에이전트 하나와 다중 에이전트 설계 넷을 비교하며, Fugaku 작업 텔레메트리에 대한 다중 의도 질의 55개(검증 가능한 사실 119개, 답할 수 없는 하위 질문 25개)의 벤치마크 EPIQ를 씀.
claims:
  - "단일 에이전트가 사실을 가장 많이 찾지만(84.9%) 답할 수 없는 질문을 가장 적게 거절함."
  - "동료 메시징에 타입이 있는 대화 행위 필드를 결합한 설계가 가장 많이 거절하며(92.0%), 재현율은 단일 에이전트와 오차 범위 안이고 토큰은 2.5배 듦."
  - "에이전트 수는 재현율도 거절률도 설명하지 못함."
  - "재현율과 거절은 따로 설계해야 함."
