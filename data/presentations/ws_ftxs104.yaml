summary_ko: "분산 메모리 선형 솔버는 많은 과학 응용의 중심이며 AI 알고리즘과도 닮았음. 시스템의 규모와 이기종성이 커질수록 조용한 데이터 손상에 취약해짐. 물리 기반 체크섬은 노드에서 손상을 잡지만 복구에는 체크포인트 되돌리기가 필요하고, 국소 체크포인트는 결함률이 오르면 확장되지 않음. 크릴로프 솔버의 비동기성을 높이면 복구의 확장성이 좋아진다고 주장함."
claims:
  - "대상은 s-단계 통신 회피형 공액기울기법(CACG)이며, 체크섬을 알고리즘 전 구간에 적용하기 위한 변경을 설명함."
  - "국소 복구는 전체 복구보다 부담이 훨씬 작고, 노드 수와 결함률이 높아져도 확장됨."
  - "결함률이 오를수록 비동기성의 이점이 커짐. 공개 초록에는 구체적 수치가 없음."
