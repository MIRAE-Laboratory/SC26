id: pap652
type: Presentation
kind: paper
label: "GPU Faults Across Cloud Providers: Characterization and Operational Insights at Scale"
session: sess223
time: "09:37-10:00"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess223&id=pap652"
authors: [kenneth-sebastian, devendra-ayalasomayajula, annu-jolly, rashi-motwani, abby-kuang, giorgio-di-guardia, aman-miryala, sivakumar-arayandi-thottakara, ranjitha-prasanna, satvir-kooner]
addresses: [failure-resilience, ops-data-complexity, failure-data-incomparability]
