id: ws_ss103
type: Presentation
kind: talk
label: "Does New Hardware Improve Carbon Impact of HPC systems?"
session: sess157
time: "11:10-11:20"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess157&id=ws_ss103"
authors: [varsha-rao, clarisse-cheung, andrew-a-chien]
addresses: [embodied-carbon, energy-cost-carbon, hardware-selection]
proposes: [carbon-aware-upgrade]
targets: [leadership-facility, hpc-processors]
summary_ko: "상위 500개 HPC 시스템의 탄소 효율을 분석해 여러 요인이 서로 얽혀 있음을 보임. 옛 장비와 새 장비의 제조 탄소를 모두 따지는 절충형 교체를 제안함."
claims:
  - "성능, 운영 탄소, 제조 탄소 가운데 하나만 최적화하면 실패함."
  - "빠른 교체는 제조 효율을 0.9배로 악화시키고 운영 효율을 1.1배 올리며, 제조 배출을 125.5%, 운영 배출을 47.2% 늘림."
  - "절충형 교체는 제조 효율 1.7배, 운영 효율 19배이며, 제조 배출은 12.7%만 늘고 운영 배출은 86.2% 줄어듦."
