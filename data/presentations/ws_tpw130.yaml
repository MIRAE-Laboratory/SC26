summary_ko: "가장 큰 우주론 시뮬레이션을 대화식으로 끝까지 분석하는 다중 에이전트 시스템을 소개함. 벤치마크 대신, 일반적인 연구팀의 작업 흐름과 과학자 한 명이 이 시스템을 쓰는 경우를 비교함."
claims:
  - "에이전트 시스템은 암흑물질만으로 분류하면 잘못 분류될 은하단 무리를 식별함."
  - "과학자 팀은 관측 데이터로 견고하게 분류할 수 있는 새 관측량을 유도함."
  - "잘 설계한 다중 에이전트 시스템이 분석을 넓히고 전문가 팀을 보완한다고 봄. 공개 초록에는 수치가 없음."
