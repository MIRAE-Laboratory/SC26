summary_ko: "유럽의 엑사스케일 시스템 설치 과정을 빈 전산실에서 노드 6,000대를 일관되게 운영하기까지 되짚는 초청 강연임. 조달과 설계 때 구상한 관리 스택, 성능 평가용 벤치마크, 설치의 교훈을 다룸."
claims:
  - "기준 데이터베이스를 설정과 계산 노드 이미지로 바꾸는 방법을 설명함."
  - "운영 중의 상시 벤치마크가 시간에 따른 성능 저하를 드러냄."
  - "실패 사례와, AI가 강화된 차세대 엑사스케일 시스템을 위한 개선 계획으로 마무리함."
