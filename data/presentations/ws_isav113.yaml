summary_ko: >
  이미지 기반 인시투 가시화를 확장해, 여러 시점에서 만든 가시화 이미지를 대화형 시각 분석과 기계학습을 잇는 공통 표현으로 씀. 정보량이 많은 이미지만 남기는 기존 방법과 달리, 렌더링한 이미지 전체를 저장해 오프라인 대리모델 학습에 씀.
claims:
  - "초기 결과에서 원래 시뮬레이션 데이터 없이 이미지에서 직접 대리모델을 학습할 수 있었음."
  - "공개 초록에는 구체적 수치가 없음."
