summary_ko: "양자 컴퓨팅이 실험에서 실용으로 넘어가면서 CPU, GPU와 함께 HPC 생태계에 통합하는 과제를 살핌. 이기종이고 지리적으로 분산된 인프라의 관리는 자원 스케줄링, 워크플로 조율, 보안, 상호운용성의 문제를 낳음."
claims:
  - "양자 자원이 미래 HPC 환경의 일급 구성원이 되려면 운영체제와 자원 관리자가 어떻게 바뀌어야 하는지를 다룸."
  - "공개 초록에는 수치가 없음."
