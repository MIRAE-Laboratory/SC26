summary_ko: "Podman은 이미지 층을 풀어 저장하고 덧씌움 파일시스템으로 합치며, 이는 로컬 디스크에 맞는 방식임. 층을 풀 때의 메타데이터 연산이 NFS나 Lustre 같은 공유 파일시스템에서 느림."
claims:
  - "공유 파일시스템에 최적화한 저장 플러그인의 두 백엔드(SquashFS, EROFS)를 다룸."
  - "구현과 성능 영향을 설명함. 공개 초록에는 수치가 없음."
