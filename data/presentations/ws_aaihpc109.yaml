authors: [yuebo-luo, eliu-huerta, venkatram-vishwanath, caiwen-ding, rajeev-thakur, le-chen]
addresses: [code-translation]
proposes: [repair-loop, context-retrieval, domain-benchmark]
targets: [wafer-scale-systems]
summary_ko: >
  GPU 커널을 다른 아키텍처로 옮기는 일은 문법 변환을 넘어선다. CUDA는 스레드·블록·메모리 접근으로 작업 분해를 표현하고, Cerebras의 CSL은 처리 요소 메시 위의 명시적 데이터 이동, 패브릭 통신, 이벤트 기반 태스크를 요구한다. CUDA-CSL 쌍 과제 54개의 Fabrica-Bench와, 대상 지식·실행·실패 기반 수리·정확성 통과 후 최적화를 결합한 에이전트 프레임워크 Fabrica를 제시한다.
claims:
  - "Claude Opus 4.8로 성공이 단일 시도 6/28에서 26/28로 늘었고, 성공한 것 중 22개가 CSL 참조 구현과 같거나 낫다(16개는 가속)."
  - "Sonnet 4.6 절제 실험에서 Cerebras 지식 검색이 성공을 1/15에서 7/15로 올렸고, 구조화된 설계 기록은 효과가 없었다."
  - "46개 과제 중 35개를 통과했고, 통과한 보류 프로그램의 기하평균 가속은 3.42배(ReLU는 최대 83배)다."
  - "아키텍처 간 커널 생성을 이끄는 것은 프롬프트 구조가 아니라 대상 지식과 단계적 피드백이다."
