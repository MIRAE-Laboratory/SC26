claims:
  - "응용, 프레임워크, 통신, 스토리지, 조율, 시스템 텔레메트리에 걸쳐 복구를 조율하는 계층 간 구조를 제안함."
  - "입장 논문 성격이며 공개 초록에 수치가 없음."
