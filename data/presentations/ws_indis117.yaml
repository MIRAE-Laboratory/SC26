id: ws_indis117
type: Presentation
kind: talk
label: "Network-Aware Caching in Distributed CMS XRootD Systems via Data-Driven Forecasting"
session: sess111
time: "11:45-11:50"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess111&id=ws_indis117"
authors: [sarat-sasank-barla, byrav-ramamurthy, derek-weitzel]
addresses: [wan-data-distribution]
proposes: [federated-caching]
targets: [data-federations, hep-pipelines]
summary_ko: "CMS 같은 고에너지 물리 실험은 페타바이트급 데이터를 먼 사이트들에 분산해 광역 연구망에 지속적인 부하를 줌. 네트워크 내 캐싱은 반복 전송을 줄이지만, 현재 정책은 수요를 예측하지 않고 뒤따라감. 4개 도메인 캐시 노드 25곳의 XRootD 세션 기록 840만 건으로 학습한 2단계 예측 캐싱을 제안함."
claims:
  - "시뮬레이션에서 한 캐시 노드가 23일간 광역 트래픽 115 GB를 대체해, 광역 전송량이 1.6% 줄고 적중률이 1.4~1.6%포인트 올랐음."
  - "예측 캐싱의 성패는 예측 정확도만이 아니라 예측의 단위 선택과 캐시 운영과의 통합에 달려 있음."
