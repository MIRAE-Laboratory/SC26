id: ws_eesp144
type: Presentation
kind: paper
label: "Sub-Cycle Power Measurement of AI Workloads on Production GPU Racks"
session: sess125
time: "14:33-14:45"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess125&id=ws_eesp144"
authors: [kevin-menear, kumaraguru-prabakar, deepthi-vaidhynathan]
addresses: [power-measurement-fidelity]
proposes: [multi-tier-power-metering]
targets: [ai-power-delivery, power-telemetry]
summary_ko: >
  같은 AI 워크로드라도 전력 계측기마다 다른 값을 보고한다는 것을 운영 중인 H100 랙에서 보였음. 같은 사건을 1분 단위 차단기, 100 ms 단위 GPU 텔레메트리, 랙 급전선의 10 kHz 전압·전류 세 계층으로 동시에 기록했음. 성긴 계층은 오류 표시 없이 틀린 숫자를 냄. 어느 계층이 어떤 현상을 분해하고 나머지는 어떻게 실패하는지를 해상도 사다리로 정리함.
claims:
  - "초당 5.75회 맥동하는 학습 작업을 초당 10회 샘플링하는 장치 텔레메트리는 4.18회로 보고함."
  - "재개된 작업의 첫 맥동이 최대 진폭으로 온다는 것은 급전선 기록에서만 보임."
  - "버스트 수용 중인 추론 서빙 인스턴스는 랙 전체를 초당 12회 유휴와 피크 사이로 흔듦."
  - "이 부하에서 램프율, 과도 크기, 합산 단위의 동조는 전원 주기보다 짧은 시간의 양임."
