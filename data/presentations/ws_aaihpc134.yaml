summary_ko: >
  수천 개 노드, 고속 네트워크, 스토리지, 관리 인프라로 이뤄진 HPC 시스템에서는 운영 데이터의 양, 구성요소 간 상호작용, 해석에 필요한 전문성 때문에 사용자와 관리자가 어려움을 겪는다. HPC Systems Management Copilot은 작업 스케줄러, 모니터링 프레임워크, 시스템 데이터베이스와 상호작용하는 에이전트 집합으로, 단일 자연어 인터페이스로 실시간 도움을 준다.
claims:
  - "대표적인 관리 시나리오에서 역량, 효과, 안전성을 실험으로 평가했다."
  - "공개 초록에는 정량 결과가 없다."
