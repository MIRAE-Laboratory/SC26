id: ws_ai4s109
type: Presentation
kind: paper
label: "An Agentic Evaluation Framework for AI-Generated Scientific Code in PETSc"
session: sess114
time: "11:50-12:10"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess114&id=ws_ai4s109"
authors: [hong-zhang, barry-smith, satish-balay, le-chen, murat-keceli, lois-mcinnes, junchao-zhang]
addresses: [ai-code-evaluation]
proposes: [hybrid-evaluators, domain-benchmark, mcp-tools]
targets: [ai-agents, hpc-libraries]
summary_ko: >
  실전 HPC 라이브러리 위의 코드는 기능 정확성만으로 평가할 수 없고, 솔버 선택, API 관례, 메모리 관리, 병렬 인식, 성능이 함께 중요함. PETScAgent-Bench는 AI 생성 코드가 라이브러리를 전문가처럼 쓰는지 확인하는 다차원 벤치마크이자 에이전트 기반 평가 틀임. 도구를 갖춘 평가기가 코드를 컴파일·실행·측정하고, 결정론적 검사와 LLM 평가를 묶은 14개 평가기를 5개 범주(정확성, 성능, 코드 품질, 알고리즘 적절성, 라이브러리 관례)로 운용함.
claims:
  - "A2A와 MCP로 호환 코딩 에이전트를 블랙박스로 평가할 수 있음."
  - "최신 모델은 읽기 쉽고 구조가 좋은 코드를 내지만, 어려운 문제의 정확성과 라이브러리 관례에서 약함."
  - "컴파일되고 실행되는 코드에서도 이런 한계가 나타나며, 통과/실패 평가는 이를 잡지 못함."
