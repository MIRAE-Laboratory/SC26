label: "Practical HPCQC Integration with QDMI: A Real-Hardware Case Study with IQM Systems"
session: sess234
time: "13:30-13:52"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess234&id=pap634"
authors: [lukas-burgholzer, marcel-walter, patrick-hopf, alvaro-caride-tabares-sanchez, teemu-mattsson, bernd-hoffmann, noora-farkkila, daniel-bulmash, robert-wille, eric-mansfield]
addresses: [quantum-hpc-integration, vendor-dependence]
