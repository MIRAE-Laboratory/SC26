summary_ko: >
  sundials4py는 고성능 시간 적분기 모음 SUNDIALS의 파이썬 인터페이스로, AMD와 NVIDIA GPU 슈퍼컴퓨터에서 가속기 지원 솔버를 이식성 있게 쓸 수 있게 함.
