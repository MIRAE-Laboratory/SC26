summary_ko: >
  대규모 전자현미경 커넥톰은 주석과 교정에 인력이 많이 듦. 수작업 재구성으로 학습한 생성 모델이 보완 경로가 됨. 조밀 체적 점유 격자는 커넥토믹스 워크플로에 맞지만 비용이 해상도의 세제곱으로 늘어 뉴런처럼 희소한 대상에는 불리함. 이 표현 위에 분산 생성 파이프라인을 만들고 비용과 충실도의 절충을 분석함.
claims:
  - "20 µm 시야에서 축삭·수상돌기 조각 46,582개를 추출해 구획 조건부 3D 합성곱 VAE를 여러 해상도로 학습했음."
  - "생성 결과는 기하·위상 기술자로 평가하고 데이터의 자연 변동에 맞춰 보정했음."
  - "Polaris에서 A100 GPU 256개까지 학습의 강한 확장 효율이 74~85%임."
  - "조각 100만 개 생성에 64³ 해상도는 3.1초, 256³ 해상도는 5.25분이 걸림."
