label: "ARC-FL: Fault-Tolerant Federated Learning via Error-bounded Lossy Compression and Unequal Error Protection"
session: sess142
time: "17:06-17:29"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess142&id=ws_ftxs107"
authors: [ruiwen-shan, jon-c-calhoun]
addresses: [failure-resilience, silent-data-corruption]
proposes: [resilient-campaign-execution, federated-learning]
targets: [distributed-training]
summary_ko: "연합학습은 모델 갱신을 자주 주고받아 통신 부담이 큼. 오차 한계가 있는 손실 압축이 이를 줄이지만, 기존 연구는 축소율과 정확도에 집중하고 통신 신뢰성은 거의 다루지 않았음. 압축된 비트열은 전송 오류에 민감해 손상 몇 개로 층 전체의 복원이 실패함. 계층적 압축과 차등 오류 보호를 결합함."
claims:
  - "갱신 크기에 따라 모델의 층을 세 보호 등급으로 나누고, 부분 복호가 실패하면 층 단위로 대체함."
  - "비트 오류율 3E-3에서 강한 균등 보호는 여러 구성에서 수렴을 유지하지 못함."
  - "ARC-FL은 시험한 모든 구조와 데이터셋에서 의미 있는 정확도를 지켰고, 가장 영향이 큰 구성에서 균등 보호의 최대 7.5배 정확도를 냄."
