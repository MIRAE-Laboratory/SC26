label: "Security Mediation and Adversarial Evaluation for Agentic AI at HPC Facilities"
session: sess120
time: "11:54-12:00"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess120&id=ws_aaihpc132"
authors: [emily-herron, jack-hutchins, amir-sadovnik, jesse-hines, vanessa-lama, junqi-yin, feiyi-wang]
addresses: [prompt-injection, agent-boundaries]
proposes: [origin-labeling, domain-benchmark]
