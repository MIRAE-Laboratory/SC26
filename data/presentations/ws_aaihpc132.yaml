summary_ko: >
  DOE 시설의 LLM 에이전트에서 프롬프트 주입과 근거 없는 인용을 하나의 문제로 봄. 금지된 출처의 값이 결과를 낳는 행동(싱크)에 도달하는 문제임. PALISADE는 VISTA 플랫폼의 경계 6곳을 지키는 사이드카로, 모델 바깥에서 값에 출처 레이블을 붙이고 텍스트 매칭으로 전파해 레이블이 허용할 때만 싱크에 들임. SIEGE는 HPC 작업 제출을 보안 경계로 다루는 공격 205개 벤치마크임.
claims:
  - "결정론적 계층이 싱크에 도달 가능한 공격 32개 중 19개를 막고, 송신 차단을 더하면 위조 인용 5개를 모두 막음."
  - "턴당 0.28 ms로 동작하고 정상 입력의 3.3%를 차단함."
  - "적응형 공격(PAIR, TAP)은 싱크 통과를 32개 중 평균 28~31개로 끌어올림."
  - "이 전파 공백을 닫으려면 데이터 흐름 추적을 하거나 비신뢰 값을 플래너에 넣지 말아야 함."
