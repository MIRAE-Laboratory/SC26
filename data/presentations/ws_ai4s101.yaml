label: "EnvAgent: Multi-Agent Approach to Building Science Environments in the Clouds"
session: sess114
time: "10:30-10:50"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess114&id=ws_ai4s101"
authors: [yiming-cheng, chris-low, binrui-huang, mengshi-zhang, zihao-chen, kate-keahey, paul-marshall, kexin-pei]
addresses: [env-configuration]
