label: "Extending the Performance Portability of Julia to Long-Vector Architectures"
session: sess110
time: "15:30-15:54"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess110&id=ws_p3hpc129"
authors: [rintaro-togo, keichi-takahashi, tomonori-hayami, kota-sakakura, takashi-soga, arata-endo, susumu-date]
addresses: [performance-portability]
