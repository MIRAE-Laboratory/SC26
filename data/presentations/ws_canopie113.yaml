targets: [llm-inference, container-runtimes]
summary_ko: "추론 서버의 첫 기동은 캐시 프로파일링과 계산 그래프 구성 때문에 비싸고, 큰 스냅숏을 순차로 복원하는 것도 느림. 프로세스 스냅숏을 위한 병렬·복원 최적화 압축 방법을 제시함. 페이지 단위로 접근할 수 있는 블록을 쓰고 부분·증분 읽기를 지원함."
claims:
  - "추론 프레임워크의 모델 다섯에서 256 KiB 블록과 순차 복원으로 스냅숏 크기가 12.5~45.5%, 복원 후 첫 토큰까지의 지연이 7.2~44.7% 줄어듦."
  - "같은 병렬도에서 1 MiB 블록은 4 KiB 블록보다 크기 6.2%, 체크포인트 시간 12.4%, 지연 22.5%를 줄임."
  - "270억 파라미터 모델에서 압축 해제 스레드 16개가 복원 지연을 25.8% 줄임."
