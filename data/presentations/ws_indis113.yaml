authors: [bin-dong, sukhada-gholba, brooklin-gore, shawn-kwang, david-mitchell, samuel-oehlert, garrett-stewart, brendan-white, luke-baker, edward-balas, britt-gathright, chin-guok, john-paul-herron, john-macauley, scott-richmond, chris-robb, christopher-tracy, kesheng-john-wu]
