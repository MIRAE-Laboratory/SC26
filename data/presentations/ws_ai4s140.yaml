summary_ko: >
  자기회귀 PDE 파운데이션 모델은 예측을 다시 입력으로 넣으면서 오차가 누적됨. ETCH는 실린더 표면 압력 탭 12개의 측정값과 예측을 비교하고, 차이가 임계값을 넘으면 압력 조건부 확산 트랜스포머로 속도·압력 컨텍스트를 다시 만든 뒤 예측을 이어 감. 공개 페이지에는 발표자 한 명만 올라 있음.
claims:
  - "RealPDEBench Cylinder 궤적 43개에서 DPOT의 속도 오차가 48.05%에서 6.29%로, 압력 오차가 63.71%에서 7.25%로 줄었음."
  - "Poseidon-T는 속도 오차 74.97%에서 5.16%, 압력 오차 76.91%에서 6.84%로 줄었음."
  - "DPOT은 전체 구간의 14.56%만 보정해도 매 구간 재구성과 비슷한 오차를 유지함."
  - "A100 GPU 한 장에서 평균적으로 실시간 예측·보정이 됨."
