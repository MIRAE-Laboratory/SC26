summary_ko: "양자 자원 관리 인터페이스(QRMI)는 양자 워크로드의 스케줄링, 실행, 모니터링을 위한 표준 API를 가진 벤더 중립 미들웨어로, 양자 자원을 CPU, GPU와 나란히 스케줄 가능하게 노출함. 이전에 Slurm으로 검증한 것을 넓혀 배치 스케줄러들, 클라우드 조율 플랫폼, 그래프 기반 스케줄러에서 검증함. 저자는 모두 28명임."
claims:
  - "연동 방식, 구현 요건, 스케줄러별 고려 사항을 살피고 다른 접근과 비교함."
  - "스케줄러별 수정을 최소화하면서 사내와 클라우드의 이기종 양자 자원에 일관되게 접근할 수 있음을 확인함."
