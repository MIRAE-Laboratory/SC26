targets: [hpc-storage-systems]
summary_ko: "저장 대상을 공유하면 다른 작업의 부하에 따라 쓰기 대역폭이 출렁임. 운영 중인 파일시스템 셋에서 혼잡과 한산의 차이는 순간적이어서 튜닝은 작업마다 측정해야 함. 권한이 필요 없는 튜너가 쓰기 탐침으로 대상별 지연을 재고, 튜닝할지 정하고, 단순한 모델로 배치를 고르고, 작업을 한산한 대상에 무작위로 흩음."
claims:
  - "항상 튜닝하면 최악의 경우 13%, 전혀 하지 않으면 43%의 손해가 남."
  - "파일시스템 셋과 워크로드 여섯에서 탐침이 경합을 감지하고 무작위 선택이 충돌을 피함."
  - "차이가 있는 곳에서는 배치로 대역폭이 최대 1.85배 오르고 변동이 최대 4.7배 줄어듦."
