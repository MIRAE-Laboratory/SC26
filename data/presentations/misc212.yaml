summary_ko: "벤더와 기술 제공자가 양자-HPC 생태계를 어떻게 만들어 가는지 다루는 발표 묶음임. 양자 프로세서를 기존 HPC 환경에 통합하는 플랫폼, 런타임, 시스템 소프트웨어를 다룸."
claims:
  - "작업 스케줄링, 자원 관리, GPU 가속 고전 계산, 혼합 프로그래밍 모델을 포함함."
  - "운영에서 이미 되는 것, 떠오르는 인터페이스와 표준, 남은 공백에 초점을 둠. 공개 초록에는 수치가 없음."
