summary_ko: >
  HPC 소프트웨어와 워크플로를 지시하는 방식이 사람이 쓴 코드에서 서술형 문장으로 옮겨 가고 있음. 에이전트 프레임워크가 AWS 저지연 네트워크에서 HPC 확장성 연구를 최적화·실행할 수 있는지, 작업 명세를 워크로드 관리자 사이에서 변환할 수 있는지, 워크플로를 설계·실행할 수 있는지 평가함.
claims:
  - "Slurm과 Flux 사이에서 작업 명세 1,000개 중 982개를 변환했고, 모두 실제 Flux로 검증했음. 성능은 한 건을 빼고 사람이 쓴 것과 같았음."
  - "생명과학 워크플로에서 전문가가 쓴 변이 검출 파이프라인을 거의 그대로 재현했고, 평가 가능한 19회 중 18회가 참조 결과와 일치했음."
  - "에이전트가 스케줄링과 변환을 맡는 다중 클러스터 배치가 가능해짐."
