label: "A Next Generation Multi-Terabit/sec Campus and Global Network System for Data Intensive Sciences: The Global Network Advancement Group Data Intensive Science and AutoGOLE/SENSE Working Groups"
session: sess111
time: "14:45-15:00"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess111&id=ws_indis101"
authors: [harvey-newman]
