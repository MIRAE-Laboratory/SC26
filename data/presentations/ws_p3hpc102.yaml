summary_ko: "토카막 플라즈마 시뮬레이션 코드 Gysela-X++에서 뽑은 이식형 세미 라그랑지안 미니 응용을 분석함. 성능이 연산 수보다 메모리 접근 패턴에 좌우되는 코드임. 단일 소스 C++는 아키텍처 간에 정확성의 이식은 보장하지만 성능의 이식은 보장하지 않음을 확인함."
claims:
  - "코드에 배치와 루프 중첩의 튜닝 지점을 넣고 주 연산자 순서를 자동 튜닝하면 잃은 성능을 되찾음."
  - "전문가의 수동 최적화 대비 GPU에서 최대 1.47배, CPU에서 최대 1.53배 빠르며, 개발 시간은 일부만 듦."
