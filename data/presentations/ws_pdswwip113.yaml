label: "Trigger-Gated Multimodal LLM Agents for In-situ Scientific Simulation Monitoring"
session: sess129
time: "12:15-12:20"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess129&id=ws_pdswwip113"
authors: [hua-xu, jaime-cernuda, anthony-kougkas, ana-gainaru, scott-klasky, xian-he-sun, jay-lofstead]
