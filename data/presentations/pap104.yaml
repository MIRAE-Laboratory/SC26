label: "CoreFlow: Context-Centric Resource Management for LLM-Based Agentic Workflows"
session: sess235
time: "10:30-10:52"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess235&id=pap104"
authors: [jianxiong-liao, tiannan-fu, ruibo-fan, zhenheng-tang, zhi-zhou, xu-chen, xiaowen-chu]
addresses: [llm-serving-efficiency, agent-inference-cost, agent-job-execution]
