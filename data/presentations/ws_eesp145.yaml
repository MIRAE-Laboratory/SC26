summary_ko: >
  HLRS의 Hunter 슈퍼컴퓨터 CPU 노드에서 동작하는 PowerSched는 황금분할 탐색으로 작업별 동작점을 찾는데, 여러 측정 구간이 필요하고 워크로드 변화에 느리게 반응함. 이를 과거 작업 15,000개의 텔레메트리 전이 약 1,300만 건으로 오프라인 학습한 Implicit Q-Learning 제어기로 바꿈. 이미 수집하는 텔레메트리만 쓰고 응용 계측이 필요 없으며, 15초마다 소켓별 전력 상한을 예측함.
claims:
  - "HPL, HPCG, NAS 벤치마크 8개의 단일 노드 예비 실험에서 최대 상한 기준선 대비 노드 에너지가 7.1% 줄었음."
  - "평균 성능 저하는 1.0%임."
