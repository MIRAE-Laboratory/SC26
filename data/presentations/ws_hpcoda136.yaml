summary_ko: "연구 클러스터의 GPU 분할 계획을 운영 데이터 분석 과제로 다룸. 장기 운영 텔레메트리로 한 번의 구성 결정을 내림. 구간 수준의 수요 행렬을 만들고 구성 선택을 정수 계획 문제로 풂."
claims:
  - "최적 구성은 표본 내 충족률을 66.8%에서 98.1%로 올리고, 따로 둔 데이터에서 97.6%, 원 수요에서 99.7%에 이름."
  - "단순한 탐욕 계획이 최적해와 같음. 정수 조건을 푼 문제와의 차이가 0.001% 미만이기 때문임."
  - "수요가 늘어도 견디며 스케줄러의 자원 설정으로 바로 배치됨."
