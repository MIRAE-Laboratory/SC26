label: "Domain-Aware Power Rebalancing under Node-Level Power Caps on Aurora"
session: sess125
time: "16:16-16:28"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess125&id=ws_eesp120"
authors: [solomon-bekele, nick-eliopoulos, swann-perarnau, servesh-muralidharan, brice-videau]
addresses: [power-cap-slowdown]
proposes: [nonuniform-power-capping]
targets: [leadership-facility]
summary_ko: >
  Aurora의 이기종 노드에서는 노드 전력 상한 하나가 플랫폼 펌웨어의 GPU, CPU 코어, 메모리, CPU 언코어 사이 전력 배분까지 결정함. 이 숨은 배분을 특성화해, 빡빡한 상한에서 펌웨어가 응용 진행이 데이터 이동에 달려 있어도 언코어를 최소 근처에 묶어 두고, 그 결과 실행이 느려져 보드 총 에너지가 오히려 늘어남을 보였음. U-PullUp은 GPU 복사 엔진 활동을 데이터 이동 신호로 써서 언코어 주파수를 올려 달라고 요청하는 경량 GEOPM 에이전트임.
claims:
  - "SPEChpc 워크로드 9개에서 같은 상한의 기본 제어 대비 보드 에너지를 최대 34.2% 줄였음."
  - "워크로드별 최선 구성을 고르면 평균 19.6% 줄어듦."
