id: ws_aaihpc142
type: Presentation
kind: paper
label: "ScaleTether: Graph Rewriting and Selective Timing Prediction for Megatron Parallelism"
session: sess120
time: "12:06-12:12"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess120&id=ws_aaihpc142"
authors: [yukito-tajima, kazuki-fujii, rio-yokota]
addresses: [config-evaluation-cost]
proposes: [workload-graph-prediction, selective-measurement]
targets: [distributed-training]
summary_ko: >
  분산 학습의 자동 계획기는 실행해 보지 않은 구성을 평가해야 한다. ScaleTether는 버전이 고정된 Megatron 실행을 텐서·데이터·파이프라인 병렬화를 담은 워크로드 그래프로 바꾸고 ASTRA-sim용 Chakra 트레이스로 내보낸다. 그래프 지원 여부와 H100 실측 시간에 따라 시간 추정을 돌려주거나, 측정을 요청하거나, 지원하지 않는 구성을 거부한다.
claims:
  - "주입한 손상 72개를 모두 거부했고, 시간 오차 중앙값은 0.73~3.59%다."
  - "4-GPU 탐색 80회에서 추정 35건 모두 실측 최적을 골랐다."
  - "선택적 측정으로 획득 비용이 30.3% 줄었고(7.58 H100 GPU 시간), 보정 재사용 시 44.0% 줄었다."
  - "에이전트는 오프라인 세션 120회 모두 지침을 따랐고, 구성 숫자만 주면 52회에 그쳤다."
