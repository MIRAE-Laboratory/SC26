summary_ko: "메시지 전달과 태스크 기반 실행을 섞는 혼합 모델에서 통신과 동기화를 결합하는 방법을 다룸. 태스크와 결합한 경량 병렬 라이브러리 TALPF와, 같은 알림 식별자가 여러 번 나올 수 있게 한 알림 기반 MPI 확장을 제시함. 이 확장은 단방향 연산과 알림으로 양방향 의미를 흉내 내는 방식의 바탕이 됨."
claims:
  - "MareNostrum5에서 평가함."
  - "최신 태스크 인지 구현과 MPI 단방향 구현에 견주어 같거나 나은 성능을 보고하고, 프로그래밍 편의와 안전성, 이식성의 이점을 듦. 공개 초록에는 수치가 없음."
