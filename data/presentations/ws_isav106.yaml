summary_ko: >
  고해상도 심장 전기 시뮬레이션은 데이터가 커서 저장·전송 비용이 큼. 고정 출력 간격은 중복 상태를 저장하면서 전기 전파가 빠른 구간은 덜 잡음. 어떤 상태를 남길지 학습하는 적응형 인시투 워크플로를 제안함. 오프라인 교사가 정보가 많은 전압 상태를 찾고, 병렬 시뮬레이션에 내장한 경량 인과 신경망이 실행 중에 출력 여부를 정함. 그렇게 고른 비균일 데이터로 연속 시간 신경 연산자를 학습함.
claims:
  - "균일 시간 샘플링보다 상태를 적게 저장하면서 처음 보는 시뮬레이션의 예측 정확도는 오름."
  - "공개 초록에는 구체적 수치가 없음."
