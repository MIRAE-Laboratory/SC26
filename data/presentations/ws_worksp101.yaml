label: "nFlows: Enabling Efficient Data Movement in Data-Intensive Scientific Workflows on Non-Uniform Memory Access Architectures"
session: sess113
time: "10:30-10:45"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess113&id=ws_worksp101"
authors: [aurelio-vivas, thomas-applencourt, harold-castro]
addresses: [data-locality]
