summary_ko: >
  이기종 HPC 클러스터의 연산 능력을 묶으려면 독립 운영되는 클러스터 사이의 워크플로 맥락 유지, 대규모 데이터 이동, 사이트별 환경과 스케줄러 정책 추론, 실시간 큐·자원 상태 활용이 필요함. Diamond Agent는 에이전트용 작업 공간과 스킬(자원 탐색, 자원 명세, 데이터 이동, 실행, 결과 회수)을 제공하고, 상위 수준 행동을 사이트별 실행으로 변환함.
claims:
  - "데이터 이동은 Globus Transfer를 쓰고, 실시간 역량·큐 정보로 실행 위치를 고름."
  - "상주 서비스가 원격 작업을 감시하다가 결과나 판단이 필요한 이벤트가 있을 때만 에이전트를 깨워, 에이전트가 긴 배치 작업을 기다리지 않음."
  - "공개 초록에는 정량 결과가 없음."
