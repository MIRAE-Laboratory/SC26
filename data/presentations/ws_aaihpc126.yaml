label: "Diamond Agent: Agentic Control of Federated HPC Resources as a Service"
session: sess120
time: "10:50-11:00"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess120&id=ws_aaihpc126"
authors: [haotian-xie, junlin-chen, mingkai-zheng, yifan-zhu, minu-mathew, max-burnette, yadu-babuji, volodymyr-kindratenko, shivaram-venkataraman, kyle-chard, ian-foster, zhao-zhang]
addresses: [workload-portability]
