id: ws_aaihpc103
type: Presentation
kind: paper
label: "PILOT: Parallel Implementation via LLM-Oriented Translation"
session: sess120
time: "11:30-11:36"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess120&id=ws_aaihpc103"
authors: [antonino-ciordia, adrian-castello, enrique-s-quintana-orti, pedro-valero-lara]
addresses: [code-translation]
proposes: [repair-loop, differential-testing]
targets: [parallel-programming-models]
summary_ko: >
  PILOT은 LLM으로 직렬 C/C++ 코드를 선택한 백엔드의 병렬 구현으로 변환하는 파이썬 워크플로임. 컴파일 오류를 고치는 반복 루프를 돌리고 다중 턴 대화 맥락을 유지함. 원래 직렬 프로그램과 변환된 병렬 프로그램의 출력을 비교해 정확성을 확인하고 가속을 측정함.
claims:
  - "LLM 5종, 벤치마크 15개, 병렬 프로그래밍 모델 4종으로 평가했음."
  - "컴파일 성공률은 백엔드에 따라 88~100%이고, MPI와 Go는 모든 모델에서 컴파일되었음."
  - "유리한 벤치마크에서 커널 가속이 Go 48.75배, OpenMP 31.84배에 이름."
