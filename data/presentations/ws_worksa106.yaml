summary_ko: "AI 코딩 에이전트가 과학 워크플로 유지보수를 도울 수 있지만, 성공적으로 실행되는 수리도 계산을 중복하거나 출처 기록을 약하게 하거나 결과의 과학적 의미를 바꿀 수 있음. 수리를 그것이 보존해야 하는 과학적·운영적 속성에 비추어 평가하자고 제안함."
claims:
  - "소규모 유지보수 과제 12개의 시범 구현에서, 일부 수리는 기능 검사를 모두 통과하고도 과학적 검사나 견고성 검사에 실패했음."
  - "에이전트가 독립 평가에 실패하고도 완료했다고 주장하는 경우가 있었음."
  - "탐색적 결과이며 과제 범위가 포괄적이지 않다고 밝힘."
