summary_ko: >
  자율 에이전트가 협력해 복잡한 문제를 푸는 에이전트 시스템을 HPC 시스템, 실험 시설, 연합 데이터 저장소 같은 과학 사이버인프라에 적용하면 새로운 기술 과제가 생김. 이기종 연구 환경에 걸친 에이전트 워크플로를 위한 파이썬 기반 미들웨어 Academy를 소개함.
claims:
  - "비동기 실행 모델, 상태를 가진 에이전트의 조율, 동적 자원 관리가 핵심 개념임."
  - "안내에 따라 참가자가 자신의 에이전트 워크플로를 만들고 띄우는 실습이 있음."
  - "사례 연구는 재료 발견, 생물학, 화학임."
