label: "Sovereignty above the scheduler: pluggable site policies and a federated view for AI/HPC with Waldur"
session: sess138
time: "11:00-11:30"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess138&id=ws_scc103"
authors: [ilja-livenson]
addresses: [vendor-dependence, identity-access, compliance-governance]
proposes: [federated-allocation-platform]
targets: [federated-clusters, job-scheduler, national-ai-infrastructure]
summary_ko: "주권형 AI·HPC 사이트는 자기 정책을 집행하고 구성요소를 바꾸면서도 연합에 남아 있어야 함. MIT 라이선스의 배분·정산 플랫폼 Waldur를 소개함. EuroHPC 연합 플랫폼의 배분 구성요소이며 스위스, 영국, 에스토니아의 여러 사이트에서 운영 중임."
claims:
  - "꽂아 쓰는 에이전트가 배분을 각 사이트의 백엔드(Slurm, Kubernetes, OpenStack)에 대응시키고 지역 정책을 적용함."
  - "공통 데이터 모델로 자금 지원 기관, 사용자, 위원회가 이기종 사이트를 한 화면으로 봄."
  - "무엇을 표준화하고 무엇을 사이트에 둘지, 그 경계가 구성요소 라이선스 변경의 영향을 어떻게 제한하는지 논의함."
