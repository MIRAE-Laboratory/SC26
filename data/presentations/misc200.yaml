summary_ko: "NVIDIA의 CUDA 프로그래밍 모델에 타일 기반 병렬 프로그래밍 추상화 CUDA Tile이 더해졌음. 언어 기능의 모음이 아니라 MLIR 기반 컴파일러 단계의 연속으로 만들어 더 풍부한 코드 생성이 가능함."
claims:
  - "스레드 수준과 타일 수준 병렬성의 상호작용에서, 재지정 가능한 추상화가 코드 수정 없이 자동 튜닝만으로 훨씬 적은 코드로 높은 성능에 이르는 방법을 얻었음."
  - "NVIDIA의 가속 수학 라이브러리를 CUDA Tile로 바꾸는 중임."
  - "AI 코딩 에이전트가 코드를 최적화할 때 타일·스레드 수준 추상화가 어떻게 돕고 방해하는지도 다룸."
