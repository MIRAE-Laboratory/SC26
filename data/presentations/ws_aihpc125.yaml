summary_ko: "HPC에서 AI 학습의 에너지는 대개 실행에만 묶인 한 덩어리로 다뤄짐. 준비와 사후 단계를 포함한 학습 생애주기 전체에서 에너지를 재고, 실행을 단계로 나눠 단계와 사건별로 귀속시킴."
claims:
  - "운영 중인 슈퍼컴퓨터에서 적용함. 실행 단계는 입출력이 많은 ResNet-50과 GPU에 묶인 LLM으로 시험함."
  - "에너지를 정확히 귀속하고 학습 파이프라인의 효율을 높이기 위한 교훈을 제시함. 공개 초록에는 수치가 없음."
