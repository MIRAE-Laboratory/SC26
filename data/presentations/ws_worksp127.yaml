authors: [diana-e-carrizales-espinoza, dante-d-sanchez-gallegos, raffaele-montella, jesus-carretero]
addresses: [continuum-risk, energy-performance-tradeoff]
proposes: [risk-contracts]
targets: [workflow-systems]
summary_ko: "에지와 클라우드 사이로 산출물을 옮기는 워크플로는 노출, 손상, 무단 변경, 가용성 상실 같은 위험을 지고, 이를 막는 비기능 요구의 집행은 에너지와 실행 시간을 더 씀. 위험 완화를 필수·선택 계약 조항으로 표현하고 이를 비기능 메커니즘의 파이프라인으로 옮기는 계약 실현 계층을 제안함."
claims:
  - "필수 조항을 모두 충족하고 에너지·실행 시간 한도 안에 드는 후보만 받아들이며 선택 조항의 충족을 최대화함."
  - "균형 계약 프로파일에서 선택 조항 충족률이 84%로, 전역 일괄 정책의 67%보다 높음."
