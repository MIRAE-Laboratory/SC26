summary_ko: "양자 장치가 HPC 센터에 직접 설치되며 표준 인터페이스의 수요가 생김. 떠오르는 장치 관리 인터페이스(QDMI)는 여러 양자 방식을 한 인터페이스로 다루는 저수준 추상화를 제공함. 소프트웨어 스택 전체를 장치 하나로 다루는 방식을 제안함."
claims:
  - "독일의 한 슈퍼컴퓨팅 센터 소프트웨어 스택을 장치로 구현한 개념 증명을 제시함."
  - "소프트웨어 스택과 양자 작업의 생애주기 관리에서 얻은 교훈을 공유함. 공개 초록에는 수치가 없음."
