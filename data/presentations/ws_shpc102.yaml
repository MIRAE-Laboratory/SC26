summary_ko: >
  공유 과학 AI의 프라이버시 위험은 개인 레코드보다 기관의 참여 여부, 전략, 역량 노출에 있다고 봄.
  차분 프라이버시, 연합학습, 보안 연산, 신뢰 실행, 출처 추적 같은 기존 도구는 신뢰 수준이 섞여 있고
  자율 에이전트가 참여하는 기관 간 환경에서 잘 조합되지 않음. 프라이버시를 여섯 요소로 정의되는
  보증 문제로 다루고, 생애주기 주장 등록부로 리더십급 시설 고유의 공백 두 가지를 찾아냄.
claims:
  - 스케줄러 메타데이터가 기관의 참여 사실을 드러냄.
  - 장비에 연결된 제어 루프가 타이밍과 가속기 경합을 통해 연구 전략을 누출함.
  - 프라이버시 주장을 진술·비교·감사할 공통 양식과 여섯 가지 우선 과제를 제안함.
