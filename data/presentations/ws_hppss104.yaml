summary_ko: >
  AMD GPU 기반 시스템 LUMI에서 Vision Transformer 학습의 데이터·파이프라인·텐서 병렬화를 실증 평가했음. 컨테이너화된 ROCm 환경에서 PyTorch, FairScale, TensorFlow DTensor, Colossal-AI를 쓰고, 프레임워크 호환성, 이식성, 구현 복잡도, 재현성을 봄.
claims:
  - "소프트웨어 생태계의 준비도가 AI 학습의 확장성을 크게 좌우함."
  - "PyTorch DDP와 TensorFlow DTensor는 안정적으로 돌았고, CUDA에 의존하는 여러 접근은 AMD 아키텍처에서 배치에 어려움을 겪었음."
  - "공개 초록에는 정량 결과가 없음."
