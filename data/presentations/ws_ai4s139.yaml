summary_ko: >
  교류 최적조류(ACOPF)의 학습 대리모델은 고전 솔버보다 훨씬 빠르지만, 실용 가치는 예측 정확도가 아니라 물리적으로 실행 가능한 결과를 내느냐에 달려 있다. 증강 라그랑지안 목적함수는 제약 충족을 높이지만 스텝당 비용이 든다. 모델 크기와 데이터 크기를 바꿔 가며 MSE 학습과 비교한다.
claims:
  - "두 목적함수 모두 멱법칙을 따라 개선된다."
  - "MSE에서는 예측 손실이 데이터 크기보다 모델 크기에 더 좌우되고, 증강 라그랑지안에서는 두 축에서 비슷한 속도로 개선된다."
  - "증강 라그랑지안에서는 계통이 커져도 제약 위반이 훨씬 느리게 늘어난다."
  - "같은 하드웨어와 학습 표본 수에서 위반이 약 19배 줄고, 학습 시간은 약 2.4배 든다."
