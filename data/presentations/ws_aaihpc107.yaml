summary_ko: >
  기존 LLM 기반 병렬 코드 변환은 고정된 순차 파이프라인을 쓰고, 모든 실패에 같은 수리 전략을 적용하며, 과학 계산 관행에 맞지 않는 정확성 기준을 쓴다. 번역, 컴파일 진단, 실행 검증을 맡는 에이전트 셋으로 나누고, 판정 기반 조율기가 실패마다 맞는 수리 스킬로 보낸다. 자동 출력 검사가 자기 수정 루프를 돌리고, 오프라인 LLM 검증이 컴파일·실행 검사를 통과한 거짓 양성을 잡는다.
claims:
  - "HeCBench 커널 30개를 CUDA, OpenMP, SYCL 사이에서 양방향으로 변환했고, 오픈소스 LLM 3종을 썼다."
  - "모델·방향 조합 18개 모두에서 기준선보다 검증된 정확률이 높다."
  - "토큰 사용은 최대 52.4% 적다."
