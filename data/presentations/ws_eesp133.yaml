summary_ko: >
  AI·HPC 가속기의 전력 밀도가 계속 오르고, 로드맵에는 1, 3, 5 kW급 가속기가 있음. 이 칩 수준 열부하를 시설 냉각 에너지나 유량 부담 없이 제거하기는 어려움. 액체 냉각 열 스택을 특성화하고 차세대 AI 장치에 필요한 설계 변수를 찾음.
claims:
  - "반복 측정으로 얻은 입구 기준 열저항은 0.0383 K/W임."
  - "히터 평균 100 °C 한계, 5 L/min에서 기본 스택은 3.04 kW를 방열했고, 얇은 액체금속 계면을 더하면 예상 용량이 6.41 kW가 됨."
  - "3 kW에서 이 계면은 필요 유량을 4.61에서 0.92 L/min으로 줄이고 허용 입구 온도 여유를 40.5 °C 늘림."
