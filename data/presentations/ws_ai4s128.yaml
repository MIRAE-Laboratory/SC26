summary_ko: >
  과학 워크플로는 저장장치·메모리 계층으로 엑사스케일 데이터를 정체 없이 다루는데, 이는 전통적 HPC 워크플로의 접근 패턴이 예측 가능하기 때문이다. 에이전트가 다음 실행을 결정하는 워크플로에서는 이 예측 가능성이 깨진다.
claims:
  - "대표 워크플로에서 최신 계층형 메모리·스토리지 시스템은 데이터 수요를 너무 늦게 알아 실행 시간을 3.18배 늘렸다."
  - "아티팩트 적재 시간의 약 93%는 바이트 전송이 아니라 표현 변환에 쓰인다."
  - "변환 비용 때문에 어떤 표현은 다른 표현보다 보관 가치가 약 65배 높다."
  - "모델과 변환된 데이터가 호스트 메모리를 두고 경쟁하므로, 에이전트 프레임워크 신호로 재사용 시점을 예측해야 한다."
