label: "HOLOS: A Gradient-Descent-Based Design-Space Exploration Framework for Hierarchical AI Accelerator Systems"
session: sess141
time: "16:48-17:00"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess141&id=ws_aihpc124"
authors: [sairam-vatsavai, daniel-peralta-velazquez, siyuan-ma, george-biros, jaydeep-kulkarni, lizy-kurian-john, andreas-gerstlauer, adolfy-hoisie, lingda-li]
addresses: [hardware-selection, simulation-scale-limits]
