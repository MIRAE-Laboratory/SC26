summary_ko: "한 번의 제출로 모든 노드에서 같은 벤치마크를 돌리는 클러스터 전체 상시 벤치마크 틀임. CPU, GPU, 메모리, 인터커넥트, 입출력을 다룸. 반복 실행으로 커널 갱신이나 새 라이브러리 버전에 따른 회귀를 잡고 하드웨어 편차 연구용 데이터셋을 쌓음."
claims:
  - "세 클러스터에서 한 구성요소 안의 편차는 1% 이내이고, 사양이 같은 노드 사이의 편차는 5%에 이름."
  - "성능과 전력, 주파수, 온도의 상관이 공랭 노드와 수랭 노드에서 다름."
