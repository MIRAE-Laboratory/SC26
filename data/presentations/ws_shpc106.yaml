id: ws_shpc106
type: Presentation
kind: paper
label: Quantifying Workload Exposure in HPC Power Telemetry at Operational Sampling Rates
session: sess126
time: "16:22-16:41"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess126&id=ws_shpc106"
authors: [kwesi-danso, samuel-abiola, susan-mengel]
addresses: [workload-fingerprinting, metadata-side-channel]
proposes: [sampling-coarsening]
targets: [power-telemetry]
summary_ko: >
  공개되는 전력 텔레메트리로 HPC 워크로드를 식별할 수 있는지 측정한다. 약 1 kHz로 수집한 Intel RAPL
  CPU 전력 데이터를 최대 60초 간격까지 다운샘플링하고, 처음 보는 문제 크기에서 자원 등급과 개별
  워크로드를 얼마나 복원할 수 있는지 평가한다.
claims:
  - 샘플링이 성길수록 복원도가 떨어진다(자원 등급 0.87→0.71, 워크로드 식별 0.74→0.54).
  - 짧은 작업에서는 성긴 샘플링이 타이밍 특징을 지우지만 정상 상태 전력 패턴은 남는다.
  - 서로 뚜렷이 다른 워크로드는 성긴 주기에서도 식별된다.
  - 샘플링 주기 완화는 실용적이지만 불완전한 프라이버시 통제다.
