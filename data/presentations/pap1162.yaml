id: pap1162
type: Presentation
kind: paper
label: "Characterizing the Scalability and Performance of Large-Scale AI Training Under Multi-Tenancy"
session: sess227
time: "11:37-12:00"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess227&id=pap1162"
authors: [jacopo-raffi, thomas-pasquali, lorenzo-piarulli, filippo-spiga, marco-faltelli, andreas-herten, domenico-siracusa, daniele-de-sensi, flavio-vella]
addresses: [llm-training-scaling, network-congestion, benchmark-validity]
