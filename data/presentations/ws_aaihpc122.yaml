summary_ko: >
  AI 에이전트는 대규모 계산재료 워크플로를 스스로 구성할 수 있지만, 적응적이고 잘게 쪼개진 작업을 여러 HPC 시스템에서 효율적으로 돌리기는 어려움. ParslBox는 로컬 작업 데이터베이스, 세밀한 CPU/GPU 자원 관리, 이기종 시스템 간 이식성을 갖춘 경량 실행 도구이며 명령줄, 파이썬, MCP 인터페이스를 제공함.
claims:
  - "노드 2,000개, 동시 작업자 24,000개까지 낮은 조율 오버헤드로 확장했음."
  - "LAMMPS(MACE)와 VASP로 강한 확장성을 시험했음."
  - "폐쇄·공개 가중치 모델 모두에서 대규모 작업 등록이 안정적으로 반복되었음."
  - "에이전트가 주도한 종단 간 워크플로로 용융 LiCl-NaCl, LiCl-KCl 계의 기계학습 원자간 퍼텐셜을 생성했음."
