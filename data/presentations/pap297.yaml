label: "What Bloats Your Floats? Right-Sizing Numerical Precision for Scientific Computing"
session: sess224
time: "08:30-08:52"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess224&id=pap297"
authors: [pratyai-mazumder, alexandru-calotoiu, marcin-copik, yakup-koray-budanaz, shriram-chandran, torsten-hoefler]
addresses: [fp64-scarcity, numerical-error]
proposes: [mixed-precision, design-space-exploration]
