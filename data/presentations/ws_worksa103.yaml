summary_ko: "핵융합 시뮬레이션 연구는 응용 설정, 워크플로 구성, 실행, 데이터 이동, 결과 분석을 사람이 조율함. 연구자가 목표와 제약을 자연어로 서술하면, 구성 계층이 컨테이너화된 핵융합 응용과 기계가 읽는 응용 기술서로 실행 가능한 워크플로를 만드는 AI 에이전트 기반 틀을 구상함."
