authors: [michael-polinski, peter-dinda]
addresses: [memory-safety, untrusted-input]
proposes: [fuzzing, ai-exploit-generation]
targets: [scientific-apps]
summary_ko: >
  과학 소프트웨어가 조작된 입력을 이용한 통상적 공격에 얼마나 취약한지 조사함. 퍼징과 보안 관점의
  버그 분류를 적용해 Enzo, GROMACS, Laghos, LAMMPS(합계 약 300만 줄)를 시험했음.
claims:
  - 고유 크래시가 약 1,000건 발견되었음.
  - 휴리스틱 분석상 응용당 약 7.3%가 쉽게 악용 가능함.
  - 전체 버그의 26%(GROMACS는 51%)가 악용 가능한 힙 메모리 안전성 문제임.
  - 임의 코드 실행 가능성이 있는 취약점이 110개 이상이며, 코딩 에이전트가 재현 가능한 PoC 익스플로잇 59개를 생성했음.
  - 비신뢰 데이터가 계산 결과의 무결성을 훼손할 수 있음.
