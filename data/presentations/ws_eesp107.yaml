summary_ko: >
  전기가 싸고 깨끗한 야간 같은 반복 시간대에 노드 일부를 끄는 스케줄러 통합 정책을 조사했음. 유휴 노드를 끄면 비용은 줄지만 작업 대기가 길어질 수 있음. 이를 상쇄하려고 가단성 작업을 씀. 스케줄러가 셧다운 전에 작업을 줄여 노드를 비우고 이후에 다시 늘림.
claims:
  - "운영 슈퍼컴퓨터 세 곳의 작업 집합으로 시뮬레이션 270회를 돌렸음."
  - "작업의 25%가 가단성이면 노드 30% 셧다운이 운영자와 사용자 모두에게 이득임."
  - "셧다운 없는 고정 스케줄링 대비 일일 전기료가 최대 12.5%, 작업 처리 시간이 최대 56.2% 줄었음."
