summary_ko: >
  언어 모델은 화학을 높은 수준에서 추론하지만 화학적 타당성이나 합성 가능성을 어기는 설계를 자주 낸다. CHARGE는 대규모 추론 모델에 자동 도구 호출을 결합해, 화학정보학 유틸리티와 신경망 물성 예측기를 추론 루프 안에 넣는다. 가설 생성, 검증, 개선이 사용자 개입 없이 돌아간다.
claims:
  - "분자 설계 과제 10개에서 도구 없는 LLM보다 물성이 개선된 분자를 일관되게 냈다."
  - "화학 합성 결과 예측 정확도가 도구 보조 추론으로 12%에서 40%로 올랐다."
