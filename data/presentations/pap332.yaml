summary_ko: "엑사스케일 시뮬레이션은 저장하거나 분석할 수 있는 것보다 빠르게 데이터를 냄. 오차 통제 손실 압축은 압축할 때 허용 오차를 정해야 하고, 점진적 압축은 그 제한을 풀지만 고정된 재구성 전략에 묶여 있고 분해된 계수 사이의 상관을 다 쓰지 못함. 오차 한계와 신호 대 잡음비라는 두 목표에서 꺼내 쓰는 효율을 높이는 적응형 점진 압축 틀을 제시함."
