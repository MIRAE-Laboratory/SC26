summary_ko: "대형 GPU 클러스터 사이트에서 교대 근무 사이에 사라지는 운영 지식을 보존하는 작고 벤더 중립적인 시스템임. 4주면 여섯 요소로 만들 수 있고 그중 다섯은 대부분의 사이트가 이미 가진 것임."
claims:
  - "요소는 터미널용 에이전트 도구, 텔레메트리를 읽기 전용으로 노출하는 MCP 서버, 버전 관리되는 마크다운 절차, git 저장소, 로컬 검색 색인, 수백 줄의 생성 코드임."
  - "되쓰기 규칙에 따라, 문서를 읽은 에이전트는 같은 작업 안에서 그것을 검증하고 보강해야 함."
  - "모니터링 화면을 만드는 데 1분이 들면 대시보드는 일회용이 된다는 뜻밖의 효과가 있었음."
