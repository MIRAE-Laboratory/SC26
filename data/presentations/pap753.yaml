id: pap753
type: Presentation
kind: paper
label: "How Much Can Large Language Models Optimize Job Management in HPC Systems?"
session: sess213
time: "13:52-14:15"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess213&id=pap753"
authors: [yiqin-dai, huize-zhang, yifu-gao, yong-dong, juan-chen, ruibo-wang, xinghua-cheng, yuhan-cai, zekai-li, chun-fan, kai-lu]
addresses: [resource-prediction, workflow-scheduling, ops-data-complexity]
proposes: [llm-ops-assistant, context-retrieval, multi-agent-workflow]
targets: [job-scheduler, ai-agents]
summary_ko: "LLM이 HPC 작업 관리에 얼마나 도움이 되는지 작업 생애의 세 지점에서 조사함. 제출 시 자원 수요 예측, 스케줄링 중 채우기 매개변수 조정, 실행 중 이상 진단임. 도메인 지도 미세조정, 검색 증강 생성, 에이전트 워크플로를 한 틀에 결합하고, 안전한 배치를 위한 환각 완화 장치를 더함."
claims:
  - "공개 모델과 상용 모델 여럿, 과거 데이터셋으로 실험함."
  - "도메인 특화 모델이 자원 수요 예측 정확도와 스케줄링 효율을 높이고, 이중 에이전트 워크플로로 해석 가능한 원인 분류를 낸다고 보고함. 공개 초록에는 수치가 없음."
