summary_ko: >
  HPC 응용은 빌드 시스템과 구성 옵션이 제각각인 외부 패키지 수백 개에 의존함. Spack이 의존성 해결을 자동화하지만 패키지 레시피는 손으로 쓰고 유지 부담이 커지고 있음. LLM이 유효한 Spack 레시피를 내는 데 필요한 컨텍스트와 피드백을 체계적으로 연구하며, 저장소 메타데이터 추출, 참조 패키지 검색, 반복 수리의 효과를 분리함.
claims:
  - "구조화된 빌드 정보를 주면 설치 성공률이 최소 컨텍스트의 약 43%에서 최선 구성의 100%로 오름."
  - "메타데이터 정제, 참조 패키지, 진단 피드백이 HPC 패키지 합성에 필수임."
