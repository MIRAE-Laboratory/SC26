summary_ko: >
  과학 ML은 초고해상도 데이터에서 막히고, 기존 완화책은 확장이 안 되거나 정확도를 떨어뜨림. 대규모 공간 데이터를 다루는 방법들은 특정 모델 전용임. ShardTensor는 DDP가 데이터 병렬화를 보편화한 것처럼 도메인 병렬화를 표준 학습·추론에 가져오는 PyTorch 네이티브 추상화임.
claims:
  - "모델을 고치지 않고 쓸 수 있고, 기존 데이터 병렬·모델 병렬 기법과 결합됨."
  - "수정하지 않은 모델이 GPU 한 장의 메모리보다 큰 입력으로 학습됨."
  - "큰 입력에서 거의 선형으로 확장되고 고해상도 추론이 빨라짐."
  - "공개 초록에는 구체적인 수치가 없음."
