id: ws_aaihpc139
type: Presentation
kind: paper
label: "The LLM Writes Only the Algorithm: Bit-Identical Fortran-to-C++ Substitution, and What It Certifies"
session: sess120
time: "12:00-12:06"
url: "https://sc26.conference-program.com/?post_type=page&p=16&sess=sess120&id=ws_aaihpc139"
authors: [kevin-menear, olivia-hull, jon-rood, daniel-zalkind]
addresses: [code-translation, legacy-modernization, translation-verification]
proposes: [deterministic-llm-split, bit-identical-gates]
targets: [legacy-fortran]
summary_ko: >
  컴파일 성공, 유사도 지표, 개별 함수 시험 같은 통상의 평가는 변환된 함수가 결과를 바꾸지 않고 운영 코드의 원본을 대체할 수 있는지 보여 주지 못한다. VIT(Verified Incremental Translator)는 상호운용 코드를 직접 생성하고 LLM은 알고리즘 함수 본문만 쓴다. 각 본문은 수집한 운영 상태의 재생과 전체 시뮬레이션 기준선이라는 두 비트 동일 관문을 통과해야 한다.
claims:
  - "풍력 터빈 제어기 ROSCO를 전부 C++로 변환했고, 27개 시나리오에서 출력 256만 개가 정확히 일치했다."
  - "규모가 약 10배인 OpenFAST의 AeroDyn에서는 프로시저 507개 중 33개를 변환했다."
  - "주입한 결함 14개 중 3개가 두 관문을 모두 통과했다."
  - "비트 동일성은 실행된 입력에서의 일치를 보일 뿐 두 구현의 동등성을 보이지 않는다. 변환이 싸질수록 검증 오라클이 병목이 된다."
