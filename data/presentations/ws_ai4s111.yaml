summary_ko: >
  신경망 대리모델이 하이브리드 PDE 솔버를 실제로 빠르게 하는지는 인시투에서만 알 수 있고, 배치 구성이 성능을 크게 좌우함. MPI 모델에 맞춘 추론 프레임워크 Coconut은 모델 수준(배치 크기, 수치 정밀도, 장치 배치, 추론 백엔드)과 구조 수준(프로세스 토폴로지)의 선택지를 노출함. PyTorch Inductor 백엔드에 필요한 내장 파이썬 인터프리터의 오버헤드도 마이크로벤치마크로 측정함.
claims:
  - "산업용 열 다상유동 시뮬레이터에서 열역학 대리모델이 커널 기준 2.4배 느린 상태에서 34.12배 빠른 상태로 바뀌었음."
  - "멀티스레드 배치 기준선 대비로는 2.51배임."
  - "이득은 응용 수준 처리량까지 이어짐."
  - "대리모델이 이득이 되는지는 배치 선택이 결정함."
