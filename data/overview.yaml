# 세션 전체를 묶은 종합 고찰. 뷰어에서 "전체 세션"을 고르면 표시됩니다.
label: 세 세션 종합
insights:
  decision:
    - head: 판단 기준이 "돌아간다"에서 "검증된다"로 옮겨 갔다.
      text: 컴파일과 실행 성공은 세 세션 모두에서 기준으로 인정받지 못했다. 익스플로잇이 가능한 코드, 관례를 어긴 코드, 결함을 숨긴 변환 코드가 모두 그 기준을 통과했다.
      refs: [ws_shpc104, ws_ai4s109, ws_aaihpc139]
    - head: 에이전트의 권한은 모델 바깥에서 정한다.
      text: 런타임 정책, 출처 레이블, 승인 관문처럼 모델이 바꿀 수 없는 곳에 결정을 둔다.
      refs: [misc163, ws_aaihpc132, ws_aaihpc114]
    - head: 책임과 보증을 문서로 명시한다.
      text: 공격 경로별 책임 주체, 감사 가능한 프라이버시 주장, 에이전트 행동의 출처 기록이 같은 방향이다.
      refs: [ws_shpc101, ws_shpc102, ws_aaihpc144]
  trial:
    - head: 에이전트는 인프라의 전제를 깬다.
      text: 예측 가능한 접근 패턴을 가정한 저장 계층이 느려진다는 결과가 서로 다른 발표 셋에서 나왔다.
      refs: [ws_ai4s128, ws_aaihpc130, ws_aaihpc124]
    - head: 성패는 모델이 아니라 주변 조건에서 갈린다.
      text: 대리모델은 배치 구성과 격자, 코드 변환은 대상 지식과 실행 피드백, 롤아웃은 실측 센서가 결과를 좌우했다.
      refs: [ws_ai4s111, ws_aaihpc109, ws_ai4s140]
    - head: 단일 방어선은 버티지 못한다.
      text: 샘플링 완화, 규칙 기반 차단, 비트 단위 재현 모두 부분적으로만 막았다.
      refs: [ws_shpc106, ws_aaihpc132, ws_aaihpc139]
  korea:
    - head: 도입 순서는 계측, 경계, 기록, 그다음이 에이전트다.
      text: 사용량을 재고, 실행 경계와 책임을 정하고, 행동 기록을 남길 수단을 갖춘 뒤 에이전트를 연구 인프라에 들인다.
      refs: [ws_aaihpc124, misc163, ws_aaihpc144]
    - head: 기관 고유의 검증 자산이 경쟁력이다.
      text: 기준 출력, 시험 사례, 자체 벤치마크가 있어야 AI가 만든 코드와 모델을 받아들일지 판단할 수 있다. 모델은 바뀌어도 이 자산은 남는다.
      refs: [ws_aaihpc114, ws_ai4s109]
    - head: 전문가의 절차를 파일로 남긴다.
      text: 분석 절차를 스킬 파일로 관리하면 사람이 바뀌어도 절차가 유지되고, 에이전트가 그 절차를 따르게 할 수 있다.
      refs: [ws_ai4s131, ws_aaihpc126]
  extra:
    - head: 작업 스케줄러가 세 세션의 교차점이다.
      text: 메타데이터 누출 경로이고, 에이전트 부하를 받는 제어 평면이며, 보안 경계이자 변환 대상이다.
      refs: [ws_shpc102, ws_aaihpc124, ws_aaihpc132, ws_aaihpc104]
    - head: AI는 공격과 방어, 생산과 검증 양쪽에 모두 있다.
      text: 같은 코딩 에이전트가 익스플로잇을 만들고, 코드를 현대화하고, 다른 에이전트의 코드를 채점한다.
      refs: [ws_shpc104, ws_aaihpc114, ws_ai4s109]
