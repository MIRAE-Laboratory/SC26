id: sess234
type: Session
label: "Papers in Conversation: Quantum–HPC Integration Moves to Real Systems"
kind: Paper
topic: 양자
date: "2026-11-19"
time: "13:30-15:00 CST"
room: W181abc
url: https://sc26.conference-program.com/session/?sess=sess234
chairs: [rosa-m-badia, mar-tejedor-ninou]
summary_ko: "양자와 HPC의 통합이 실제 시스템으로 옮겨 간다는 주제로 묶은 논문 세션. 표준 장치 관리 인터페이스로 실제 초전도 장치를 기존 스케줄러와 사용자 도구에 연결한 사례, 혼합 워크플로를 끝에서 끝까지 추적하고 재생하는 분석 방법, 유사한 문제 묶음에서 자원을 적응적으로 배분하는 GPU 가속 런타임을 다룸."
diagram:
  type: layers
  title: 양자-HPC 통합에서 표준화와 측정이 들어간 층
  items:
    - {label: 응용 런타임, note: "유사한 문제는 건너뛰거나 짧게 풂. 평가 횟수 최대 78.3% 감소"}
    - {label: 워크플로 분석, note: 계층을 가로지른 추적과 재생으로 장치 중심 지표가 놓친 병목을 드러냄}
    - {label: 작업 실행, note: 기존 배치 스케줄러와 사용자 도구에 연결}
    - {label: 장치 경계, note: 표준 장치 관리 인터페이스로 벤더별 연결 사슬을 대체}
insights:
  decision:
    - head: 통합의 걸림돌이 접근에서 연결 방식으로 옮겨 감.
      text: 양자 장치가 HPC 센터 안으로 들어오면서 벤더별 연결 사슬이 운영을 어렵게 하고 시범에서 운영으로의 전환을 늦춤. 소프트웨어와 하드웨어의 경계를 표준화하면 스택의 많은 부분을 사업자와 배치 방식을 넘어 다시 쓸 수 있다는 것을 실제 장치로 보임.
      refs: [pap634]
  trial:
    - head: 장치 중심 지표만으로는 혼합 워크플로의 병목을 놓침.
      text: 혼합 응용은 HPC 노드, 모의기, 워크플로 런타임, 네트워크 서비스, 원격 장치에 걸쳐 돌아, 구성요소마다 관측 방식이 달라 결과를 재현하고 비교하기 어려움. 통합 추적 형식과 의존 관계를 지키는 재생으로 이를 다룸. 공개 초록에는 수치가 없음.
      refs: [pap662]
    - head: 고정 예산의 양자-고전 반복은 비슷한 문제에서 자원을 낭비함.
      text: 계수만 다른 유사한 해밀토니안 묶음에서 유사도 지표로 건너뛸지, 짧게 풀지, 완전히 최적화할지 예측하자 고전·양자 평가가 최대 78.3%, 실행 시간이 최대 74.8% 줄었음.
      refs: [pap943]
  korea:
    - head: 양자 장치 도입 사양에 표준 장치 인터페이스의 지원을 넣음.
      stage: prep
      area: 양자
      needs: 후보 인터페이스의 조사와 기존 스케줄러 연동 시험
      needs_group: 조사와 대상 선정
      text: 독일의 인터페이스로 실제 초전도 장치를 배치 스케줄러에 연결한 구현이 공개됨. 벤더별 연결에 묶이지 않으려면 도입 단계에서 인터페이스를 요구 사항으로 두는 편이 나음. 워크숍의 벤더 중립 인터페이스 논의와 같은 방향임.
      refs: [pap634, ws_sfwm112]
  extra:
    - head: 워크숍에서 검증 단계였던 인터페이스가 본 학회에서 실제 장치 사례로 나옴.
      text: 일요일의 양자 워크숍은 인터페이스의 설계와 검증을 다뤘고, 이 세션은 상용 초전도 장치에 연결한 실제 사례와 공개 구현을 제시함.
      refs: [pap634, ws_sfwm121]
