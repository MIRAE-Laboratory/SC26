id: sess203
type: Session
label: "Trustworthy GPU Lossy Compression"
kind: Paper
topic: 데이터·워크플로·네트워크
date: "2026-11-17"
time: "15:30-17:00 CST"
room: W175abc
url: https://sc26.conference-program.com/session/?sess=sess203
chairs: [mackenzie-boyd]
summary_ko: "GPU에서의 손실 압축을 믿고 쓸 수 있게 하는 방법을 다루는 논문 세션. 점진적 압축의 효율 개선, 관심 영역의 오차를 따로 통제하는 GPU 압축기, 압축 오차가 하류의 관심량에 미치는 영향을 예측하는 통계 틀, 고정 압축률과 오차 한계를 함께 맞추는 압축기를 다룸."
diagram:
  type: shift
  title: 손실 압축의 보증이 넓어지는 방향
  from_label: 이전
  to_label: 이 세션
  items:
    - {from: 원소마다의 오차 한계, to: 하류 관심량의 편향과 불확실성 예측}
    - {from: 전체에 같은 허용 오차, to: 관심 영역만 엄격하게}
    - {from: 압축할 때 허용 오차를 정함, to: 나중에 필요한 만큼만 꺼내는 점진적 압축}
    - {from: 오차 한계 또는 고정 크기 중 하나, to: 둘을 함께 맞춤}
insights:
  decision:
    - head: 압축의 허용 오차를 원소가 아니라 분석 결과에서 정함.
      text: 원소별 오차 한계는 지역 평균이나 신경망 예측 같은 하류 관심량의 오차를 보장하지 않음. 원본의 0.1% 미만인 메타데이터로 관심량의 편향과 불확실성을 예측하는 틀이 552가지 평가 가운데 93.1%에서 잘 보정된 예측을 냄.
      refs: [pap529]
  trial:
    - head: 오차 한계형은 크기를, 고정 비율형은 품질을 예측할 수 없었음.
      text: 오차 한계 압축은 출력 크기를 알 수 없어 메모리 계획이 어렵고, 고정 비율 압축은 오차를 통제하지 못함. 둘을 결합한 압축기가 A100 한 장에서 257.1 GB/s를 내어 기존 고정 비율 압축기의 3.25배였음.
      refs: [pap886]
    - head: 전체에 같은 허용 오차를 주면 압축률을 잃음.
      text: 관심 영역만 엄격하게 통제하자 균일 허용 오차 대비 압축률이 최대 8.63배 높아졌고, GPU용으로 다시 짠 분해로 압축 처리량이 최대 4.2배 올랐음.
      refs: [pap496]
  korea:
    - head: 대용량 해석 결과의 압축 기준을 분석 과제의 관심량으로 정함.
      stage: prep
      area: 데이터·저장
      needs: 과제별 관심량 정의와 압축기별 시험
      needs_group: 조사와 대상 선정
      text: 저장 공간 때문에 손실 압축을 쓸 때 허용 오차를 감으로 정하면 분석 결과의 신뢰를 설명하기 어려움. 관심량의 오차를 예측하거나 관심 영역만 엄격히 두는 방식이 공개되어, 해석 코드의 출력 정책에 반영할 수 있음.
      refs: [pap529, pap496]
  extra:
    - head: 압축 오차의 전파 분석이 AI 분석 파이프라인에 연결됨.
      text: 동적으로 조합되는 질의에 대해 끝에서 끝까지의 신뢰 구간을 내는 사례가 제시됨. 일요일 워크숍의 취득 단계 데이터 축소 논의에서 남았던 신뢰 문제에 대한 답의 하나임.
      refs: [pap529, misc155]
