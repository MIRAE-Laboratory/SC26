id: sess151
type: Session
label: "Eighth Workshop on Interactive and Urgent High Performance Computing"
kind: Workshop
topic: 데이터·워크플로·네트워크
date: "2026-11-20"
time: "08:30-12:00 CST"
room: W192b
url: https://sc26.conference-program.com/session/?sess=sess151
chairs: [thierry-goubier, bill-arndt, robert-henschel, michael-ringenburg]
summary_ko: "작업이 도는 동안 사람이 지켜보고 조향하고 결과를 바로 보는 대화형 HPC와, 재난 분석처럼 시한이 있는 긴급 계산을 다루는 워크숍. 초청 강연은 스트리밍 데이터에서 제때의 결정까지 가는 기반을 다뤘고, 논문 한 편은 평시의 유휴 자원으로 학습 자료를 쌓아 지진 직후 30분 안에 지반 운동 분포를 내는 워크플로를 제시함. 짧은 발표 넷과 패널은 제목만 공개됨."
diagram:
  type: flow
  title: 평시의 유휴 자원이 긴급 시의 응답 시간을 줄임
  items:
    - {label: 평시, note: "유휴 계산 자원으로 고충실도 해석을 돌려 학습 자료를 쌓음"}
    - {label: 대리모델 학습, note: 3차원 비선형 해석 결과로 신경망을 학습}
    - {label: 사건 발생, note: 신경망 역해석으로 빠르게 추정}
    - {label: 물리 해석으로 보정, note: 필요한 곳만 동적으로 정밀화}
    - {label: 결정 지원, note: 지진 뒤 30분 안에 지반 운동의 시공간 분포 제공}
insights:
  decision:
    - head: 긴급 계산의 기준은 처리량이 아니라 결정 시한임.
      text: 지진 대응 워크플로는 사건 뒤 30분 안에 신뢰할 수 있는 지반 운동 분포를 내는 것을 목표로 삼음. 초청 강연도 분산된 데이터에서 중요한 결정을 제때 뒷받침하는 것을 긴급 과학의 정의로 둠.
      refs: [ws_ius101, misc176]
  trial:
    - head: 긴급 대응은 평시에 준비한 만큼만 빨라짐.
      text: 사건이 난 뒤 고충실도 해석을 처음부터 돌리면 늦음. 평시에 유휴 자원으로 해석을 돌려 대리모델을 학습해 두고, 긴급 시에는 신경망 역해석과 물리 해석을 결합해 기존 계산 비용을 97.9% 넘게 줄였음. 평시 운용에서도 해답당 에너지가 76% 줄고 처리량이 3.7배 늘었음.
      refs: [ws_ius101]
    - head: 긴급 과학 워크플로는 자원이 있어도 만들기 어려움.
      text: 데이터 원천과 계산 능력은 늘었지만 시한이 있는 데이터 기반 워크플로를 구성하는 일은 여전히 어렵다는 진단이 나옴. 국가 데이터 플랫폼으로 이를 지원하는 방안이 제시됨. 공개 초록에는 구체적 수치가 없음.
      refs: [misc176]
  korea:
    - head: 방사선 비상이나 재난 대응 계산을 평시 유휴 자원과 대리모델로 준비함.
      stage: prep
      area: 운영·사용자 지원
      needs: 긴급 시나리오 선정과 평시에 돌릴 해석 코드, 선점 가능한 큐
      needs_group: 조사와 대상 선정
      text: 확산 예측이나 구조 응답처럼 사건 직후에 결과가 필요한 계산은, 평시에 유휴 자원으로 사례를 쌓아 대리모델을 만들어 두는 구조로 응답 시간을 줄일 수 있음. 일본의 지진 사례는 대리모델의 추정을 물리 해석으로 보정해 신뢰도를 지켰음. 초록에는 대상 시스템과 검증 방법의 세부가 없어 전문 확인이 필요함.
      refs: [ws_ius101]
    - head: 대화형·긴급 작업의 보안 경계를 미리 정함.
      stage: ref
      area: 검증·신뢰
      text: 패널은 대화형·긴급 세션의 보안을 주제로 삼았고, 짧은 발표도 대화형 HPC와 사이버보안의 교차점을 다룸. 긴급 작업에 우선권과 넓은 접근을 주는 정책은 공격 경로가 될 수 있어 지켜볼 논의임. 공개된 것은 제목뿐임.
      refs: [miscp117, misc177]
  extra:
    - head: 유휴 자원의 활용이 서빙에 이어 긴급 대응에서도 나옴.
      text: 월요일에는 배치 시스템의 유휴 자원으로 LLM 추론을 서빙하는 발표가 있었고, 이 워크숍에서는 같은 자원으로 긴급 대응용 학습 자료를 쌓음. 둘 다 선점 가능한 작업이라는 조건을 공유함.
      refs: [ws_ius101, ws_aihpc107]
