id: sess213
type: Session
label: "LLM Systems: Inference, Agents, and HPC Operations"
kind: Paper
topic: AI·에이전트
date: "2026-11-18"
time: "13:30-15:00 CST"
room: W179ab
url: https://sc26.conference-program.com/session/?sess=sess213
chairs: [fernando-posada]
summary_ko: "LLM 시스템을 추론, 에이전트, HPC 운영의 세 면에서 다루는 논문 세션. 이기종 GPU에서 커널 단위로 추론을 나누는 시스템, LLM으로 작업 관리를 최적화하는 틀, 영차 미세조정의 체크포인트, 에이전트 워크플로를 위한 분산 프레임워크를 다룸."
diagram:
  type: layers
  title: LLM 시스템의 층마다 나온 자원 관리 단위
  items:
    - {label: 에이전트 워크플로, note: "가치가 큰 작업부터 배치. 처리량 최대 2.9배, 95분위 지연 54.2% 감소"}
    - {label: HPC 작업 관리, note: 자원 수요 예측과 스케줄 매개변수 조정과 이상 진단에 LLM 적용}
    - {label: 추론 커널, note: "커널 단위로 이기종 GPU에 배치. 처리량 최대 2.3배"}
    - {label: 학습의 복구, note: "CPU 그림자 프로세스가 기록을 재생. 체크포인트 부담 최대 219.7배 감소"}
insights:
  decision:
    - head: 자원을 맞추는 단위가 모델에서 커널과 작업으로 내려감.
      text: 한 응용 안의 커널마다 자원 수요가 달라, 커널을 하드웨어에 맞추는 단위로 삼자 이기종 GPU 한 쌍이 고급 GPU 두 장의 처리량을 더 낮은 비용으로 넘었음. 에이전트 쪽에서도 요청이 아니라 작업 단위로 배치함.
      refs: [pap264, pap285]
  trial:
    - head: LLM을 작업 관리에 쓰려면 환각을 누르는 장치가 함께 들어감.
      text: 자원 수요 예측, 채우기 스케줄링의 매개변수 조정, 실행 중 이상 진단의 세 지점에 도메인 미세조정, 검색 증강, 에이전트 워크플로를 결합했고, 안전한 배치를 위해 환각 완화 장치를 더함. 공개 초록에는 수치가 없음.
      refs: [pap753]
    - head: 기록만으로 복구하면 학습이 길어질수록 재생 비용이 커짐.
      text: 영차 최적화는 진행을 작은 기록으로 남길 수 있지만, 기록만 재생하는 복구는 비용이 계속 늘고 지름길 재생은 부동소수점 경로를 정확히 재현하지 못함. CPU의 그림자 프로세스가 기록을 계속 재생해 복구 이미지를 만들자 체크포인트 부담이 최대 219.7배 줄고 낭비 시간이 최대 21.3배 줄었음.
      refs: [pap681]
  korea:
    - head: 스케줄러에 LLM을 붙이기 전에 과거 작업 기록으로 예측부터 시험함.
      stage: prep
      area: 운영·사용자 지원
      needs: 과거 작업 기록의 정리와 평가 기준
      needs_group: 기록과 이력 체계
      text: 자원 수요 예측과 이상 진단은 과거 기록으로 사후 평가가 가능해 위험이 낮음. 스케줄 매개변수를 실시간으로 바꾸는 적용은 그다음 단계로 두는 편이 안전함. 중국 연구진의 결과는 초록에 수치가 없어 전문 확인이 필요함.
      refs: [pap753]
    - head: 이기종 GPU를 섞어 쓰는 추론 구성을 비용 기준으로 평가함.
      stage: ref
      area: 도입 평가·하드웨어
      text: 구형과 신형 GPU가 섞인 환경에서 커널 단위 분할로 비용 효율이 최대 1.6배 올랐다는 결과임. 장비를 한꺼번에 바꾸기 어려운 기관이 지켜볼 방향임.
      refs: [pap264]
  extra:
    - head: 에이전트가 다중 사용자 서비스가 되면서 스케줄링 문제가 됨.
      text: 사용자 요청 하나가 여러 종류의 작업이 섞인 긴 워크플로가 되어, 작업의 가치와 임계성으로 우선순위를 매기는 분산 프레임워크가 나옴.
      refs: [pap285]
