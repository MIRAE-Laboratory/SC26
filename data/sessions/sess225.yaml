id: sess225
type: Session
label: "Precision Engineering for Matrix Computation"
kind: Paper
topic: 성능·도구
date: "2026-11-18"
time: "13:30-15:00 CST"
room: W175abc
url: https://sc26.conference-program.com/session/?sess=sess225
chairs: [sameh-abdulah]
summary_ko: "행렬 계산의 정밀도를 다루는 논문 세션. 저정밀 연산기로 배정밀도 행렬곱을 구성하는 두 연구, 구조적 희소 행렬곱의 해석 모델 기반 튜닝, 혼합 정밀도와 압축 통신을 쓴 엑사스케일 전자구조 계산을 다룸."
diagram:
  type: flow
  title: 저정밀 연산기에서 배정밀도 결과를 얻는 경로
  items:
    - {label: 연산기 선택, note: 정수 연산기의 성능이 줄어드는 신형 GPU에서 8비트 부동소수점 연산기로 옮김}
    - {label: 커널 융합, note: "중간 결과의 메모리 왕복을 없앰. 정수 최고 성능의 81~83%"}
    - {label: 응용 알고리즘, note: 부정확한 곱을 허용하는 반복법으로 배정밀도의 견고함 유지}
    - {label: 통신, note: "주고받는 데이터를 4~6.4배 압축"}
insights:
  decision:
    - head: 배정밀도를 어디서 지킬지를 알고리즘 수준에서 정함.
      text: 전자구조 계산에서 잔차 기반 반복법을 쓰면 부정확한 행렬 연산을 허용하면서 배정밀도의 견고함을 유지할 수 있었음. 필터 단계가 최대 3.4배 빨라지고 통신 데이터가 4~6.4배 줄었음.
      refs: [pap1109]
  trial:
    - head: 에뮬레이션의 병목은 연산이 아니라 중간 결과의 메모리 왕복이었음.
      text: 기존 구현은 중간 결과를 전역 메모리에 반복해 써서 데이터 이동이 주된 병목이었음. 커널을 융합해 왕복을 없애자 정수 연산기 최고 성능의 81~83%에 이르렀고, 복소 행렬곱은 벤더 라이브러리의 최대 5.5배였음.
      refs: [pap887]
    - head: 신형 GPU에서는 정수 연산기도 줄어들어 방식을 다시 바꿔야 함.
      text: 최근 구조에서 8비트 정수 연산의 성능이 줄어, 정수에만 기대는 방식으로는 부족해짐. 8비트 부동소수점 연산기에서 도는 방식이 제안됨. 공개 초록에는 수치가 없음.
      refs: [pap276]
  korea:
    - head: 배정밀도 의존 코드의 대응책을 세 갈래로 나눠 검토함.
      stage: prep
      area: 도입 평가·하드웨어
      needs: 주요 코드의 배정밀도 구간 측정과 수렴 조건 분석
      needs_group: 계측과 측정 수단
      text: 행렬곱이 지배적인 코드는 에뮬레이션 라이브러리로, 반복법 기반 코드는 알고리즘을 바꾼 혼합 정밀도로, 나머지는 배정밀도 장비의 유지로 대응하는 구분이 가능해짐. 어느 갈래인지는 코드마다 재 봐야 함.
      refs: [pap887, pap1109, pap276]
  extra:
    - head: 월요일 워크숍의 저정밀 논의가 본 학회에서 라이브러리 수준 결과로 이어짐.
      text: 워크숍에서는 배정밀도 성능이 37에서 1.25 TFLOP/s로 줄었다는 보고와 개별 응용의 대응이 나왔고, 이 세션은 범용 행렬곱 커널과 엑사스케일 응용에서의 결과를 제시함.
      refs: [pap887, ws_haclph112]
