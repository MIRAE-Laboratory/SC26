id: sess120
type: Session
label: "AgenticAI4HPC'26: 1st Intl. Workshop on Agentic AI for HPC"
kind: Workshop
date: "2026-11-15"
time: "09:00-12:30 CST"
room: W183b
url: https://sc26.conference-program.com/session/?sess=sess120
chairs: [mohammad-alaul-haque-monil, pedro-valero-lara, daichi-mukunoki, bogdan-nicolae]
summary_ko: >
  스스로 계획하고 추론하고 적응하며 도구를 쓰는 에이전틱 AI를 HPC에 적용하는 첫 워크숍.
  코드 현대화, 프로그래밍 모델 간 변환, 성능 튜닝, 과학 소프트웨어 유지보수를 다루며,
  HPC 소프트웨어 개발을 빠르게 하는 방법·시스템·응용을 논의한다.
insights:
  decision:
    - head: 병합 여부는 사람이 아니라 검증 기준이 정한다.
      text: 변환된 코드는 기준 출력의 비트 단위 재현을 통과해야 들어간다. 사람은 소수의 승인 관문만 맡는다.
      refs: [ws_aaihpc114, ws_aaihpc139]
    - head: LLM이 맡을 범위를 좁게 긋는다.
      text: 알려진 문법은 컴파일러가, 연결 코드는 도구가, 보안 판정은 모델 바깥의 규칙이 처리하고, LLM은 그 밖의 부분만 쓴다.
      refs: [ws_aaihpc131, ws_aaihpc139, ws_aaihpc132]
    - head: 시설은 에이전트를 어떤 사용자로 볼지 정해야 한다.
      text: 금지도, 일반 사용자 취급도 유지할 수 없다는 진단이다. 에이전트를 별도의 주체로 두고 정책과 인터페이스를 따로 설계하자고 제안한다.
      refs: [ws_aaihpc124]
    - head: 답할지 거절할지는 따로 설계한다.
      text: 사실을 가장 많이 찾는 구성이 답할 수 없는 질문을 가장 적게 거절했다. 에이전트 수는 어느 쪽도 설명하지 못했다.
      refs: [ws_aaihpc146]
  trial:
    - head: 한 번에 되는 변환은 드물다.
      text: 단일 시도 성공은 28개 중 6개였고, 실행 결과를 보고 고치는 루프를 넣자 26개가 되었다. 구조화된 설계 기록은 효과가 없었다.
      refs: [ws_aaihpc109]
    - head: 성공의 조건은 대상에 대한 지식이다.
      text: 구조화된 빌드 정보를 주면 패키지 설치 성공이 약 43%에서 100%로, 화학 도구를 붙이면 합성 예측 정확도가 12%에서 40%로 올랐다.
      refs: [ws_aaihpc137, ws_aaihpc117, ws_aaihpc109]
    - head: 비트 단위 재현도 결함을 놓친다.
      text: 일부러 넣은 결함 14개 중 3개가 관문을 통과했다. 큰 코드에서는 프로시저 507개 중 33개만 변환되었다. 시험이 실행하지 않는 경로는 보증되지 않는다.
      refs: [ws_aaihpc139]
    - head: 고정된 방어는 적응하는 공격에 뚫린다.
      text: 규칙 기반 계층은 공격 32개 중 19개를 막았지만, 공격이 적응하자 평균 28~31개가 통과했다.
      refs: [ws_aaihpc132]
    - head: 잘 정의된 변환은 거의 다 된다.
      text: 작업 명세 1,000개 중 982개를 스케줄러 사이에서 변환했고, 실제 스케줄러로 모두 검증했다.
      refs: [ws_aaihpc104]
  korea:
    - head: 레거시 포트란 코드 현대화에 바로 쓸 수 있는 절차다.
      text: 오래된 해석 코드를 보유한 기관은 기준 출력 재현을 병합 조건으로 삼는 방식을 적용할 수 있다. 단, 원자력 안전해석처럼 검증 요건이 엄격한 코드는 시험 사례가 덮지 않는 경로를 따로 확인해야 한다.
      refs: [ws_aaihpc114, ws_aaihpc139]
    - head: 에이전트 사용량부터 잰다.
      text: 기관 클러스터에서 코딩 에이전트가 작업 제출과 파일시스템에 주는 부하를 계측해야 정책을 정할 수 있다. 한 시설에서는 사용자의 19.5%가 제출의 55.8%를 냈다.
      refs: [ws_aaihpc124]
    - head: 에이전트를 들이기 전에 기록과 경계를 갖춘다.
      text: 에이전트가 바꾼 코드와 내린 판단을 질의할 수 있게 남기고, 작업 제출을 보안 경계로 다루는 통제를 먼저 둔다.
      refs: [ws_aaihpc144, ws_aaihpc132]
    - head: 운영 지원 에이전트는 모른다고 답할 수 있어야 한다.
      text: 시스템 운영 데이터를 질의하는 에이전트를 만들 때, 계측되지 않은 항목에 대한 질문을 거절하는지를 평가 항목에 넣는다.
      refs: [ws_aaihpc146, ws_aaihpc134]
  extra:
    - head: 발표마다 벤치마크를 새로 만든다.
      text: 변환, 보안, 운영 분석 모두 자체 벤치마크를 제시했다. 공통 평가 기준이 아직 없다는 뜻이고, 결과끼리 비교하기 어렵다.
      refs: [ws_aaihpc109, ws_aaihpc132, ws_aaihpc146]
    - head: 에이전트를 늘리는 것보다 구조가 중요하다.
      text: 실패 유형별로 수리 스킬을 나눠 보내자 토큰을 최대 52.4% 덜 쓰고도 정확률이 올랐다.
      refs: [ws_aaihpc107, ws_aaihpc146]
    - head: 에이전트는 기다리지 않게 만든다.
      text: 긴 배치 작업 동안 에이전트를 세워 두지 않고, 결과나 판단이 필요한 이벤트가 생길 때만 깨운다.
      refs: [ws_aaihpc126]
