id: sess227
type: Session
label: "Energy and Contention in Large-Scale AI Training"
kind: Paper
topic: 에너지·지속 가능성
date: "2026-11-19"
time: "10:30-12:00 CST"
room: W178ab
url: https://sc26.conference-program.com/session/?sess=sess227
chairs: [rong-ge]
summary_ko: "대규모 AI 학습의 에너지와 경합을 다루는 논문 세션. 학습 반복의 단계를 예측해 주파수를 미리 바꾸는 전력 관리, 대규모 학습의 모의, 통합 칩에서의 다중 모달 학습 에너지 분석, 다중 사용자 환경에서의 학습 확장성 특성화를 다룸."
diagram:
  type: layers
  title: 대규모 학습의 효율을 정하는 층
  items:
    - {label: 다중 사용자 환경, note: "GPU 2,400장까지 여섯 시스템에서 간섭을 모델링"}
    - {label: 병렬화와 통신, note: 계산과 통신이 한 장치에서 겹칠 때의 느려짐을 모의에 반영}
    - {label: 데이터 이동, note: 에너지 효율은 가속기 사용률보다 데이터 이동과 겹침에 달려 있음}
    - {label: 반복 안의 단계, note: "단계 전환 전에 주파수를 골라 에너지 15~16% 감소"}
insights:
  decision:
    - head: 전력 제어를 반응형에서 예측형으로 바꿈.
      text: 학습 반복마다 전력의 세밀한 단계 양상이 되풀이됨. 이를 가벼운 모델로 예측해 단계 전환 전에 주파수를 고르자 기본 하드웨어 정책 대비 에너지가 15~16%, 전력 변화율이 9~15% 줄었음.
      refs: [pap117]
  trial:
    - head: 가장 빠른 구성이 가장 에너지 효율적인 구성은 아니었음.
      text: 통합 칩에서의 다중 모달 학습을 응용, 런타임, 하드웨어 세 층에서 재자, 에너지 효율은 가속기 사용률이 아니라 데이터 이동과 계산·통신의 겹침에 주로 달려 있었음. 공개 초록에는 수치가 없음.
      refs: [pap448]
    - head: 대규모 학습의 거동은 실제로 돌려 보기 전에 모의로 추정함.
      text: 장치 한 대에서 실행 그래프를 수집해 GPU 1,000장 규모의 학습을 모의하는 방식이 나옴. 1,750억 파라미터 모델의 GPU 256장 학습에서 스텝 시간 오차가 평균 8%로 기존의 약 3분의 1이었고, 모의는 3분 안에 끝났음.
      refs: [pap347]
  korea:
    - head: GPU 학습 작업에 예측형 주파수 제어를 시험함.
      stage: prep
      area: 계측·에너지
      needs: GPU 전력의 고해상도 기록과 주파수 조정 권한
      needs_group: 계측과 측정 수단
      text: 학습 워크플로를 고치지 않고 온라인으로 쓸 수 있는 가벼운 방식이 공개됨. 워크숍의 작업별 클록 조정 결과와 함께, 기관 GPU 클러스터의 에너지 절감 수단으로 시험할 수 있음.
      refs: [pap117, ws_ss109]
    - head: 공유 GPU 자원의 학습 성능을 다중 사용자 조건에서 평가함.
      stage: ref
      area: 도입 평가·하드웨어
      text: 단독 실행의 확장성은 공유 환경의 성능을 말해 주지 않음. 유럽의 여러 시스템에서 병렬화 전략 다섯을 간섭 모델과 함께 평가한 벤치마크 모음이 나와, 도입 평가의 참고가 됨. 초록에는 결과 수치가 없음.
      refs: [pap1162]
  extra:
    - head: 데이터 이동이 에너지를 정한다는 결과가 워크숍과 본 학회에서 겹침.
      text: 워크숍에서는 GPU를 늘리면 시간은 줄어도 에너지가 늘어난 결과와 전력 상한 아래의 내부 배분 문제가 나왔고, 이 세션은 통합 칩에서 같은 방향의 결과를 냄.
      refs: [pap448, ws_eesp141]
