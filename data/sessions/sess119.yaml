id: sess119
type: Session
label: "RISE 2026: 1st International Workshop on Rising Innovators in Sustainable Exacomputing"
kind: Workshop
date: "2026-11-15"
time: "09:00-12:30 CST"
room: W178b
url: https://sc26.conference-program.com/session/?sess=sess119
chairs: [ayesha-afzal, umit-v-catalyurek, ana-lucia-varbanescu, carina-kemp]
summary_ko: "HPC와 AI의 인력 기반을 넓히려는 반나절짜리 심포지엄형 워크숍. 하드웨어, 소프트웨어, 알고리즘, 응용, 에너지 효율과 지속 가능성을 주제로 삼되, 지도력과 경력 개발을 함께 다룸. 기조 강연, 경력 패널, 멘토링, 여성이 이끄는 프로젝트의 짧은 발표로 구성됨. 기술 논문 발표는 없음."
diagram:
  type: flow
  title: 워크숍의 구성
  items:
    - {label: 기조 강연, note: 엑사스케일 사업을 이끈 경험에서 본 국가 규모 협력의 조건}
    - {label: 경력 패널, note: "학계, 연구소, 산업계 사이의 이동"}
    - {label: 멘토링, note: 선배 연구자와의 짧은 만남}
    - {label: 짧은 발표, note: 여성이 이끄는 프로젝트 셋과 신진 연구자 다섯}
insights:
  decision:
    - head: 국가 규모 협력은 여러 기관의 팀을 한 방향으로 맞추는 일에 달려 있음.
      text: 미국 엑사스케일 사업을 2018년부터 2024년까지 이끈 연사가 10년에 걸친 사업의 추진력을 유지한 방법과 멘토링의 역할을 되짚음. 공개 초록에는 구체적 사례가 없음.
      refs: [misc184]
  korea:
    - head: 대형 사업의 책임자 경험담은 국가 과제 기획에 참고가 됨.
      text: 여러 연구소와 부처 사업에 걸친 조정 경험이 주제임. 녹취록이 있으면 구체적 교훈을 뽑을 수 있음.
      refs: [misc184]
  extra:
    - head: 이 워크숍은 기술 발표가 아니라 인력 양성이 목적임.
      text: 다른 세션과 달리 수치나 기법이 없어, 온톨로지의 문제·기법 분석에는 거의 기여하지 않음.
      refs: [miscp118, misc208]
