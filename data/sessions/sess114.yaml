id: sess114
type: Session
label: "AI4S: 8th Workshop on AI and ML for Scientific Applications"
kind: Workshop
date: "2026-11-15"
time: "09:00-17:30 CST"
room: W183a
url: https://sc26.conference-program.com/session/?sess=sess114
chairs: [gokcen-kestor, dong-li, murali-emani, wenqian-dong]
summary_ko: >
  학계·정부·산업의 컴퓨터 과학자와 도메인 과학자가 과학 응용에 AI를 적용한 최근 연구를 공유하는 워크숍.
  새로운 과학 문제를 소개하고 AI 기반 과학을 위한 도구와 인프라를 촉진하는 것이 목표이며,
  심사를 거친 발표, 초청 강연, 패널로 구성된다.
insights:
  decision:
    - head: 대리모델 도입은 시뮬레이터 안에서 잰 처리량으로 정한다.
      text: 모델의 정확도나 단독 추론 속도가 아니라, 실제 코드에 넣고 잰 속도가 기준이다. 같은 모델이 배치 구성에 따라 2.4배 느리기도, 34배 빠르기도 했다.
      refs: [ws_ai4s111, ws_ai4s134]
    - head: AI가 쓴 코드의 합격 기준은 통과와 실패가 아니다.
      text: 정확성, 성능, 코드 품질, 알고리즘 적절성, 라이브러리 관례의 다섯 범주로 나눠 본다. 컴파일되고 실행되는 코드에서도 관례 위반이 나왔다.
      refs: [ws_ai4s109]
    - head: 분석 절차의 결정권은 도메인 전문가에게 둔다.
      text: 절차를 프롬프트가 아니라 버전 관리되는 스킬 파일에 두어, 전문가가 직접 읽고 고친다.
      refs: [ws_ai4s131]
    - head: 안전 제약이 있는 문제는 위반량이 기준이다.
      text: 전력망 대리모델의 가치는 예측 오차가 아니라 물리적으로 실행 가능한 결과를 내는지로 판단한다.
      refs: [ws_ai4s139]
  trial:
    - head: 출력에 정보가 남지 않으면 역설계는 안 된다.
      text: 사후분포 분해 방식을 세 가지로 바꿔도 개선이 거의 없었다. 최종 출력이 상류 변수의 정보를 보존하지 못한다는 것이 원인으로 지목된다.
      refs: [ws_ai4s106]
    - head: 대리모델의 가속은 격자 조대화에서 나왔다.
      text: 균일 격자에서는 기준 솔버와 비슷했고, 노드를 22.6배 줄인 뒤에야 8.9배 빨라졌다.
      refs: [ws_ai4s134]
    - head: 사전학습 표현의 전이는 선택적이다.
      text: 토카막 진단 데이터에서 동결 표현은 일부 과제에서만 경쟁력이 있었고, 최고 정확도는 여전히 과제별 모델이 냈다.
      refs: [ws_ai4s127]
    - head: 롤아웃은 실측 피드백이 있어야 안정된다.
      text: 압력 센서 12개의 측정값으로 전체 구간의 14.56%만 보정해도 오차가 48%에서 6%대로 줄었다. 조건은 센서가 있다는 것이다.
      refs: [ws_ai4s140]
    - head: 에이전트 워크플로는 기존 스토리지 계층을 느리게 한다.
      text: 다음 작업을 에이전트가 정하면 필요한 데이터를 미리 올려 둘 수 없어 실행 시간이 3.18배 늘었다.
      refs: [ws_ai4s128]
  korea:
    - head: 대형 실험시설의 분석 파이프라인에 그대로 옮길 수 있다.
      text: 방사광 가속기, 연구용 원자로, 핵융합 장치처럼 빔라인과 진단 장비를 운영하는 시설은 도구 노출(MCP), 스킬 파일, 실행 기록의 세 요소 구조를 참고할 만하다.
      refs: [ws_ai4s131, ws_ai4s127]
    - head: 자체 해석 코드에 대리모델을 넣기 전에 인시투 측정부터 한다.
      text: 논문의 가속 수치가 아니라 자기 코드, 자기 클러스터에서 잰 수치로 판단해야 한다. 측정 도구를 먼저 갖추는 것이 순서다.
      refs: [ws_ai4s111]
    - head: 규제 대상 분야에서는 물리 제약을 학습 목표에 넣는다.
      text: 전력 계통이나 원자력처럼 제약 위반이 곧 사용 불가인 분야는 학습 시간이 2.4배 들더라도 위반을 약 19배 줄이는 쪽이 맞다.
      refs: [ws_ai4s139]
    - head: 자체 코드용 평가 벤치마크를 만든다.
      text: 기관이 보유한 주요 라이브러리와 코드에 대해, AI가 생성한 코드를 전문가 기준으로 채점하는 평가 세트를 갖추면 모델 교체 때마다 다시 쓸 수 있다.
      refs: [ws_ai4s109, ws_ai4s101]
  extra:
    - head: 한계를 그대로 보고하는 발표가 많다.
      text: 부정적 결과, 조건부 가속, 과제별 모델의 우위를 제목과 결론에 내세운다. 가속 수치 하나로 평가하던 흐름에서 벗어나고 있다.
      refs: [ws_ai4s106, ws_ai4s134, ws_ai4s127]
    - head: 입력이 GPU 한 장을 넘는 것이 일상이 되었다.
      text: 모델을 고치지 않고 입력 영역을 여러 GPU로 나누는 추상화가 나왔고, 생성 모델 학습은 GPU 256개까지 확장된다.
      refs: [ws_ai4s121, ws_ai4s130]
