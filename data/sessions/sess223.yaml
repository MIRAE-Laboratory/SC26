id: sess223
type: Session
label: "Fault Injection and Resilience Across Emerging Platforms"
kind: Paper
topic: 검증·신뢰
date: "2026-11-19"
time: "08:30-10:00 CST"
room: W176abc
url: https://sc26.conference-program.com/session/?sess=sess223
chairs: [david-martin]
summary_ko: "새 플랫폼에서의 결함 주입과 내성을 다루는 논문 세션. 초전도 큐비트의 방사선 유발 결함 억제, AI 가속용 배열의 방사선 오류를 실리콘에서 모델 예측까지 추적한 실험, 세 벤더 GPU에 같은 결함을 넣는 틀, 여러 클라우드에 걸친 GPU 장애의 운영 분석을 다룸."
diagram:
  type: layers
  title: 결함을 보는 층과 이 세션의 결과
  items:
    - {label: 운영, note: "노드 5,065대의 장애 19,564건. 자동 분류와 반복 고장 노드 관리"}
    - {label: 응용 결과, note: "가려짐, 조용한 손상, 실패, 멈춤으로 분류. 같은 결함도 벤더마다 다름"}
    - {label: 중간 표현, note: 벤더별 변환 전에 결함을 넣어 비교 가능하게 함}
    - {label: 실리콘, note: 중성자와 양성자 빔으로 가속 방사선 시험}
insights:
  decision:
    - head: GPU 신뢰성을 벤더 하나의 결과로 일반화하지 않음.
      text: 같은 비트 수준 결함을 세 벤더의 GPU에 넣자 거동이 달랐음. 한 벤더는 대개 결함을 가리지만 새어 나오면 멈춤이 많았고, 다른 벤더는 드러나는 실패가 많았으며, 또 다른 벤더는 벤치마크와 결함 위치에 따라 조용한 손상과 실패 사이를 오갔음.
      refs: [pap521]
  trial:
    - head: 한 층만 보는 결함 연구는 하드웨어 사건이 시스템 실패로 이어지는 길을 놓침.
      text: AI 가속용 배열 장치에 중성자와 양성자 빔을 쬐고, 하드웨어 모의와 소프트웨어 결함 주입을 결합해 잘못된 예측에 이르는 오류 양상과 전파 기전을 추적함. 공개 초록에는 수치가 없음.
      refs: [pap495]
    - head: 대규모 GPU 운영의 가용성은 자동 분류와 반복 고장 관리에서 나옴.
      text: 세 사업자의 운영 클러스터에서 5~7개월간 노드 5,065대의 장애 19,564건을 분석함. 확장 자동화, 사업자별 조치가 붙은 장애 분류, 반복 고장 노드 관리의 세 축으로 가용성 98% 이상을 유지했음.
      refs: [pap652]
  korea:
    - head: GPU 장애 대응을 수리 시간, 자동 분류 성공률, 재발률로 관리함.
      stage: prep
      area: 운영·사용자 지원
      needs: 장애 기록 양식과 노드별 이력의 축적
      needs_group: 기록과 이력 체계
      text: 대규모 GPU 운영 사례가 세 지표와 개선 절차를 공개함. GPU 클러스터를 늘리는 기관은 장애 기록을 노드 단위로 쌓고 반복 고장 노드를 따로 다루는 절차부터 갖출 수 있음.
      refs: [pap652]
    - head: 방사선 환경의 AI 가속기 신뢰성 연구에 참고할 실험 방법이 나옴.
      stage: ref
      area: 검증·신뢰
      text: 중성자와 양성자 빔으로 AI 가속 장치를 시험하고 오류를 실리콘에서 응용까지 추적한 연구임. 방사선 환경에서의 AI 장치 활용을 검토할 때 실험 설계의 참고가 됨. 초록에는 수치가 없어 전문 확인이 필요함.
      refs: [pap495, pap468]
  extra:
    - head: 양자 장치의 방사선 결함도 같은 세션에서 다뤄짐.
      text: 방사선이 한 기판의 여러 큐비트에 상관된 결함을 일으켜 오류 정정 부호를 무력화할 수 있어, 기판 수준의 차단 구조와 부호의 교차 배치를 결합한 방법이 제안됨.
      refs: [pap468]
