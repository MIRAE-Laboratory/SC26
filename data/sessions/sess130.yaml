id: sess130
type: Session
label: "2nd Annual Workshop on Large-Scale Quantum-Classical Computing (LSQCC)"
kind: Workshop
date: "2026-11-16"
time: "09:00-17:30 CST"
room: W179a
url: https://sc26.conference-program.com/session/?sess=sess130
chairs: [antonio-corcoles, hiroshi-horii, mitsuhisa-sato, amir-shehata]
summary_ko: "양자 컴퓨팅을 HPC, AI와 결합해 실용적인 혼합 워크플로를 만드는 일을 다루는 워크숍. 일부 분야는 양자 기법이 정확한 고전 기법으로 어려운 문제를 다루고 근사 기법과 경쟁하는 단계로 가고 있다고 봄. 양자 알고리즘, 시스템 통합, 혼합 워크플로를 물리, 화학, 재료, 최적화 분야 중심으로 다룸. 개별 논문 발표가 아니라 주제별 발표 묶음으로 구성됨."
diagram:
  type: flow
  title: 하루의 주제 흐름
  items:
    - {label: 전체 강연, note: 양자 하드웨어 기업과 미국 에너지부 연사. 설명문 없음}
    - {label: 알고리즘과 응용, note: "화학, 생의학, 재료. 전처리부터 오류 완화와 검증까지 HPC의 역할"}
    - {label: 양자-HPC 생태계, note: "벤더의 플랫폼과 런타임. 운영에서 이미 되는 것과 남은 공백"}
    - {label: 대규모 응용 소프트웨어, note: 공개 생태계와 인터페이스, 워크플로 도구}
    - {label: 국립연구소의 전략, note: "미국, 일본, 스페인, 독일, 싱가포르 기관의 계획과 교훈"}
insights:
  decision:
    - head: 고전 인프라가 양자 알고리즘의 설계를 좌우한다는 관점임.
      text: 전처리와 후처리, 오류 완화, 대규모 검증에서 HPC가 맡는 역할이 알고리즘 설계에 영향을 준다고 봄. 임상 연구, 국가 HPC 센터, 양자 하드웨어 벤더가 각자의 관점을 냄.
      refs: [misc211]
  trial:
    - head: 발표들이 "이미 운영에서 되는 것"과 "남은 공백"을 구분해 말함.
      text: 벤더 발표는 작업 스케줄링, 자원 관리, GPU 가속 고전 계산, 혼합 프로그래밍 모델을 다루며 표준과 인터페이스의 공백을 짚음. 공개 초록에는 구체적 항목이 없음.
      refs: [misc212, misc213]
  korea:
    - head: 다섯 나라 기관의 양자-HPC 통합 전략을 한자리에서 비교할 수 있음.
      text: 양자를 HPC 옆에 구축하거나 운영 중인 기관들이 계획, 교훈, 우선순위를 차례로 발표하고 지역 간 협력을 논의함. 녹취록이 있으면 국내 전략 수립의 비교 자료가 됨.
      refs: [misc214]
  extra:
    - head: 공개된 설명이 주제 묶음 수준이어서 수치가 없음.
      text: 전체 강연 둘은 설명문이 없고 나머지도 묶음 소개뿐임. 이 세션의 고찰은 현장 자료로 보완해야 함.
      refs: [misc204, misc205]
