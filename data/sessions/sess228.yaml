id: sess228
type: Session
label: "Detecting and Containing Silent Errors"
kind: Paper
topic: 검증·신뢰
date: "2026-11-19"
time: "10:30-12:00 CST"
room: W175abc
url: https://sc26.conference-program.com/session/?sess=sess228
chairs: [scott-levy]
summary_ko: "GPU, 메모리, 대형 모델 워크로드의 조용한 오류를 다루는 논문 세션. LLM 학습에서 영구 GPU 결함이 일으키는 손상의 특성화, 두 층의 오류 정정 부호를 협력시키는 메모리 보호, 오류 전파의 시간적 모델링, LLM 추론의 저부담 오류 검출을 다룸."
diagram:
  type: flow
  title: 조용한 오류를 다루는 네 단계
  items:
    - {label: 특성화, note: "학습 7,664회에 결함 주입. 임계 경로의 결함은 보통 수준의 빈도에서도 학습을 발산시킴"}
    - {label: 예측, note: "실행 추적에서 전파 모델을 만들어 손상 확률을 오차 2.2%포인트로 추정"}
    - {label: 검출, note: "핵심 층의 활성값을 감시해 95.3% 검출, 부담 0.56%"}
    - {label: 정정, note: "메모리의 두 층 부호를 협력시켜 조용한 손상률 최대 430배 감소"}
insights:
  decision:
    - head: 오류 검출을 전체 감시에서 핵심 지점 감시로 좁힘.
      text: LLM 추론에서 결함이 났을 때 가장 정보가 많은 소수의 층만 골라 활성값 징후를 감시하고 학습된 모델이 손상 여부를 판정함. LLM 15개와 데이터셋 셋에서 평균 검출 범위 95.3%, 실행 부담 0.56%였고 기존 기법보다 부담이 6.1배 적었음.
      refs: [pap435]
  trial:
    - head: LLM 학습은 드문 결함은 견디지만 결함의 위치와 수치 형식에 따라 무너짐.
      text: 회로 수준 GPU 결함 모의와 학습 프레임워크의 결함 주입을 결합해 학습 7,664회를 돌렸음. 임계 데이터 경로의 결함과 특정 정밀도 형식에서는 보통 수준의 결함 빈도에서도 학습이 파국적으로 발산했음.
      refs: [pap134]
    - head: 결함 주입은 최종 결과만 보여 주고 전파 경로는 보여 주지 않음.
      text: 실행 추적에서 동적 베이즈 망을 만들어 손상된 값이 데이터 흐름, 제어 흐름, 메모리 의존을 따라 퍼지는 과정을 모델링하자, 반복 주입 없이 손상 확률을 평균 절대 오차 2.2%포인트로 추정했음.
      refs: [pap433]
  korea:
    - head: 장기 실행 AI 작업에 저부담 오류 검출을 넣는 방안을 검토함.
      stage: prep
      area: 검증·신뢰
      needs: 대상 모델의 핵심 층 분석과 결함 주입 시험 환경
      needs_group: 도구와 소프트웨어 도입
      text: 며칠씩 도는 학습과 대량 추론에서 조용한 오류는 결과를 믿을 수 없게 만듦. 부담 1% 미만의 검출 기법이 추론에서 나왔으므로, 기관 모델의 서빙에 적용 가능한지 시험할 수 있음. 학습 쪽은 특성화 단계이고 검출 기법은 아직 제시되지 않았음.
      refs: [pap435, pap134]
    - head: 저정밀 형식을 쓸 때 결함 내성을 함께 확인함.
      stage: ref
      area: 검증·신뢰
      text: 수치 형식에 따라 결함의 영향이 크게 달랐다는 결과임. 메모리와 에너지를 아끼려 정밀도를 낮출 때 신뢰성 쪽의 대가가 있을 수 있음을 보여 줌. 월요일 워크숍에서는 정밀도를 낮춘 모델이 비트 반전에 오히려 잘 견뎠다는 결과도 있어 조건을 가려 봐야 함.
      refs: [pap134, ws_ftxs106]
  extra:
    - head: 워크숍에서 빈칸이던 학습 중 조용한 손상에 하드웨어 근거의 특성화가 나옴.
      text: 워크숍 발표들은 정상으로 보이는 학습 실패를 문제로 제기하는 데 그쳤고, 이 세션은 사전학습의 손상 내성을 하드웨어 결함 모델로 처음 특성화했다고 밝힘.
      refs: [pap134, misc105]
