id: sess146
type: Session
label: "Sixth International Symposium on Quantitative Co-Design of Supercomputers"
kind: Workshop
date: "2026-11-16"
time: "14:00-17:30 CST"
room: W176b
url: https://sc26.conference-program.com/session/?sess=sess146
chairs: [terry-jones, estela-suarez, james-a-ang, jim-brandt, michael-jantz]
summary_ko: "공동 설계와 데이터 기반 분석을 결합해 슈퍼컴퓨팅의 잠재력을 끌어내려는 심포지엄. 올해는 앞으로 나올 기계와 떠오르는 기술에 초점을 둠. HPC가 최대 연산 속도를 넘어 해답까지의 시간, 에너지 효율, AI와 시뮬레이션의 융합으로 옮겨 가고 있다고 봄. 엑사스케일 이후의 기계, 과학 워크플로의 생성형 AI, 양자-고전 혼합 구조를 다룸. 초청 발표와 패널로만 구성되며 공개된 초록이 없음."
diagram:
  type: shift
  title: 세션 소개문이 말하는 평가 기준의 이동
  from_label: 이전
  to_label: 지금
  items:
    - {from: 최대 연산 속도, to: 해답까지의 시간}
    - {from: 성능 단독, to: 에너지 효율을 함께 봄}
    - {from: 시뮬레이션 중심 설계, to: AI와 시뮬레이션의 융합을 전제로 한 설계}
    - {from: 고전 구조, to: 양자-고전 혼합 구조까지 고려}
insights:
  extra:
    - head: 발표 넷과 패널 모두 공개 설명문이 없음.
      text: 일본 이화학연구소 센터장의 주 강연, 미국 국립연구소의 첨단 기술 시스템 공동 설계, 통신 장치와 전송 계층의 공동 설계, 독일 센터의 새 프로세서 구조 공동 설계가 제목으로만 확인됨. 내용은 현장 자료가 있어야 채울 수 있음.
      refs: [misc229, misc230, misc231, misc232]
    - head: 세션 소개문의 방향은 다른 세션의 결과와 맞음.
      text: 성능 워크숍에서 워크로드별 하드웨어 선택이, 에너지 워크숍에서 성능과 에너지의 병기가 반복해 나왔음.
      refs: [miscp126, ws_pmbss103]
