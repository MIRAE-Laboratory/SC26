id: sess126
type: Session
label: "S-HPC 2026: 5th Intl. Workshop on Cyber Security in HPC"
kind: Workshop
date: "2026-11-15"
time: "14:00-17:30 CST"
room: W183b
url: https://sc26.conference-program.com/session/?sess=sess126
website: https://hpc.pnl.gov/S-HPC
chairs: [andres-marquez, yang-guo, kevin-barker, nael-abu-ghazaleh, joseph-manzano]
summary_ko: >
  사이버보안과 HPC 연구자·실무자를 연결하는 워크숍. HPC 보안은 그동안 인증된 사용자로 접근을 제한하는
  운영 문제로 다뤄져 보안 연구 커뮤니티와 분리되어 있었으나, 플랫폼과 사용자층이 다양해지면서
  두 분야의 연결이 중요해졌다는 문제의식에서 출발한다.
insights:
  decision:
    - head: 책임은 공격 경로 단위로 나눈다.
      text: 공유 슈퍼컴퓨터에서 민감데이터를 다루면 보안 책임이 용량 소유자, 인프라 제공자, 연구환경 운영자로 갈린다. 공격 경로마다 완화책과 책임 주체를 짝지어야 빈틈이 드러난다.
      refs: [ws_shpc101]
    - head: 에이전트의 허용 범위는 런타임이 정한다.
      text: 에이전트가 무엇을 해도 되는지는 모델의 판단이 아니라 격리와 정책 강제로 결정하고, 제로 트러스트를 에이전트 행동에 적용한다.
      refs: [misc163]
    - head: 프라이버시는 감사 가능한 주장으로 판단한다.
      text: 어떤 기술을 썼는지가 아니라 무엇을 보증하는지를 공통 양식으로 진술하고 비교한다. 지킬 대상도 개인 레코드가 아니라 기관의 참여 사실과 연구 전략이다.
      refs: [ws_shpc102]
  trial:
    - head: 샘플링 주기를 늘리는 것만으로는 부족하다.
      text: 전력 텔레메트리를 60초 간격까지 성기게 해도 워크로드 식별도는 0.74에서 0.54로 줄 뿐이고, 서로 뚜렷이 다른 워크로드는 계속 식별된다.
      refs: [ws_shpc106]
    - head: 과학 코드는 신뢰할 수 있는 입력을 전제로 쓰여 있다.
      text: 응용 네 개를 퍼징하자 고유 크래시 약 1,000건, 임의 코드 실행 가능 취약점 110개 이상이 나왔다. 외부 데이터를 받는 순간 계산 결과의 무결성이 흔들린다.
      refs: [ws_shpc104]
    - head: 탐지는 시간이 어긋난 데이터에서 무너진다.
      text: 구성요소마다 샘플링 시점이 다르면 기존 거리 척도는 우연 수준으로 떨어진다. 시간 간격을 반영한 거리여야 공격과 정상이 분리된다.
      refs: [ws_shpc105]
    - head: 암호화 연산은 아직 작은 규모에서만 된다.
      text: 동형암호 그래프 연산은 1,024 랭크를 쓰고도 정점 16개 규모에서 5.66배 가속에 그친다.
      refs: [ws_shpc107]
  korea:
    - head: 공동 활용 GPU 자원에는 책임 분담표가 먼저다.
      text: 여러 기관이 함께 쓰는 계산 자원에 의료, 원자력, 산업 데이터를 올리려면 자원 운영 기관, 플랫폼 운영자, 연구 책임자 사이에 공격 경로별 책임을 문서로 정해 두어야 한다.
      refs: [ws_shpc101]
    - head: 공개하는 운영 정보의 해상도를 점검한다.
      text: 작업 큐 현황, 사용량 통계, 전력 모니터링처럼 무심코 공개하는 정보가 어느 기관이 무엇을 계산하는지 드러낼 수 있다.
      refs: [ws_shpc102, ws_shpc106]
    - head: 입력 파일을 받는 해석 코드를 퍼징한다.
      text: 외부 기관이나 사용자가 만든 입력을 읽는 자체 개발 코드는 퍼징과 메모리 안전성 점검을 도입 절차에 넣을 만하다. 비용은 낮고 발견은 많았다.
      refs: [ws_shpc104]
    - head: 에이전트 도입 전에 실행 경계를 정한다.
      text: 연구용 클러스터에서 AI 에이전트를 허용하기 전에 네트워크 접근, 실행 가능한 명령, 감독 방식을 정책으로 정해 두어야 한다.
      refs: [misc163]
  extra:
    - head: 관측과 프라이버시가 같은 데이터를 두고 충돌한다.
      text: 공격 탐지에는 촘촘한 텔레메트리가 필요하고, 프라이버시에는 성긴 텔레메트리가 필요하다. 누구에게 어떤 해상도로 줄지를 나눠 정해야 한다.
      refs: [ws_shpc105, ws_shpc106]
    - head: AI가 공격 비용을 낮춘다.
      text: 코딩 에이전트가 재현 가능한 익스플로잇 59개를 만들었다. 취약점을 찾는 일에서 악용하는 일까지의 거리가 짧아졌다.
      refs: [ws_shpc104]
