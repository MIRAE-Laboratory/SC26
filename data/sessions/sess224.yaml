id: sess224
type: Session
label: "Adapting Scientific Computing to AI-Oriented Accelerators"
kind: Paper
topic: 성능·도구
date: "2026-11-19"
time: "08:30-10:00 CST"
room: W178ab
url: https://sc26.conference-program.com/session/?sess=sess224
chairs: [valerie-taylor]
summary_ko: "AI 위주로 설계된 가속기에 과학 계산을 맞추는 논문 세션. 물리 모의에 필요한 정밀도를 다시 따지는 기준, 손실 압축 커널을 여러 가속기로 옮기는 LLM 에이전트의 평가, 텐서 연산기에 맞춰 다시 짠 분자 도킹, AI 전용 처리 장치에서의 과학 계산 사례를 다룸."
diagram:
  type: shift
  title: AI 위주 가속기에 과학 계산을 맞추는 방식
  from_label: 기존 전제
  to_label: 이 세션
  items:
    - {from: 배정밀도가 표준, to: 이산화 오차가 하위 비트를 가리므로 필요한 만큼만}
    - {from: 불규칙한 쌍 계산, to: 구조화된 행렬 연산으로 다시 써서 텐서 연산기에 태움}
    - {from: 사람이 가속기마다 이식, to: 에이전트가 생성하고 측정하고 검증}
    - {from: 범용 GPU, to: AI 전용 처리 장치에서 혼합 정밀도와 계층 메모리로 대응}
insights:
  decision:
    - head: 필요한 정밀도를 물리 오차와의 비교로 정함.
      text: 편미분방정식 모의에서는 공간과 시간의 이산화 오차가 잡음 바닥을 이루어 배정밀도의 하위 비트를 가림. 격자를 세밀하게 할 때의 신호 대 잡음비로 정밀도를 낮춰도 되는지 판정하는 기준이 제시됐고, 기상·기후 응용에서 GPU 속도가 최대 1.8배 올랐음.
      refs: [pap297]
  trial:
    - head: 코딩 에이전트는 가속기에 따라 일관되게 실패하는 곳이 있음.
      text: 손실 압축 커널을 세 가속기로 옮기는 평가에서 GPU에서는 성능 편차가 컸고 처리 요소 중심의 웨이퍼 규모 시스템에서는 일관되게 실패했음. 추론을 더 반복하면 결과가 나빠지는 경우가 많았고, 정확성과 처리량의 절충이 계속됨.
      refs: [pap282]
    - head: 알고리즘을 연산기에 맞게 다시 써야 가속기의 이점이 나옴.
      text: 분자 도킹의 지배적인 에너지 계산을 구조화된 행렬 연산으로 바꿔 텐서 연산기에 태우자 GPU 한 장에서 9.7~18.9배 빨라졌고, GPU 512장에서는 시간 단위의 도킹이 초 단위가 됨.
      refs: [pap341]
  korea:
    - head: 해석 코드의 정밀도 요구를 이산화 오차와 비교해 재평가함.
      stage: prep
      area: 도입 평가·하드웨어
      needs: 격자 세분화 실험과 구간별 정밀도 변경 도구
      needs_group: 계측과 측정 수단
      text: 배정밀도가 꼭 필요한 구간과 그렇지 않은 구간을 가르는 기준이 공개됨. 열수력이나 유동 해석처럼 이산화 오차가 큰 코드는 일부 구간의 정밀도를 낮출 여지가 있고, 이는 저정밀 위주 가속기 도입 때의 판단 근거가 됨.
      refs: [pap297]
    - head: 에이전트로 코드를 이식할 때는 생성과 측정과 검증을 한 흐름에 둠.
      stage: ref
      area: 검증·신뢰
      text: 생성만 하는 에이전트는 정확성과 성능을 함께 맞추지 못했고, 측정과 검증을 결합한 다중 에이전트가 나았음. 워크숍에서 나온 결론과 같은 방향임.
      refs: [pap282]
  extra:
    - head: AI 전용 처리 장치에서의 과학 계산 사례가 중국에서 나옴.
      text: 텐서 중심 처리 장치에서 정밀도, 실행, 메모리 계층의 병목을 함께 다루면 수치 견고성과 확장성을 얻을 수 있다는 사례 연구임. 공개 초록에는 수치가 없음.
      refs: [pap575]
