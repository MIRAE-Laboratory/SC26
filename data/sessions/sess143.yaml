id: sess143
type: Session
label: "ExaMPI26: Workshop on Extreme-Scale MPI"
kind: Workshop
topic: 성능·도구
date: "2026-11-16"
time: "14:00-17:30 CST"
room: W175bc
url: https://sc26.conference-program.com/session/?sess=sess143
chairs: [matthew-g-f-dosanjh, william-schonbein, amanda-j-bienz, nikoli-dryden, joseph-schuchart]
summary_ko: "메시지 전달 인터페이스(MPI)의 새 알고리즘과 개념을 다루는 워크숍. MPI 5.0과 다음 판의 기능, 엑사스케일 이후의 방향을 논의함. 초청 강연은 초대형 AI 인프라에서 네트워크가 주된 병목이 됐다고 진단했고, 논문 다섯 편은 통신과 계산의 겹침, 단방향 통신, GPU 사이의 집합 통신, 집합 연산의 자동 튜닝, GPU 프로세스 간 메모리 공유를 다룸."
diagram:
  type: layers
  title: MPI가 GPU와 AI 규모에 맞춰 바뀌는 층
  items:
    - {label: 응용이 보는 모델, note: "태스크와 결합한 통신, 윈도로 감싼 GPU 메모리 공유"}
    - {label: 집합 연산, note: "제약과 실제 실행 경로를 아는 자동 튜닝, 직접 상대를 줄인 전 대 전 교환"}
    - {label: 통신과 계산의 겹침, note: "계산 위주 작업은 거의 완전히 겹치나 메모리 위주 작업은 겹침이 크게 줄어듦"}
    - {label: 네트워크 장치, note: "상대마다 필요한 연결 자원이 장치 메모리를 소진, 초대형 AI에서는 네트워크가 병목"}
insights:
  decision:
    - head: 통신 계층의 선택 기준이 벤더 전용 경로에서 표준 인터페이스로 옮겨 감.
      text: GPU 사이의 전 대 전 교환을 벤더 전용 전송 없이 구현해 전용 라이브러리와 같은 지연을 냈고, GPU 메모리 공유의 여러 단계를 표준 윈도 질의로 감쌌음. 초청 강연은 개방형 고성능 이더넷을 초대형 AI와 HPC의 공통 기반으로 제시함.
      refs: [ws_exampi106, ws_exampi108, misc114]
  trial:
    - head: 자동 튜닝은 측정이 실제 실행 경로를 반영한다는 가정에서 틀어짐.
      text: 집합 연산 알고리즘을 벤치마크로 고르는 기존 방식은 모든 후보가 어디서나 유효하다고 가정함. 제약 때문에 다른 알고리즘으로 조용히 대체되면 측정값이 엉뚱한 알고리즘의 것이 됨. 제약별로 구성 공간을 나눠 학습하자 기본 설정 대비 최대 30.71배 빨라졌음.
      refs: [ws_exampi107]
    - head: 통신과 계산의 겹침은 작업의 성격에 달려 있음.
      text: 진행 스레드를 계속 돌려도 메모리 위주 작업에서는 CPU와 GPU 모두에서 겹침이 크게 줄었음. 계산 위주 작업은 거의 완전히 겹쳤음.
      refs: [ws_exampi105]
    - head: 규모가 커지면 연결 자원이 먼저 바닥남.
      text: 상대마다 전용 연결을 두는 방식은 장치 메모리를 소진함. 교환 그래프를 순환 경로로 나눠 직접 상대를 고정된 소수로 줄이자 장치당 연결이 최대 98% 줄고 지연도 최대 36% 낮아졌음.
      refs: [ws_exampi106]
  korea:
    - head: 다중 GPU 응용의 통신 설정을 실측으로 고름.
      stage: prep
      area: 도입 평가·하드웨어
      needs: 주요 코드의 집합 통신 사용 조사와 시스템별 벤치마크
      needs_group: 계측과 측정 수단
      text: 집합 연산의 기본 알고리즘 선택이 최선과 수십 배 차이 날 수 있고, 자동 튜닝 결과도 조용한 대체 때문에 틀릴 수 있음. 자체 코드가 많이 쓰는 집합 연산을 조사하고, 실제로 어떤 알고리즘이 돌았는지 확인하며 설정을 정하는 절차가 필요함.
      refs: [ws_exampi107, ws_exampi106]
    - head: 메모리 위주 코드는 통신 겹침의 이득을 따로 재 봄.
      stage: now
      area: 도입 평가·하드웨어
      needs: 공개 벤치마크의 설치와 자체 코드의 작업 성격 분류
      needs_group: 계측과 측정 수단
      text: 격자 기반 해석 코드처럼 메모리 대역폭에 묶인 계산은 비동기 통신의 효과가 작을 수 있음. 공개된 겹침 벤치마크로 보유 시스템과 MPI 구현의 조합을 먼저 재 보면 최적화 우선순위를 정할 수 있음.
      refs: [ws_exampi105]
  extra:
    - head: 네트워크가 병목이라는 진단이 AI 인프라와 MPI 양쪽에서 나옴.
      text: 초청 강연은 하루 수조 개의 토큰을 처리하는 AI 서비스에서 가속기의 이점이 네트워크에 달려 있다고 봄. 같은 날의 저장 워크숍에서는 통신과 저장이 한 망을 쓰며 서로를 늦춘 결과가 나왔음.
      refs: [misc114, ws_pdsw101]
