id: sess201
type: Session
label: "Observability and Operational Intelligence for Leadership Systems"
kind: Paper
topic: 운영·인프라
date: "2026-11-17"
time: "10:30-12:00 CST"
room: W175abc
url: https://sc26.conference-program.com/session/?sess=sess201
chairs: [dilma-da-silva]
summary_ko: "리더십급 시스템의 관측과 운영 지능을 다루는 논문 세션. 실행 중인 응용을 조향하며 관측하는 시스템, 작업과 텔레메트리를 이은 2년 치 공개 데이터셋, 텔레메트리 분석 에이전트의 신뢰도 한계, 엑사스케일 시스템의 응용 준비 조직을 다룸."
diagram:
  type: flow
  title: 운영 데이터가 판단으로 이어지는 단계
  items:
    - {label: 실행 중 수집, note: 부담 약 2%로 추적을 모으고 현장에서 99.999% 줄임}
    - {label: 작업과 연결, note: 스케줄러 기록과 노드 텔레메트리를 작업 단위로 합친 데이터셋}
    - {label: 에이전트 분석, note: 과제 구조에 따라 신뢰도의 병목이 다름}
    - {label: 사람과 조직, note: 엔지니어 8명이 응용 약 20개를 지원한 준비 조직}
insights:
  decision:
    - head: 관측은 사후 분석에서 실행 중 조향으로 옮겨 감.
      text: 대규모 추적을 나중에 분석하는 방식은 느리고 굳어 있어, 운영자가 실행 중인 응용의 보기를 그때그때 만들고 조치하는 방식이 제시됨. 4,096 랭크의 적응 격자 코드에서 부담은 약 2%였고 다른 방식은 56~81%였음.
      refs: [pap275]
  trial:
    - head: 텔레메트리 분석 에이전트는 과제의 구조에 따라 다른 곳에서 막힘.
      text: 추출 과제는 용어의 의미를 정리해 주자 73.0%에서 93.5%로 올랐고, 분석 과제는 절차를 아는 검토로 13.2% 나아졌음. 통찰을 내는 과제는 조율을 더해도 나아지지 않고 출력 비용만 약 3배가 됨.
      refs: [pap908]
    - head: 작업과 텔레메트리가 따로 쌓여 있으면 분석마다 손으로 이어야 함.
      text: 스케줄러 기록과 노드 측정이 따로 수집되어, 어떤 응용이 어떤 데이터를 냈는지 가리는 데 수작업이 듦. 2년 치 운영 기록을 작업 단위로 합쳐 공개하는 데이터셋이 나옴.
      refs: [pap535]
  korea:
    - head: 작업 기록과 노드 텔레메트리를 작업 단위로 이어 둠.
      stage: prep
      area: 계측·에너지
      needs: 스케줄러 기록과 텔레메트리의 시간 정합, 저장 정책
      needs_group: 기록과 이력 체계
      text: 전력, 온도, 성능을 작업에 붙여 두면 용량 계획과 이상 탐지, 에너지 분석을 같은 자료로 할 수 있음. 미국의 공개 데이터셋은 수집, 정규화, 대응의 절차를 함께 설명하므로 자체 구축의 참고가 됨.
      refs: [pap535]
    - head: 운영 분석 에이전트는 과제 유형별로 나눠 평가함.
      stage: now
      area: 에이전트·AI 서비스
      needs: 추출, 분석, 통찰 유형으로 나눈 자체 평가 문항
      needs_group: 기준 출력과 시험 자산
      text: 에이전트를 여럿 붙인다고 통찰 과제가 나아지지 않았음. 도입 전에 과제 유형을 나눠 어디에 용어 정리가, 어디에 검토 절차가 필요한지 확인하는 편이 비용을 줄임.
      refs: [pap908]
    - head: 새 시스템 도입 때 응용 준비 조직을 계약에 넣음.
      stage: ref
      area: 도입 평가·하드웨어
      text: 미국의 엑사스케일 시스템은 벤더 엔지니어 8명이 세 연구소의 응용 약 20개를 지원하고 분기마다 합동 작업을 열었음. 조직과 참여 방식의 사례로 참고할 수 있음.
      refs: [pap1017]
  extra:
    - head: 오래 걸리던 성능 이상 진단을 LLM이 조향해 27분 만에 좁힘.
      text: 몇 달 걸리던 수동 진단 사례를 실행 중 관측 시스템과 LLM의 조합으로 재현한 평가임. 관측 도구가 에이전트의 도구가 되는 방향을 보여 줌.
      refs: [pap275]
