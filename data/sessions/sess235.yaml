id: sess235
type: Session
label: "Papers in Conversation: AI Inference Becomes an HPC Systems Problem"
kind: Paper
topic: AI·에이전트
date: "2026-11-18"
time: "10:30-12:00 CST"
room: W181abc
url: https://sc26.conference-program.com/session/?sess=sess235
chairs: [jeffrey-s-vetter]
summary_ko: "AI 추론이 HPC 시스템의 문제가 됐다는 주제로 묶은 논문 세션. 에이전트 워크플로의 문맥 길이와 캐시 재사용에 맞춘 자원 관리, 전문가 혼합 모델을 독립 서비스로 나눈 서빙, 프리필과 디코드의 통합과 분리를 결합한 서빙을 다룸."
diagram:
  type: layers
  title: 추론 서빙에서 자원을 나누는 단위
  items:
    - {label: 워크플로, note: "에이전트 사이의 자원 배분. 지연 57.6% 감소, 처리량 63.1% 증가"}
    - {label: 요청의 단계, note: "프리필과 디코드의 통합과 분리를 섞어 목표 충족 처리량 최대 40% 증가"}
    - {label: 모델의 부분, note: "전문가 모듈을 상태 없는 서비스로 분리. 장애 때 처리량 손실 2% 미만"}
insights:
  decision:
    - head: 서빙의 기준이 처리량에서 지연 목표를 지킨 처리량으로 옮겨 감.
      text: 첫 토큰까지의 시간과 토큰 간 시간이라는 두 지연 목표를 함께 두면, 통합형과 분리형 모두 목표가 균형일 때 크게 뒤처짐. 여유가 남는 요청의 지연을 다른 요청으로 옮기는 원칙으로 목표 충족 처리량이 최대 40% 올랐음.
      refs: [pap819]
  trial:
    - head: 에이전트 워크플로는 기존 서빙 자원 관리의 전제를 깸.
      text: 에이전트 여럿이 협업하면 문맥 길이가 크게 치우치고 에이전트마다 캐시 재사용 양상이 다름. 이를 무시한 자원 관리 대신 문맥 중심으로 자원을 나누자 지연이 57.6% 줄고 처리량이 63.1% 늘었음.
      refs: [pap104]
    - head: 모델을 한 덩어리로 서빙하면 일부의 장애가 전체를 멈춤.
      text: 전문가 혼합 모델은 전문가가 드문드문 예측 불가하게 활성화되어 서빙이 불안정함. 전문가 모듈을 독립된 상태 없는 서비스로 나누자, 통짜 구조를 멈추게 할 장애에서도 처리량 손실이 2% 미만이었고 자원을 최대 37.5% 아꼈음.
      refs: [pap132]
  korea:
    - head: 기관 LLM 서비스의 목표를 지연 기준으로 적어 둠.
      stage: now
      area: 에이전트·AI 서비스
      needs: 첫 토큰 시간과 토큰 간 시간의 목표값 합의
      needs_group: 절차와 문서 정리
      text: 자체 서빙을 운영할 때 처리량만 보면 사용자 경험과 어긋남. 두 지연 목표를 먼저 정하고 그 안에서의 처리량으로 구성과 용량을 평가하는 방식이 근거를 갖춤.
      refs: [pap819]
    - head: 에이전트 사용이 늘면 서빙 자원을 문맥 길이별로 나눔.
      stage: prep
      area: 에이전트·AI 서비스
      needs: 에이전트 요청의 문맥 길이와 캐시 재사용 기록
      needs_group: 기록과 이력 체계
      text: 에이전트 워크플로의 요청은 길이가 크게 치우쳐 일반 요청과 섞으면 서로를 늦춤. 요청 기록부터 모아 분포를 확인하는 것이 선행 작업임.
      refs: [pap104]
  extra:
    - head: 일요일 워크숍의 진단이 본 학회 논문에서 구체적 설계로 이어짐.
      text: 에이전트가 사람 기준으로 설계된 인프라의 전제를 깬다는 진단이 워크숍에서 나왔고, 이 세션은 서빙 계층에서 그 전제를 바꾼 설계를 제시함.
      refs: [pap104, ws_aaihpc124]
